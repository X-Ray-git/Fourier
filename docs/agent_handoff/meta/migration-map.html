# 旧文档迁移映射

本页记录 Wiki 重构前后的完整映射，确保没有旧文档被静默遗漏。原则：内容仍然有效的进入对应专题页；长期设计取舍进入决策页；仅有历史价值的内容进入历史归档并标注“历史资料”；旧 `.md` 页面统一转换为同名 `.html` 单文件页面（正文仍为 Markdown，内嵌于 `<script type="text/markdown">`）。

## 转换方式

| 转换 | 说明 |
|---|---|
| `.md` → 同名 `.html` | 正文以 Markdown 内嵌在页面中，编辑与阅读同一文件 |
| 内部链接 `.md` → `.html` | 全部 265 处相对链接由转换器机械改写，锚点（如 `legacy-xxx`）保留 |
| 根 `index.html` | 旧营销页（590 行，含远程字体依赖）替换为 Wiki 入口 |
| `docs/agent_handoff/README.md` | 阅读顺序与知识地图并入根 `index.html` 首页，原文件删除 |

## 敏感信息检查结论

迁移前已扫描全部文档与根文件：未发现本机用户目录绝对路径（如以用户主目录开头的路径）、真实 Session Token、API Key 或账号标识；文档中仅出现概念性字段名（如 `__Secure-better-auth.session_token` 的用途描述），不构成敏感信息。`reference/`、`scratch/` 已被仓库 `.gitignore` 排除，不在迁移范围。

迁移完成后的长期设计取舍（单文件 HTML 页面体系、首页兼具宣传页、内联 SVG 图形、releases.html 单一产物等）统一记录在 [决策日志](../history/decisions.html)；页面结构与组件说明见[站点指南](site-guide.html)。本页只负责“旧文件到哪里去了”的映射，不再重复决策理由。
