# 开发流程

面向后续 agent 与开发者的日常开发入口。当前工具链对齐 Flutter `3.44.6`（项目最低约束 Flutter `>=3.44.0`、Dart `^3.12.2`）。

## 快速开始

```bash
flutter pub get
flutter run -d macos       # macOS
flutter run -d <device-id> # Android
```

首次配置：应用内设置页填写 **Folo Session Token**（Folo Web 应用的 Cookie）与 **DeepSeek API Key**（翻译、摘要和垃圾拦截功能需要）。

## 常规检查

```bash
dart analyze lib test
flutter analyze lib test
flutter test
flutter build macos --debug
```

迭代时可以使用更小范围的检查：

```bash
dart analyze lib/pages/article/article_page.dart
flutter test test/article_model_test.dart test/feed_model_test.dart test/html_entity_utils_test.dart
```

## 不要依赖完整 dart analyze

```bash
dart analyze    # 不要使用
```

原因：仓库的 `reference/` 下有复制来的参考工程；完整 `dart analyze` 会把它们也扫进去，并产生无关错误。CI 使用 `flutter analyze --no-fatal-infos lib test`。

## macOS 本地 UI 验证

```bash
flutter run -d macos
```

或者：

```bash
flutter build macos --debug
open "build/macos/Build/Products/Debug/Fourier.app"
```

不要把本地 macOS release 构建作为主要 UI 验证目标。本地环境可能把 release 产物视为 ad-hoc 签名或未知证书链，从而造成启动/framework 加载问题；这不一定和当前代码有关。

如果 macOS Debug 出现“构建成功但等不到 debug connection”：

```bash
flutter clean
flutter pub get
flutter run -d macos --no-pub
```

当前 Debug 配置依赖 `ENABLE_DEBUG_DYLIB = NO` 避免 `Fourier.debug.dylib` 被 macOS 系统策略拒载。验证时应看到 `A Dart VM Service on macOS is available at:`。

## 动画诊断

复现 `M/K`、审核横滑或主时间线双击偶发瞬移时，以 Debug 埋点运行：

```bash
flutter run -d macos --no-pub \
  --dart-define=AUTO_FOLO_ANIMATION_PROBE=true \
  2>&1 | tee /tmp/fourier-animation.log
```

按页面过滤 `ReviewAnimProbe`、`TimelineAnimationProbe`、`TimelineTapProbe`、`TimelineListResetProbe`、`TimelineReadStateProbe`。埋点只输出文章 id 末 8 位、动作来源、列表数量、动画阶段和慢帧耗时，不输出标题、正文、凭据或完整文章 id。不要为了普通运行长期打开该开关。

## 文档维护

- 更新当前工作对应的专题页；长期有效的取舍写入 `history/decisions.md`。
- 用 `history/historical-map.md` 定位旧上下文；历史归档不追加当前事实。
- 编辑 wiki 页面的方法见 [站点指南](../meta/site-guide.html)。
- 除非确实要保留原始时间线记录，否则不要继续向完整归档追加新工作。
