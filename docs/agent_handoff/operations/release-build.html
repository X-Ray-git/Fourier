# 发布与构建

除非用户明确要求，否则不要创建 release。

用户约定（2026-09-24）：今后用户说“打包”，默认要求完成构建并发布正式 GitHub Release，构成发布授权；不得只触发 workflow_dispatch 产物构建就视为完成。明确说“只构建”“不发布”时按限定范围执行。仍须遵循下述 main 分支、release.sh、版本规则、预检、annotated tag 与发布验证流程。该约定面向后续请求，不自动把此前已触发的仅构建任务升级为发布。

当前发布流程：

- 唯一正式发布入口：在干净 `main` 执行 `scripts/release.sh <version> --notes-file <file> --push`。本机只推送并 dispatch `.github/workflows/publish-release.yml`，确认受理即返回；不用 nohup，不依赖终端或 agent 继续存活。不带 --push 仅做 dry-run，不创建本地 tag。
- `Publish Release` 同一 run 按依赖执行：校验版本/候选 SHA/说明 → reusable Release Preflight（静态分析、测试、Android/macOS 冒烟）→ prepare_release.py 创建版本提交、历史记录、annotated tag → reusable 构建发布 worker → 核验正式 Release 与 APK、arm64 ZIP、appcast 完整上传。
- 不依赖 GITHUB_TOKEN 推 tag 触发下游工作流，因为 GitHub 会抑制该 push 的递归触发；父工作流直接 uses 调用发布 worker，并传入准确发布 SHA 和 tag、inherit secrets。
- `internal-release.yml` 的手动入口明确命名为 Build Artifacts / Release Worker，只用于明确要求的仅构建；不能把其手动运行当成发布。历史用户推 tag 仍兼容。
- 全链路串行发布。预检失败不创建版本/tag；预检期间 main 前移会明确失败，重新 dispatch 即可。main 与 tag 原子推送，绝不 force-push。创建 tag 后若构建/上传失败，可重跑：先核对 tag 的父提交、版本与说明完全匹配，复用 tag，不再升构建号。
- 一般候选是当前 main。补发历史 main 候选时明确传 `--candidate <full-sha>`：云端确认属于 main 历史，仅在候选上增加发布元数据后打 tag；main 单独同步版本与历史，保留后续代码，避免把未授权依赖变更混入补发。发布工作流代码来自触发时 main，应用代码固定为候选；两者不得混淆。
- “完整流程已受理”不等于“已发布”。按用户约定只确认完整 Publish Release run 已启动并提供链接，不持续等待最终结果；实际成功由末尾 Release/附件核验决定，失败由用户反馈后排查。
- 本地和 GitHub Actions 统一使用 Flutter `3.47.0`；项目最低约束为 Flutter `>=3.47.0`、Dart `^3.13.0`。升级 SDK 时必须同步检查 `pubspec.yaml`、lockfile 和两个工作流中的 Flutter pin，不能只改本机。
- GitHub 预检以干净的官方 SDK 为基线，再执行仓库跟踪的
  `scripts/apply_flutter_patches.sh`；这是发布兼容性与视觉一致性的权威结果。
  当前补丁只包含文章选择统一行高、`WidgetSpan.rawText` 及其复制映射，不得把
  本机 Flutter SDK 中其他未审计实验修改混入发布。补丁固定校验 framework
  revision，不匹配时必须先审计迁移，不能模糊应用。
- macOS 发布包必须保持 arm64。
- macOS job 固定使用 `macos-26` ARM64 runner。原生侧边栏使用了 macOS 26 SDK 的 `NSGlassEffectView`，不要改回默认仍可能选择 Xcode 16 的 `macos-latest`，否则 CI 可能在 Swift 编译阶段失败。
- macOS 原生插件已迁移为纯 Swift Package Manager。仓库不再保留 `macos/Podfile`、`Podfile.lock` 或 Xcode Pods 引用；`screen_retriever` 至少保持 `0.2.2`，该版本修复了其 macOS SwiftPM manifest。若构建再次输出 `Running pod install`，应先排查是否误恢复 CocoaPods 集成。
- 每次发布的候选 SHA、构建号和说明由云端 `scripts/prepare_release.py` 追加到 `docs/agent_handoff/history/releases.html`（内嵌 Markdown）；根 `AGENT_HANDOFF.md` 始终保持为短入口。

## 依赖维护（2026-09-25）

`pub get` 的 available / newer versions incompatible with dependency constraints 列表是版本提醒，不能等同于解析失败；必须看是否 Got dependencies，以及实际 error。用户原粘贴日志真正阻断运行的是 Xcode 许可未接受，已另行解决。锁文件用于固定可复现依赖，不为了清除提示一键升级所有包。

本次优先提高 `dio` 最低版本至 ^5.11.1、`flutter_cache_manager` 至 ^3.4.5；解析只更新这两项及后者要求的 `uuid` 4.6.0。缓存管理器修复图片缩放解码错误传递、缓存元数据写入与删除路径，Dio 修复流式背压和请求/拦截器挂起；不能将这些上游修复直接认定为此前卡图的根因。继续保留应用自有图片下载超时、缓存目录与动图暂停逻辑。

其余依赖安排：路径/窗口等小版本需按对应原生变更单独验证；cached_network_image 4、分享、权限、取色及弹窗大版本需要迁移评估；video_player 和 WebView 虽有约束内更新，也需媒体播放/登录回归后再升级。SDK 固定及工程 Flutter 选择补丁保持原样，SDK 固定的传递包不使用 dependency_overrides 强行追新。升级后仍有 76 项新版提示是预期，Flutter SDK 升级提示也不自动构成升级任务。

本机 Xcode 组件初始化（如 sudo xcodebuild -runFirstLaunch）只影响本机，不会经 Git 同步到 GitHub Actions；pubspec.yaml 与 pubspec.lock 的依赖变更提交推送后才影响后续云端构建。本轮仅提交推送，不触发构建工作流、不修改版本号或创建 tag。

## 版本号规则

`pubspec.yaml` 的 `version: X.Y.Z+N` 是唯一版本来源：

- `X.Y.Z` 是用户可见版本，并对应 annotated tag `vX.Y.Z`。
- `N` 是单调递增的内部构建号；Android 使用它作为 `versionCode`，macOS 使用它作为 `CFBundleVersion`。
- Major、Minor 或 Patch 变化时都不能重置构建号。
- 普通 commit 不修改版本号；只有真正创建发布时才由云端 `scripts/prepare_release.py` 更新版本并把构建号加一。
- 不要手工同步 Android、macOS、设置页或请求头中的版本；这些位置应继续从 Flutter/pubspec 版本读取。

面向当前个人应用的版本语义：

- **Major（`2.0.0`）**：产品定位根本变化，或配置、本地数据、安装身份和核心工作流出现无法平滑迁移的不兼容。单纯 UI 大改通常不升 Major。
- **Minor（`1.2.0`）**：新增明确功能或工作流，一批相关功能形成新阶段，或者完成重要但保持用户数据兼容的 UI/架构重构。
- **Patch（`1.2.1`）**：Bug 修复、性能优化、视觉微调和小范围行为完善，不引入新的主要工作流。

历史 `v1.1.1` 到 `v1.1.28` 长期把功能和重构也作为 Patch 发布，不重写这些历史。从下一次发布开始执行上述规则。`v1.1.28` 之后已积累 Android 主导航与设计迁移、静默订阅源批量导出、macOS Undo/Redo、媒体与缓存能力、认证/设置收敛、SwiftPM 和许可证体系，因此观察稳定后应进入 `v1.2.0`；如果期间没有其他发布，对应 pubspec 为 `1.2.0+31`。

当前脚本和 CI 只接受纯 `X.Y.Z`，尚未支持 `1.2.0-beta.1`。不要只改 tag 或 pubspec 来临时创建预发布版；若未来确实需要 Beta，必须先统一修改 release 脚本、pubspec/tag 校验、GitHub Actions 和 GitHub Release 的 prerelease 标记。

Release notes 规则：

- GitHub Release 正文默认必须保持统一结构：`本版重点`、至少一个内容章节（如
  `新功能`、`修复与改进` 或 `升级说明`），以及 `完整变更` 对比链接。
- 较长说明优先写入临时 Markdown 文件并通过 `--notes-file <path>` 传入，避免
  shell 多行引号破坏格式；`-m` 仍可直接传入完整 Markdown。
- 正式云端发布要求上述统一结构；旧例外选项仅用于本地验证，不用于云端发布。
- `scripts/release.sh` 默认拒绝 `-m` 中的字面量 `\n`。
- 真实换行使用 ANSI-C quoting：

```bash
./scripts/release.sh 1.2.3 -m $'- fix: first item\n- feat: second item' --push
```

上例仅说明真实换行的 shell 写法；正式 Release 仍需满足上述章节结构。

- 如果确实需要字面量 backslash-n，使用 `--allow-literal-backslash-n`。

签名：

- Android 包名相同但签名 key 不同时会安装冲突。
- 项目已通过 GitHub Secrets 让 GitHub 内部构建签名与用户本地 debug keystore 对齐。
- GitHub Secrets 不存放在仓库中。
- macOS 应用内更新使用 Sparkle `2.9.6`。仓库只保存 `SUPublicEDKey`，私钥只允许存在于本机登录钥匙串的 Sparkle 项和 GitHub Actions `SPARKLE_PRIVATE_KEY` Secret，禁止写入代码、文档、日志、Release 或普通文件备份。
- macOS tag 构建完成后，workflow 从 SwiftPM artifact 中调用 Sparkle `generate_appcast`，通过标准输入读取私钥，为 arm64 ZIP 生成 Ed25519 签名并把 annotated tag 正文嵌入 `appcast.xml`。Release 必须同时上传 ZIP 与 `appcast.xml`；稳定 feed URL 为 `https://github.com/X-Ray-git/Fourier/releases/latest/download/appcast.xml`。
- `generate_appcast` 的 CI 参数使用 `--ed-key-file -`，不要把 Secret 落盘；appcast 只保留当前完整包，不生成 delta。若 Sparkle 升级，必须同步维护 Xcode 精确版本、`Package.resolved`、第三方许可和 workflow 工具路径，并先做本地签名烟雾测试。
- Android 应用内更新依赖 GitHub Release asset 自动提供的 `sha256:` digest。不要删除、重命名 `Fourier-android-vX.Y.Z.apk` 规则，除非同步修改客户端选择逻辑和测试。

本地构建命令：

```bash
flutter build apk --debug
flutter build macos --debug
```

Flutter `3.44.6` 迁移完成时，本机已通过 Android Debug、macOS Debug 和 macOS Release 构建，Release 主程序确认为 arm64。以后本地 release 失败仍应先区分签名/framework 环境问题与代码回归。

Flutter `3.47.0` 迁移已通过 237 项 Flutter 测试、静态分析、Android Debug 和 macOS Debug 构建。Flutter 已将 macOS 最低部署版本提升为 `12.0`。Android 构建仍成功，但工具链提示 Gradle `8.14`、AGP `8.11.1`、Kotlin `2.2.20` 将在后续 Flutter 版本停止支持；三者应作为独立联动迁移处理，不要仅为消除提示单独升级其中一项。
