<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Fourier Video</title>
    <style>
      html,
      body,
      #video-container,
      video {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      #video-container {
        position: relative;
      }

      .shaka-video-container,
      .shaka-controls-container {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      }

      video {
        object-fit: contain;
      }

      .shaka-spinner-container,
      .shaka-spinner {
        display: none !important;
      }
    </style>
    <script type="module" crossorigin src="./embed_video_player.js"></script>
    <link rel="stylesheet" crossorigin href="./embed_video_player.css">
  </head>
  <body>
    <div id="video-container">
      <video id="video" autoplay playsinline></video>
    </div>
  </body>
</html>
