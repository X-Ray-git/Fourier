# 数据同步与状态传播

Fourier 以 Folo 服务端为数据权威，本地 Hive 提供缓存与已读覆盖；同步结果通过共享目录、响应式状态和 `ArticleStateNotifier` 传播到各页面。

## 同步入口

- 订阅源与文章同步集中在 `SubscriptionCatalogService`：启动和手动刷新都会同步普通订阅与 Inbox；成功分区按远端快照新增/移除，失败分区保留旧缓存，从其他客户端新增订阅后无需重启即可出现在侧边栏，同时不会删除历史文章或 feed 级本地设置。
- 垃圾拦截页同步时可以复用 `TimelineController.loadFeedsThenArticles()`，然后刷新本页本地审核列表。
- 已读同步：本地 + Folo 云端双向。`ReadSyncService` 维护待同步已读任务。

## 已读状态合并规则

- `readStatus` 只是本地已读/未读覆盖状态，不是文章真实已读状态的唯一来源。同步成功或本地库刷新后，覆盖状态可能被清掉。
- 读取文章已读状态时优先使用 `LocalArticleDbService.readOverrideOf(entryId)`；如果没有本地覆盖，再回退到 `ArticleModel.isRead`。不要直接把 `GStorage.readStatus.get(entryId, defaultValue: false)` 当作最终状态，否则最近阅读等已读文章会被错误显示为未读。
- 本地标为已读后的 `readStatus == true` 是跨请求竞态保护，不能在 mark-read HTTP 成功时立即删除。未读请求可能比 mark-read 更早发出并返回旧快照；只在后续成功未读快照明确不再包含该文章时，才清除覆盖并以本地数据库中的已读状态继续。主时间线和订阅源详情必须遵循同一规则。
- 自动翻译/摘要只在正文持久化后、准备入队时读取最新本地已读状态：当时已读则不入队，当时未读则正常入队且后续不因标记已读而取消。
- 所有实际 `POST /reads` 出口统一写入 `AnalysisEventLedger` 的 attempt/result 审计事件，来源包括 `articleController`、`singleAction`、`batchAction` 和 `pendingQueue`。待同步队列请求同时携带最初入队时间；请求结果记录耗时、HTTP 状态或失败类型。账本写入是尽力而为，存储异常不得阻断已读同步。
- 本地 `mark_read` / `mark_unread` 事件描述状态变化意图，远端 attempt/result 描述实际网络请求，`syncInference` 描述后续服务端快照。诊断时必须联合三类证据，不能把服务端已读快照直接等同于本机用户操作。

## 账号切换隔离

- 账号切换使用两阶段隔离：清理开始时进入 transitioning 并推进一次 `AccountSessionGuard` revision，此时 `Request` 直接拒绝新 Folo 请求；凭据持久化结束后退出 transitioning 并再次推进 revision。旧账号请求即使网络层成功返回、或恰好在清理窗口内启动，也必须作为 cancel 拒绝，不能进入业务合并逻辑。
- 翻译、摘要、过滤、正文抓取和图片下载还各自在落盘前复核 revision/generation；`ReadSyncService` 的旧待同步已读任务和 `SubscriptionCatalogService` 的旧目录同步也必须捕获 revision。账号变化后不得继续重试、补写时间戳、删除新账号队列项或把旧订阅缓存重新写回。
- 图片缓存切换时清空 `DefaultCacheManager`，运行中的旧下载完成后必须依据 generation 删除其结果。
- 清理后必须重置 `LocalArticleDbService` 内存缓存、订阅目录、正文规范化缓存、长度估算缓存、AI 运行时记录和 Undo/Redo，并发出全量文章状态通知。

## 页面传播

- `ArticleStateNotifier` 用于跨页面刷新文章状态；`ArticleStateNotifier.tick()` 会同步扇出到最近阅读全库读取/排序、订阅源未读计数、订阅源详情和垃圾拦截等页面。
- 会移除卡片时，跨页面通知由 `completeDeferredReadTransition(entryId)` 在真实 `onRemoveEnd` 后再跨一个 `endOfFrame` 发出，避免其他页面的同步工作吞掉 180ms 退场动画。
- 当 service 记录被删除时，避免继续回退到过期 controller 缓存。近期 bug：从卡片右键菜单删除摘要后，`SummaryService` 记录已删除，但文章详情仍显示缓存的 `controller.summaryText`。修复后的行为是：可见摘要状态应信任 service 记录。
