# 产品定位

Fourier 是一个个人使用的高密度 RSS/Folo 聚合阅读客户端，基于 Flutter，支持 Android 与 macOS。它是 X-Ray 个人使用的软件，围绕 Folo 使用场景构建，但**不是** Folo、RSSNext 或其运营方的官方客户端，也不代表官方发布版本。

## 核心价值

- 同步 Folo 文章，按源筛选，逐块渲染长文，并基于 DeepSeek 完成可配置的翻译、摘要与垃圾拦截判定。
- 聚焦高密度信息流阅读：时间线、未读/全部/已读模式、长度排序、macOS 分栏阅读。
- 所有 AI 能力（翻译、摘要、垃圾拦截）都是辅助工具，最终决定始终由用户做出。

## 主要功能

- **时间线** — 未读/全部筛选、最近阅读、长度排序与 macOS 分栏阅读。
- **订阅源** — Articles / Social Media / Inbox 分组，分类与订阅源筛选、搜索、静默订阅源。
- **文章阅读** — HTML 拆块渲染、目录跳转、Markdown 复制、图片画廊与视频播放（普通视频、YouTube、Bilibili）。
- **垃圾拦截** — DeepSeek 判定后进入独立审核页，可保留或移除，不直接替用户做最终决定。
- **已读同步** — 本地 + Folo 云端双向同步。
- **AI 翻译 / 摘要** — 独立 LLM 配置与后台队列；自动任务只服务仍未读的文章。
- **配置迁移** — 设置可导出为 JSON 并通过剪贴板导入。
- **桌面体验** — macOS 原生分栏、克制的 Liquid Glass、右键菜单、快捷键与同步状态反馈。

## 优先级

- 快速、可重复的阅读工作流。
- 低摩擦的 macOS 分栏阅读体验。
- 稳定的 Android 行为。
- 同步、翻译、摘要、过滤任务要有清晰反馈。
- 避免 UI 看起来像 Folo 官方品牌，或暗示官方所有权。

## 身份与命名空间

- 产品名：`Fourier`；Dart package 名：`fourier`。
- Android applicationId / macOS bundle id / MethodChannel 命名空间统一为 `io.github.xraygit.fourier`。
- 历史 `com.folo.*` 与 `com.autofolo` 引用已经废弃，不得重新引入。
