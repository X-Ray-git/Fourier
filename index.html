# Auto Folo 工程 Wiki

Auto Folo 是个人使用的高密度 RSS/Folo 聚合阅读客户端（Flutter，Android + macOS）。本 Wiki 是唯一的工程知识库：当前事实、专题知识、操作流程、设计规则与历史上下文都维护在这里，以 Markdown 为内容载体，双击本页即可离线浏览。

> 本 Wiki 的入口是仓库根目录的 `index.html`；每个专题页是自包含的 `.html` 单文件，正文以 Markdown 内嵌，编辑与阅读同一个文件。维护方法见[站点指南](docs/agent_handoff/meta/site-guide.html)。

## 推荐阅读顺序

1. [当前状态](docs/agent_handoff/status/current.html) — 最近的集成分支、产品形态与用户验证结论
2. [待办与搁置事项](docs/agent_handoff/status/pending.html) — 当前有效的未来事项索引
3. [验证记录](docs/agent_handoff/status/verification.html) — 仍需持续观察的开放验证项
4. [开发流程](docs/agent_handoff/operations/development.html) — 常用命令与检查方式
5. 当前任务对应的专题页
6. 需要历史证据时查[历史主题归档](docs/agent_handoff/history/archive/README.html)；按旧章节编号查找使用[历史时间索引](docs/agent_handoff/history/chronology.html)

## 硬性规则

- 除非用户明确要求，否则不要创建 tag 或发布 release；发布只允许从 `main` 分支通过 `scripts/release.sh` 进行。
- Flutter 项目健康检查优先使用 `dart analyze lib test`、`flutter analyze lib test` 和有针对性的 `flutter test`；完整 `dart analyze` 会扫描 `reference/` 并报告无关错误。
- 不要把密钥、API 响应、抓取的真实文章 HTML、临时脚本提交进 git。此类内容放进已忽略的 `scratch/`。
- 当前应用标识命名空间是 `io.github.xraygit.autofolo`；历史 `com.folo.*` / `com.autofolo` 引用已经废弃。
- macOS 发布产物必须保持 arm64。

## 维护规则

- 这个知识库只保留当前仍有用的知识；专题页继续变大时按子专题拆分，不要无限追加。
- 原始历史证据按主题保存在 `history/archive/`；提炼总结时不要删除归档。`history/timeline.html` 只用于兼容旧链接，不再追加内容。
- 记录决策时优先写入 `history/decisions.html`，包含背景、决策、后果和“不要回退”的说明。
- 更新文档后运行 `./scripts/docs.sh index` 重新生成搜索索引，并运行 `./scripts/docs.sh check` 验证链接与一致性。
