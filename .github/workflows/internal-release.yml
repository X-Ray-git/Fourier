name: Internal Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate Release Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PUBSPEC_VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "Could not parse pubspec.yaml version."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC_VERSION."
            exit 1
          fi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Test
        run: flutter test

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Collect APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Fourier-android-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fourier-android
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS App
    runs-on: macos-26
    needs: validate-version

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib test

      - name: Test
        run: flutter test

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto --arch arm64 \
            "build/macos/Build/Products/Release/Fourier.app" \
            "dist/Fourier.app"
          file "dist/Fourier.app/Contents/MacOS/Fourier" | grep arm64
          ! file "dist/Fourier.app/Contents/MacOS/Fourier" | grep x86_64
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Fourier.app" \
            "dist/Fourier-macOS-arm64-${GITHUB_REF_NAME}.zip"
          rm -rf "dist/Fourier.app"

      - name: Generate signed Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing SPARKLE_PRIVATE_KEY secret."
            exit 1
          fi
          SPARKLE_TOOLS_DIR="$(find build/macos -type d -path '*/artifacts/sparkle/Sparkle/bin' -print -quit)"
          if [ -z "$SPARKLE_TOOLS_DIR" ] || [ ! -x "$SPARKLE_TOOLS_DIR/generate_appcast" ]; then
            echo "Could not locate Sparkle generate_appcast tool."
            exit 1
          fi
          ARCHIVE="dist/Fourier-macOS-arm64-${GITHUB_REF_NAME}.zip"
          NOTES="${ARCHIVE%.zip}.md"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$NOTES"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$SPARKLE_TOOLS_DIR/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --embed-release-notes \
              --maximum-deltas 0 \
              -o dist/appcast.xml \
              dist
          rm "$NOTES"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: fourier-macos
          path: |
            dist/*.zip
            dist/appcast.xml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android
      - macos
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force --no-tags origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          if [ "$(git cat-file -t "refs/tags/$TAG_NAME")" != "tag" ]; then
            echo "$TAG_NAME must be an annotated tag. Use scripts/release.sh to create releases."
            exit 1
          fi
          ANNOTATION="$(git tag -l --format='%(contents)' "$TAG_NAME")"
          if [ -z "$(printf '%s' "$ANNOTATION" | tr -d '[:space:]')" ]; then
            echo "$TAG_NAME has an empty annotation. Refusing to create release notes from a commit message."
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --title "$TAG_NAME" \
              --notes "$ANNOTATION"
          fi
