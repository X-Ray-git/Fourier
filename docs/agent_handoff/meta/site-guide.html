# 站点指南

本 Wiki 采用**单文件 HTML 页面体系**：每个专题页是一个自包含的 `.html` 文件，正文以 Markdown 语法写在 `<script type="text/markdown" id="wiki-content">` 中，阅读时由仓库内置的 markdown-it 在浏览器内渲染。克隆仓库后**双击根目录 `index.html`** 即可使用，不需要安装依赖、不需要启动服务、不需要任何构建步骤。

## 核心约束

- 不使用 ES Module、Service Worker、动态 import、远程 CDN 或必须启动 HTTP 服务的功能。
- 禁止使用浏览器网络请求 API 读取本地文件（`file://` 下会被安全策略拦截）。
- 全部 JavaScript、CSS、字体与图形资源都保存在仓库内，路径均为相对路径。
- 编辑和阅读使用同一个页面文件；不维护独立的 Markdown 源与生成后的 HTML 副本。

## 页面结构

每个 `.html` 页面由转换器从统一模板生成，正文部分如下：

```html
<script type="text/markdown" id="wiki-content">
# 页面标题

正文使用 Markdown 编写…
<\/script>
```

- `<meta name="wiki-base">`：当前页面到 `docs/agent_handoff/` 的相对前缀（根 `index.html` 为 `docs/agent_handoff`）。
- `<meta name="repo-root">`：当前页面到仓库根目录的相对前缀。
- `<title>` 与页面主标题由正文第一个 `# ` 标题决定。

## 编辑规则

1. 直接编辑 `.html` 中 `wiki-content` 脚本块里的 Markdown 正文。
2. 内部链接使用相对路径的 `.html` 结尾：`[设置](features/settings.html)`、`[决策日志](history/decisions.html#决策日志)`。
3. 标题锚点由 markdown-it-anchor 自动生成：中文保留原文、空格转 `-`、去除标点。跨页锚点链接目标与生成规则一致。
4. 允许可信的 HTML：图表格、横幅、提示块等可以写在正文中（`html: true`）。
5. 正文中不得出现字面量 `<\/script`；确有需要时写成 `\<\/script`（渲染时自动还原）。
6. 图形使用内联 SVG（见下方），不要使用 Mermaid。

## 图形

- 每个图形是 `div.dg` 包裹的内联 `<svg>`（`div` 包装确保 Markdown 解析器按原始 HTML 块透传）。
- 颜色、线型、节点与箭头样式统一由 `assets/theme.css` 的 `dg-*` 类与 CSS 变量提供，随明暗主题切换。
- 动画只用于解释状态变化（如箭头流动），通过 `@media (prefers-reduced-motion: reduce)` 全局禁用。
- SVG 需要 `viewBox` 与 `role="img"` + `<title>`/`<desc>`，保证响应式缩放与可访问性。

## 页面呈现（自动组件）

以下组件由 `assets/app.js` 与 `assets/theme.css` 在阅读时自动生成，不需要在正文中手工编写：

- **页面横幅**：每个专题页顶部自动生成静态分区色带（图标 + 标题 + 首段摘要 + 专题标签 + 阅读时长估算徽章），只播放一次轻量入场。首页不生成横幅。
- **阅读进度条**：页面顶部细进度条，跟随滚动位置。
- **代码复制按钮**：每个代码块右上角悬停出现“复制”，点击写入剪贴板。
- **标题锚点提示**：悬停 h2/h3/h4 时左侧出现 `#` 链接标记。
- **键帽样式**：正文中 `` `Cmd+Z` ``、`` `M` `` 这类快捷键行内代码可写成 `` `<kbd>Cmd+Z</kbd>` ``，或直接使用反引号由转换规则生成键帽。
- **“不要回退”调用框**：决策页中的 `不要回退：` 列表会被包装为可折叠的警示框（默认展开），格式为 `<details class="dg-callout" open>`。
- **命令面板**：`Cmd/Ctrl+K` 打开（搜索页面 + 动作 + 快捷键帮助），`?` 直接查看帮助。
- **阅读设置**：右下角 `Aa` 按钮调整字号 / 行距 / 正文宽度 / 动效开关（localStorage 持久化，`file://` 下不可用时自动忽略）。
- **键盘导航**：`/` 聚焦搜索、`n`/`p` 上/下页、`t` 返回顶部；输入框焦点与中文输入法组合键时全部跳过。
- **图形灯箱**：点击任意示意图用原生 `<dialog>` 放大查看。
- **模糊搜索**：内置 CJK 友好的轻量模糊匹配（标题 > 小标题 > 正文加权），无第三方依赖。
- **打印样式**：`@media print` 输出干净的正文排版，可导出 PDF。
- 所有动画与过渡都受 `prefers-reduced-motion` 保护；视觉与交互规范见 [设计规范](design-guide.html)。

## 首页

根 `index.html` 是 Fourier 与工程 Wiki 的共同入口。首屏使用新品牌标识、简短定位、当前状态入口和真实产品截图；后续依次呈现核心能力、处理流水线和专题导航。首页不使用虚构统计数字，也不通过超长 sticky 场景制造额外滚动距离。

区块进入视口时使用轻量透明度与位移动画，子项短暂错峰；不对标题做滚动缩放，不使用模糊滤镜。全部动效受 `prefers-reduced-motion` 和阅读设置中的动效开关保护。落地页标记 `wiki-full`，运行时隐藏侧栏与目录；其中链接使用 `docs/agent_handoff/` 前缀（页面位于仓库根）。

## 导航与搜索

- 侧边栏导航清单：`assets/data/nav.js` 中的 `window.WIKI_NAV`（手维护）。新增/重命名页面后必须同步更新。
- 站内搜索索引：`assets/data/search-index.js` 中的 `window.WIKI_SEARCH_INDEX`。修改内容后运行：

```bash
./scripts/docs.sh index
```

索引生成后随内容一起提交；阅读端始终使用已提交的索引，不需要再运行任何生成过程。

## 命令

```bash
./scripts/docs.sh check    # 链接/锚点/转义/敏感信息/索引新鲜度检查
./scripts/docs.sh index    # 重新生成搜索索引
./scripts/docs.sh convert  # （一次性）从 .md 工作态转换页面
```

## 历史页面

`history/archive/` 与 `history/timeline.html` 属于历史资料：页面顶部有“历史资料，当前事实以专题页为准”横幅。归档不追加当前事实；新结论写入对应专题页或 `history/decisions.html`。

## 品牌信息

页面外壳中的站点名会出现在全部专题 HTML，品牌色和页头标识由 `assets/theme.css` 维护，首页产品文案位于根 `index.html`。变更品牌时必须同时更新页面外壳、当前专题正文、搜索索引和交接入口；历史归档正文保留当时名称作为证据。
