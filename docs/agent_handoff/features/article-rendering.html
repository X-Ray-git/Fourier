## 图片慢加载与超时（2026-09-24）

图片显示与后台预取统一使用 ImageNetworkCache，沿用 libCachedImageData 目录和原缓存键，不清缓存。下载连接独立持有：等待响应头最多 20 秒、连续无数据最多 20 秒、单次总时长最多 90 秒；超时关闭实际连接并向调用方报错，避免仅 Future.timeout 留下后台占用。正文沿用最多 3 次自动重试及 1/2/4 秒退避，耗尽后显示手动重试。HTML 内嵌非 emoji 图片复用正文独立图片的状态组件，避免只有 broken-image 图标而无法重试。加载圈在 4 秒后替换为图片图标及“等待图片加载”，窄小图片以提示图标显示，不再冻结为 72% 圆弧；这不是下载百分比。动图离屏/失焦不构成网络失败，不触发重试。

当前设计：

- HTML 在渲染前会先规范化。
- 解析后的 chunk 在文章 scroll 内通过 `Column` 渲染。
- 不要随意把文章正文切换到 `SliverList.builder`：此前讨论后保留 `Column`，原因是选择、目录锚点 key、图片生命周期和滚动稳定性。
- 渲染器刻意拆分 HTML 规范化、chunk 解析、widget 渲染。修复应尽量放在问题所属阶段。
- `ArticleController` 初始化右上角已读/未读按钮时，必须使用 `LocalArticleDbService.readOverrideOf(article.entryId) ?? article.isRead`。不要只读 `GStorage.readStatus`，因为最近阅读页传入的文章本身已经是已读，而同步成功后本地覆盖状态可能不存在。

相关文章详情的渲染边界：

- macOS 相关文章不是替换外层选中文章，而是在右侧 `MacArticleDetailStack` 的嵌套 `Navigator` 中保留旧 `ArticlePageView` 并压入新的详情页。这样可以恢复上一层滚动、目录和显示状态，但新页的正文解析生命周期仍然独立。
- 新详情页初始化后可能先显示 `ArticleController.isParsingContent` 对应的排版 loading，再在 `Isolate.run()` 完成规范化和 `HtmlChunkParser` 分块后显示正文。历史上曾把一次偶发反复闪烁归因于整页透明转场，并改用不透明前景表面；用户后来确认该表面的滑入观感明显不如功能最初版本，而且当时闪烁也可能来自未更新到最新本地代码的构建，旧结论并非带完整时序证据的最终根因。
- 当前第一阶段恢复最初的 `160ms` push / `140ms` pop：完整新页使用 `easeOutCubic` / `easeInCubic` 的透明淡入淡出，并配合约 `2.5%` 水平滑动，不再以完全不透明 `ColoredBox(surface)` 从首帧遮住旧文章。该方案保留原始动画语言，需分别在冷启动、长时间运行和本地/Actions Release 中观察。
- `M` 在相关文章中仍会先同步本地已读状态，再按 `ArticleNavigationPolicy` 返回上一层。返回回调继续通过 post-frame 调度，避免读状态通知、列表/角标刷新和 `Navigator.pop` 在同一帧竞争；异步 controller 代次隔离、嵌套 Navigator 和关系组弹窗串行关闭均不回退。若反复闪烁再次出现，应先增加直接横条路径的路由/解析时序探针，再决定第二阶段修复，不得直接恢复不透明底板或同时改动多层状态。

HTML 空段规范化：

- `ArticleContentUtils._removeEmptyBlocks()` 会删除没有可见文本、没有媒体、仅由 `<br>` 和 `span/strong/em` 等格式包装组成的空块。`<p><span><br></span></p>` 与 `<p><br></p>` 语义相同，不应因多一层无意义包装而逃过清洗。
- 带 `id` 或 `name` 的空元素可能是目录/页面锚点，必须保留；图片、视频、表格、代码、引用和列表等媒体/结构内容也必须保留。新增格式标签时，只有确定其在无文本时没有独立语义，才能加入格式包装白名单。
- 新智元文章《奥特曼回斯坦福认错：思考外包给AI，一代人大脑正在萎缩》的源 HTML 把几乎每句话放在独立 `<p>` 中，并在段落间插入 `<p><span><br></span></p>`。旧清洗在 152 个段落中残留 82 个这种空段，chunk 合并又在每个段落之间添加 `<br><br>`，最终相邻句子间最多叠加 5 个 `<br>`。当前窄修复只删除空格式段，使其回到标准段落间距。
- 不要自动合并该类“一句话一个 `<p>`”的正常非空段落。这是上游排版语义；可靠合并需要复杂启发式，会增加误伤和维护成本，用户已明确暂不考虑。

渲染前空 chunk 防线：

- Flutter `3.47.0` 的 `RenderParagraph` 会为 `SelectionArea` 内的富文本建立可选择区间；如果 `flutter_html` 把 `<br>`、空链接、空列表、孤立 `<source>`、无文字禁用表单等结构转成零字符 `Text.rich`，会触发 `paragraph.dart` 中 `range.isValid && !range.isCollapsed && range.isNormalized` 断言。该异常发生在正文显示阶段，可能在全文补抓后首次打开文章时出现，但它不是网络抓取失败。
- `HtmlChunkParser` 在完成 DOM 分块、合并相邻段落之前统一执行最终可渲染性检查。heading、paragraph、blockquote、table、list 和 rawHtml chunk 必须包含去除空白/NBSP/零宽字符后的可见文字，或包含可渲染的图片、iframe、video、audio；真正的 image、media placeholder、horizontal rule、author list 和非空 code block 按类型保留。
- 这道防线只丢弃没有视觉或正文语义的 chunk，不改写数据库原始 HTML，不扩展来源特判，也不删除有文字的邮件按钮、普通链接、行内代码、数据表或媒体。现有缓存文章下次解析时自动生效，不需要数据库迁移或重新拉取全文。
- 2026-08-31 使用正在使用的 Hive 数据库只读快照审计 4367 篇文章：修复前规范化并分块后有 888 个零文本/无媒体渲染块，修复后为 0。测试最小覆盖空段、空链接、空引用、空列表、空表格、孤立 source、禁用 input、纯图标 button，以及正常文字/链接/行内代码/图片引用/分隔线保留。
- 同次审计还看到 14 条真实 Readability 提取失败状态，错误为“没有可解析正文”或“提取内容没有比摘要更长”，与本断言无关。失败状态跨后续刷新再次入队的节奏尚未重新设计，见[待办与搁置事项](../status/pending.html)。

正文文本选择：

- 文章页继续由一个外层 `SelectionArea` 包裹完整正文。macOS 使用鼠标拖选，Android 使用长按选择；`Command-C` 必须继续交给系统复制当前选区，不能被无修饰键 `C` 的 Markdown 全文复制快捷键覆盖。
- Flutter `3.47.0` 配合 `flutter_html 3.0.0` 时，非空的标题、段落、引用和列表也可能无法选择：`flutter_html` 会把块级 `html/body/div/p/ul/ol/li` 组织成以 `WidgetSpan` 开头的嵌套 `RichText`。macOS 拖选会得到空字符串，Android 长按可能只得到 U+FFFC 对象替代符，而不是正文。该问题不同于前述“空 chunk 触发断言”，上游已确认为 Flutter 选择偏移问题：<https://github.com/flutter/flutter/issues/187506>。
- `HtmlChunkParser` 已经把正文拆成独立布局块，因此 `HtmlChunkCard` 在 macOS/Android 渲染 heading、paragraph、blockquote 时，把只承担解析包裹职责的节点改为 inline，避免再生成冗余的 leading `WidgetSpan`；list 则使用独立的可选择列表行，以固定 marker 列和可换行正文列避免列表项粘连及续行失去悬挂缩进。这只改变 widget 结构，不修改数据库正文、规范化 HTML 或导出内容。
- blockquote 在选择兼容路径中只移除顶层 `p/div` 包裹；连续文字、链接和已有 `<br>` 节点保持在同一个行内流中，只在真实块级边界之间补两个 `<br>`，避免把每个链接或已有换行再次当成独立段落。外层引用容器、左侧主题色线、链接和行内代码样式不变。list 保留原始语义 `ul/ol/li`，在 macOS/Android 上由独立可选择行负责项目符号、序号、嵌套层级和外层 `20px` 缩进；列表项正文继续交给 `flutter_html` 保留链接、行内代码和富文本样式，其他平台继续使用原生列表布局。
- 表格和代码块使用自己的纯文本/表格渲染路径，本轮不改。不要把所有 HTML 粗暴转成纯文本，也不要给正文插入零宽哨兵字符；前者会丢失链接和排版，后者不能修正嵌套 selectable 的偏移结构。
- 回归测试必须断言选区中包含真实单词，不能只断言 `SelectedContent` 非空，否则 Android 的 U+FFFC 会造成假通过。列表样本必须使用常见的 `<li><p>…</p></li>`，不能只覆盖简化的 `<li>…</li>`；当前覆盖 macOS 段落、标题、引用、包含链接和已有 `<br><br>` 的 blockquote 换行、列表鼠标拖选，以及 Android 段落、序号列表长按选择、列表续行悬挂缩进和嵌套 marker。


<a id="article-selection-stability"></a>
## 选择结果跨异步刷新保持稳定

- 2026-09-24 相关文章改为直接组成员展示，取消递归连通组弹窗；一句话事件主题框在宽布局右侧、窄布局上方显示。默认最多三条，可在设置的“相关文章默认展示条数”调整（至少 1），统一展开/收起；进入另一篇文章默认收起，返回仍挂载的上一页保留其状态。仅近似重复时不显示事件主题。语义与迁移见[翻译与摘要](translation-summary.html)，视觉验收编号 RELATION-01。


这次问题分成两个连续暴露的层次，不能把它们都归结为“SelectionArea 不稳定”：

- 第一阶段的现象是摘要/正文一开始勾选不上，偶尔成功后还会同时出现全文框和局部框。最小复现确认文章级 `SelectionArea` 本身可以工作，真正的第一层根因是 `flutter_html 3.0.0` 为块级 `html/body/div/p/ul/ol/li` 生成了以 `WidgetSpan` 开头的 nested `RichText`。正文兼容层因此把 parser 已经拆出的文本块中的冗余块级 wrapper 改为 inline；空 chunk 防线则负责避免零字符 `Text.rich` 进入选择树。
- 第二阶段的现象是鼠标松开后高光暂时保留，但另一篇文章被标记垃圾、后台任务完成，或等待一段时间后，高光自行消失。之前把相关文章状态从全局 `ArticleStateNotifier` 依赖改为每篇文章局部观察，只能减少一个重建来源，现象仍在，说明问题不是普通 repaint 本身。
- 依赖源码核对确认：`flutter_html` 的 `Html` 构造函数在没有收到 `anchorKey` 时每次创建新的内部 `GlobalKey`，并把它传给 `HtmlParser`；`HtmlParser` 状态没有实现 `didUpdateWidget`。因此父级即使传入完全相同的 HTML，只要重新构造了新的 `Html()`，旧 parser 和 `RenderParagraph` 仍可能被替换。选区绑定的是旧 selectable/render object，旧节点从树中移除后高光自然消失；这不是可以靠 repaint 或 `RepaintBoundary` 保住的绘制状态。
- 触发链也在 GetX 记录容器中找到：`SummaryService` 和 `TranslationService` 原来用 `RxMap` 保存记录。UI 读取 `_records[entryId]` 时会订阅整个 map，而不是只订阅该 entry；任意文章的摘要/翻译状态变化都会让当前文章的 `Obx` 重建。摘要/翻译后台任务有延迟，所以用户看到的“另一篇文章动作”或“过了一会儿才消失”正好符合这条链。

最终修复：

- 新增 `StableSelectableHtml`，内部持有稳定的 `anchorKey` 并转交给 `Html`。父级用同一文章、同一 HTML 和同一渲染配置重建时，parser、`RenderParagraph` 和选区保持原实例；`data` 或显式 `renderConfigurationKey` 改变时才轮换 key，刻意让旧内容卸载并建立新 parser，避免因为错误复用而显示旧 HTML。
- `SummaryService`、`TranslationService` 的记录数据改为普通 `Map`，为每个 entry 提供 `versionFor(entryId)`；写入、pending、删除和账号切换清理都会通知对应 entry。原有 aggregate `recordsVersion` 仍保留，只有任务中心等需要汇总计数的观察者使用它。
- 文章详情摘要、文章卡片摘要、垃圾拦截审核行摘要/译文、详情工具栏和 `ArticleController` 都改为观察当前 entry 的 version；不再让当前文章 UI 因另一篇文章的 AI 记录变化而重建。相关文章状态同样由每个关系项的 articleId 局部读取。正文 `HtmlChunkCard` 已经缓存真实 `Html` widget，本轮保留其缓存，不要把它改回每次 build 新建。

边界与后续排查规则：

- 同一 data/config 的父级 rebuild 不得主动换 `StableSelectableHtml` 的 key；否则会重新创建 parser 并清除选择。摘要正文、主题亮度、主题色等影响布局或样式的输入真正变化时，必须传入新的 `renderConfigurationKey`，此时清除旧选区是正确的，因为旧字符位置不再保证对应新内容。
- 当前文章内容 UI 应观察 entry 级 version，而不是为了方便重新读取 aggregate `recordsVersion`。新增摘要/翻译展示点时，先确认是否应只响应一个 entry，再选择对应 service 的 `versionFor`。
- 不要删除文章级 `SelectionArea`、把全文转换成纯文本、加入零宽哨兵，或把高光另存为业务状态；这些方案要么损失链接/排版，要么不能解决 nested selectable/remount。升级 Flutter 或 `flutter_html` 后，先运行现有跨平台选择测试，再决定是否能删除兼容层或稳定 wrapper。

来源兼容规则：

- Paul Graham 旧式文章使用 `td > font[size="2"][face="verdana"]` 与 `<br>` 排版，可能完全没有普通段落候选。`getReadabilityContent()` 在通用提取无结果时，才调用来源兼容层的窄回退：原文域名必须精确为 `paulgraham.com` 或 `www.paulgraham.com`，同一单元格还须有 alt 与页面 title 一致的文章标题图，并存在非空正文与换行结构。只返回正文 font，保留链接、强调和脚注，排除外层站点导航/布局；不按某篇固定标题匹配，不扩展为通用整页 body 回退。文章详情和自动全文 worker 都传递原文 URL，既有安全清洗先执行。空正文文章在新构建中重新打开时会重新抓取，不需要迁移或直接修改正在运行的 Hive。
- 依赖站点 CSS 才能成立的窄兼容修复集中放在 `ArticleContentCompatibility`，由 `ArticleContentUtils.normalizeHtml()` 在通用安全清洗后、图片 URL 规范化前调用。不要把来源判断散落到 `HtmlChunkParser` 或普通图片 widget，也不要为单一规则引入动态规则引擎。
- Hugging Face Blog 的作者头像没有 `width/height`，只使用 Tailwind 的 `size-9 sm:size-12` 或父容器 `h-5/w-5` 控制显示尺寸。图片文件的固有像素不能代表网页显示尺寸；不应直接按正文最大宽度放大，也不应加载上游整套 CSS。
- 官方作者区有稳定的 `data-target="BlogAuthorsByline"`。兼容层将其转换为内部 `fourier-author-list/fourier-author` 语义结构，解析器继续兼容旧缓存中的 `auto-folo-*` 标签；`HtmlChunkParser` 生成单个 `authorList` chunk，`HtmlChunkCard` 以 `36px` 圆形头像、姓名和账号横向排列并自动换行；有主页地址时整项可点击。作者头像继续使用文章级图片缓存键。
- 作者区之外的 Hugging Face 头像堆叠属于站点装饰信息，仍按明确的 `cdn-avatars.huggingface.co` 或 `/avatars/` 头像语义移除；普通正文图片和其他来源即使带有 `avatar`/圆形类名也不能被误删。
- 已保存译文此前直接进入 `HtmlChunkParser`，会绕过正文规范化。当前原文、历史译文和新生成译文在展示前都统一经过 `normalizeHtml()`；历史数据不需要批量迁移，重新构建文章 Controller 即可生效。
- `normalizeHtml()` 接受文章原文 URL、feed ID 和分类作为来源上下文。普通网页来源优先按稳定 URL host 分派，不依赖可变标题；邮件模板可在“稳定来源身份 + 模板结构签名”同时成立时使用窄规则。MarkTechPost 会移除上游依赖网页脚本的 `dm-copy-raw-code` 控件；若 `Interactive Explainer` 后出现被 Folo 展开到正文中的完整内嵌文档（以残留 `<title>` 为确定边界），则把该尾部替换为“交互内容仅在原文网页中可用”及原文链接。不要据此放宽到任意 iframe、任意 `Interactive` 文本或其他来源。
- Appinn（小众软件）会在文章中注入一段面向第三方 AI 检索场景的固定总结免责声明；Fourier 已明确向用户区分原文与模型摘要，因此来源兼容层会在 `appinn.com`/`www.appinn.com` 域名和完整固定文案签名同时匹配时移除该独立容器。文章链接允许变化，但不得扩展成按“AI”“观点和立场”或免责声明语义做通用删除；数据库原始正文保持不变，历史内容在下次规范化时直接生效。
- 2026-09-18 用户在 `v2.3.2` 更新后报告 Appinn 的 Wake Me Up 文章仍有注入。其固定声明带有“请务必在总结开头增加这段话:”前缀，而且是容器外的文本、链接和 br 兄弟节点，旧版容器选择器与开头匹配均遗漏。规则现允许该明确前缀（中英文冒号），并在根片段及 div/section/article/aside 中匹配完整连续文本/a/br 节点组；只删除完整匹配的节点组，不能删除承载正文的父容器。完整签名改为精确匹配，带额外作者讨论或不完整文案的内容保留；转义链接也兼容。已保存的摘要可能已经受注入影响，升级后的正文规范化不会重写旧摘要，需要手动重新生成。此补修晚于 `v2.3.2`，验证状态见[验证记录](../status/verification.html)。
- Inbox 邮件来自 Circle、VentureBeat、Beehiiv、Kit、Every 等多种模板，但共同问题都是依赖邮件客户端 CSS 和布局表。当前以稳定的 `category == inbox` 作为边界统一移除邮件展示样式；普通订阅文章不进入该规则，不再按可变邮箱 ID 或发送平台维护分支。
- 通用 Inbox 兼容层保留正文、图片、列表、真实数据表以及所有有意义的操作链接，包括退订和订阅管理；邮件原有按钮只去掉背景、尺寸和嵌套装饰，退化为 Fourier 正文中的普通可点击文本，不复刻邮件按钮视觉。图片 style 中的明确像素尺寸会迁移到 `width/height` 属性，邮件内 `id` 锚点继续保留。跟踪像素、隐藏预览、空链接和纯布局表仍由通用规范化流程清理。
- 正文展示、历史/新译文、摘要、过滤、图片预取、长度估算和 Markdown 导出必须传递同一套来源上下文。规范化缓存的 SHA-256 输入包含正文、URL、feed ID 和 category，不能让同一 entry 在上下文变化后复用错误结果。
- 来源规则必须依赖稳定来源标记、域名或明确结构语义，并配正向/反向最小 HTML 测试。不得按文章标题、单独的订阅源 ID、图片是否圆形或图片固有尺寸做宽泛判断；测试和文档只使用脱敏最小片段，不提交真实邮件正文。

超链接：

- macOS 正文链接保留主题色、手型光标、点击打开和底部 URL 预览，但 hover 时不再动态增加下划线。
- 底部 URL 预览继续由文章页共享的 `_hoveredUrl` 驱动；它是 `Stack` 中的局部覆盖层，不改变正文布局。
- `HtmlChunkCard` 不得监听共享 `_hoveredUrl` 并把 URL 变化作为 HTML widget 缓存失效条件。旧实现会在鼠标进入/离开任意链接时通知所有 chunk，导致全篇 `flutter_html` 重新解析和文本布局，滚动经过链接时产生瞬时卡顿。
- 如果未来重新设计 hover 视觉反馈，必须保证不重新解析全篇或整个复杂 HTML chunk；手型光标和 URL 预览是当前稳定的交互反馈基线。

图片：

- 使用 `ArticleImageService` 处理代理/请求头。
- `img2.jintiankansha.me/get?src=...` 包裹微信 `mmbiz.qpic.cn` 原图时，不再继续经过该第三方中转，而是由 `ArticleImageService` 精确解出嵌套地址并升级为 HTTPS 直连。规则同时校验代理 host/path 和原图 host；其他嵌套来源、相似代理地址及普通图片保持原样。嵌套 URL 使用原始 query component 解码，避免把合法 `+` 错当为空格；完整编码的原图查询参数会保留。
- 图片规范化会用文章原文 URL 解析 `/path`、`./path` 和 `../path` 相对地址，再进行 HTTP/HTTPS 校验。没有可靠来源 URL 时继续保留原属性但不加载，不猜测站点域名。AddyOsmani.com 的 `Software Factories, Light and Dark` 已用真实缓存样本确认可解析出 4 个绝对 SVG 地址。
- 正文与图片查看器支持 SVG；真正的 SVG 通过 `ArticleSvgImage` 读取 `ArticleImageCacheService` 的文章级磁盘缓存后交给 `flutter_svg`，不能改回独立网络加载，否则后台预取会对 SVG 失效。普通位图仍走 `CachedNetworkImage`。图片代理地址可能在路径末尾保留嵌套源文件的 `.svg`，但以 `f_auto` 等变换参数实际返回 PNG/WebP；`ArticleImageService.isSvg()` 必须先排除这种明确的自动格式输出，不能只看路径后缀。
- macOS 与 Android 正文图片都使用 `ArticleImageCacheService` 的文章级缓存键。`HtmlChunkCard` 和 `ImageGalleryPage` 必须携带 `entryId`，确保正常阅读、后台预取、图片查看器和已读后清理命中同一套缓存；历史 `v2_` 缓存暂不迁移。
- macOS 刷新完成后预取全部本地未读文章的正文静态图片：按文章顺序、每篇最多 8 张、总调度并发 16；当前文章前 4 张提升到队首。
- Android 使用保守参数：刷新时预取前 50 篇本地未读文章、每篇最多 4 张、总调度并发 4；当前文章前 2 张提升到队首。当前不区分 Wi-Fi 与移动网络。不要加入 hover 触发，也不要把预取改成批量 `precacheImage()` 常驻内存。
- 宽度尽量尊重文章内容最大宽度和源图片尺寸。
- macOS hover 不再缩小图片，也不绘制边框。
- 可点击图片在 macOS 通过 `MacOSZoomInCursor` 使用 zoom-in 光标。
- 避免会改变图片布局尺寸的 hover 效果；哪怕很小的尺寸变化也会移动后续文字，在桌面端显得不稳定。
- 很小的分隔符类图片不应被拉伸成大占位。
- 图片加载失败的重试职责统一收敛在 `ArticleImageCacheService`：正文独立块级图片和后台预取的失败均登记并按 `1s/2s/4s` 退避重试，失败记录落盘到 `localCache`，全局刷新会在缓存清理完成后串行重扫。service 是唯一下载方；正文不再用 `?retry=N` 同时发起第二次请求，而是通过图片级 `ArticleImageRetryState` 显示「重新加载中…」或手动重试入口。service 成功后只递增该图片的 `successRevision`，精确重建这一张图片并从已填充缓存读取，不使用会连带刷新时间线的 `ArticleStateNotifier`。退避计数与计时器由可独立测试的 `ArticleImageRetryScheduler` 管理，清理文章缓存前会同步取消其排队任务和退避计时器。独立块级 SVG 同样进入此闭环；HTML 行内图片扩展和图片画廊仍不自动重试。
- 重试始终沿用同一个规范化 URL 和文章级 cache key，不应为重试重复套代理或追加随机查询参数；但“代理 URL 相同”不代表响应格式等于嵌套源文件后缀。类型判断必须尊重明确的代理转换参数，避免 SVG 解码失败与普通缓存成功通知互相触发循环重建。

视频：

正文中的普通视频、YouTube 与 Bilibili 播放（播放器协调、回退链路、懒加载与安全边界）已整理为独立专题：

- [媒体播放](media-playback.html)。

本页只保留文章渲染相关内容；播放器不再作为文章渲染的一部分维护。

表格：

- `_buildTable()` 刻意不在横向 scroll viewport 外包 `ClipRRect`。
- 原因：圆角裁剪会在横向滚动宽表格时切掉直角矩形表格的四角。
- 表格修复应保守。一些 feed 会输出畸形 table-like 内容；避免可能破坏正确表格的宽泛启发式规则。
- `ArticleContentUtils` 不能再用“没有 `<th>`”直接判定布局表格。真实数据表常用第一行 `<td>` 充当表头；当前按结构保留至少两行两列、列数稳定、无嵌套且以文本为主的网格，单行/单列、嵌套、媒体主导或结构混乱的表格仍可扁平化。
- 更彻底但暂缓的架构方向：拆分“忠实阅读渲染规范化”和“翻译/摘要等 LLM 输入清洗”两条管线。前者尽量保留源 HTML 语义，后者可以更积极地扁平化 Newsletter 布局、压缩噪声。实施前需要盘点 `normalizeHtmlForEntry` 缓存、翻译、摘要、readability 和复制正文的调用边界，并为两套输出建立独立缓存键；不要在没有完成调用链审计时直接复制两套规则。
- HTML 规范化只应删除数值确实为 `0` 的 inline `opacity`；`0.8`、`0.46` 等半透明内容仍是可见正文。顶层文本和布局表格拆平后移到顶层的文本必须重新 HTML 转义，不能让 `&lt;b&gt;` 一类字面内容变成真实标签。
- 翻译/摘要共用的规范化缓存不能只凭 `entryId` 命中，还必须确认正文、原文 URL、feed ID 和 category 一致；同一文章补全文、更新正文或来源上下文变化后必须重新规范化。
- 坏源 HTML 可能出现空代码块。可以隐藏真正空的代码块，但不要重写有意义代码。

底部间距：

- macOS 文章底部 padding 较小。
- 移动端保留更大底部 padding，以避开浮动控件。Android 文章页当前按目录存在与否动态使用两档避让：只有已读按钮时较小，同时有目录按钮时增大。
- macOS 分屏文章详情使用 `_MacSplitArticleCornerClipper` 对文章 body 做右下角圆角安全裁剪。背景原因是窗口外层圆角会向内收，普通矩形 padding 在右下角不能保持“正文到应用外框”的视觉距离。
- 该 clip 只应用于 `Platform.isMacOS && isSplitView`，且只包裹文章 body，不包裹 AppBar、进度条、右上工具按钮或 hover 链接状态栏。用户已验证这是正确问题位置。
- 当前参数：外层窗口半径 `24`，安全 inset `8`，内侧右下角半径 `16`。如果后续窗口圆角或外框间距改动，需要同步评估这些值。
- `_MacSplitArticleCornerClipper` 会裁掉正文整个右边缘的 `8px`。macOS 分屏正文当前同时关闭 Flutter 自动 scrollbar，并移除了 clip 外层的显式 scrollbar；顶部阅读进度条承担阅读位置反馈，正文圆角安全裁剪保持不变。不要因没有 scrollbar 而删除 `_scrollController`：目录定位、方向键滚动、标题折叠和阅读进度仍依赖它。
- 分屏正文使用固定 `surface` header，正文从 header 下方开始。整块 header 不使用 `BackdropFilter`，避免左侧采样到相邻时间线按钮光效；右上角交互按钮仍保留各自玻璃材质。顶部状态不显示“文章详情”、分隔线和阅读进度；正文大标题接近完全滚出后，文章标题以单行省略形式进入 header，分隔线和进度条同步渐显。实现通过真实标题高度和滚动 offset 驱动局部 `ValueNotifier`，不使用 `SliverAppBar`，不要为该效果改动正文 sliver、scrollbar 或目录锚点结构。
- 分屏正文不再显示或保留可拖动 scrollbar；正文基础左右 padding 仍为 `11px`，最大正文宽度设置独立生效。该取舍只应用于 macOS 分屏正文，不影响时间线、垃圾拦截、设置页、侧边栏和 Android 的 scrollbar。
- macOS 阅读进度条位于文章 header 下边缘；正文大标题尚未离开时，`1px` 细分隔线和橙色进度都隐藏；header 标题折叠出现时，两者同步渐显，橙色进度覆盖在细线上。Android 保留原 appbar 底部行为。

Android 文章操作：

- 普通 Android 页面和文章详情不显示应用自绘返回按钮；`MobileBlurAppBar` 禁止 Flutter 根据嵌套路由自动插入 leading，返回统一交给系统返回键或系统预测返回手势。确有独立业务语义的专用流程仍可显式提供控件，不能因此恢复全局隐式返回箭头。
- 右下角已读/恢复未读入口是 `48px` 圆形 Flutter 玻璃按钮，不再使用旧 FAB；Android 不提供复制全文按钮。
- 文章存在目录时，目录按钮位于已读按钮上方，间隔 `8px`；目录内容通过 `AppMobileGlassSheet` 展开，继续复用正文 heading key 和跳转逻辑。
- 翻译与摘要 pill 和 macOS 共用状态语义与文案，但保留移动端触摸目标，不要为了视觉一致缩成桌面点击尺寸。

HTML entity 解码：

- API/LLM 的纯文本字段在新拉取时解码。
- 本地缓存恢复时也要重新解码文章标题、来源、订阅分类、作者、垃圾拦截原因、订阅源标题/分类和历史翻译标题等纯文本字段，以兼容修复前已经缓存的实体字样；这只是内存读取规范化，不需要批量迁移数据库。
- 常见实体走内置快速映射；其他格式明确为 `&name;` 的实体通过现有 `html` 包的公开 `HtmlParser` 解码并缓存结果，避免以后每遇到一种实体就扩充白名单。只有解析器没有报告错误时才接受结果，因此未知实体和 HTML5 宽松前缀匹配都保持原文。
- `&ensp;`、`&emsp;`、`&thinsp;` 与 `&nbsp;` 在 UI 纯文本中统一规范化为普通空格。
- 正文 HTML、URL、图片 URL 不全局按纯文本解码。

目录：

- 目录跳转精度依赖稳定的标题锚点和滚动 offset。
- 除非重做目录逻辑，否则不要把标题虚拟化掉。
- 目录面板动画已调整为从固定右上角锚点展开；避免按钮先跳动再展开的动画。
- 2026-09-24 macOS 目录修复：页面 Stack 顺序为文章/工具栏、外部点击收起遮罩、目录面板，旗帜按钮不得后绘制于目录之上。保留圆形展开变形动画；收起按钮脱离面板标题行，固定在原 34px 目录按钮位置，图标中心保持一致，仅可见圆形缩为 26px，点击范围仍为 34px。标题行右侧预留空间，收起按钮不受行内 padding 或面板弹性尺寸影响。Android 目录和标题层级缩进不变；用户已完成目录视觉验收，见[待办](../status/pending.html)。

复制原文：

- macOS 文章详情右上角有“复制原文全文”按钮，位置在已读/未读按钮附近；无修饰键 `C` 与按钮调用同一复制逻辑。`Command-C` 仍交给系统处理正文选区复制，不得被全局快捷键吞掉。
- Markdown 结构转换集中在 `ArticleMarkdownExportService`；页面只负责读取当前文章/chunk、写入剪贴板和反馈。该 service 同时提供按文章顺序构建批量 Markdown 的入口，后续批量复制/保存必须复用它，不要在时间线或 `article_page.dart` 中复制另一套 exporter。
- 单篇复制也必须调用 `buildArticleAsync()` 在 isolate 中转换；页面用重入保护避免连续按 `C` 并发转换同一篇文章。阿里技术的超长文章曾因畸形列表触发 `_listToMarkdown()` 自递归并栈溢出；列表无有效直属项时现在只退化为纯文本，不能再把同一段列表 HTML 递归交回 `_htmlToMarkdown()`。
- 复制对象是正文区当前已经加载并解析出的原文 `controller.chunks`，不是译文、摘要、目录或 UI 文案。
- 点击复制不应触发网络请求，也不应临时拉取 readability/full content；如果正文尚未加载完成，只提示暂无可复制正文。
- 输出格式为 Markdown。开头包含标题、来源、作者、发布时间、原文链接；正文保留基础结构：标题、段落、链接、图片链接、代码块、引用、列表和表格。
- 脱水规则保持轻量，不做复杂广告识别。当前目标是稳定、可读、便于粘贴到笔记或 LLM，而不是完全还原网页。
- 如果正文第一块标题和文章标题重复，导出时跳过该正文标题，避免复制结果开头重复标题。

文章格式 bug：

- 用户报告特定文章格式问题时，先抓取/检查真实源内容，再添加渲染启发式规则。
- 如果上游文章内容本身畸形，或包含自定义交互组件，优先做窄修复，或接受该边缘情况。
- 除非失败模式明确反复出现，否则不要为了罕见畸形文章加入复杂通用解析规则。

## 目录面板：大面板原生 backdrop

- 大面积目录面板（`AppMobileGlassSheet`）改用平滑、shader-free 的原生 backdrop（BackdropFilter）路径（`nativeBackdrop: true`），避免适合小控件的 shader 在大面积上产生细网格纹理。
- 小控件（玻璃按钮等）仍保留现有 shader 渲染。
- 未选中目录文字提高对比度（`onSurface`），选中态保持主题色。
- 验证覆盖深浅色、长标题、滚动与 Android 性能。

## macOS 行内代码

- macOS 与 Android 行内代码的自身行高都固定为 `1.2`，避免继承正文 `1.5–1.7` 行高后让背景色块几乎占满整行。macOS vertical padding 为 1，Android 保留稍宽松的 2。
- 行内代码使用 `WidgetSpan` 承载圆角为 `6px` 的实体背景，横向 padding 为 `4px`、横向 margin 为 `2px`，并保持 alphabetic baseline。仓库维护的 Flutter `3.47.0` 最小选择补丁为 `WidgetSpan` 增加 `rawText`，这里必须写入代码原文，使跨越行内代码的选择与复制仍返回真实文字而不是 U+FFFC；不要为了官方 SDK 能直接分析而再次退化成只能绘制矩形背景的 `TextSpan.backgroundColor`。CI 在分析和构建前统一执行 `scripts/apply_flutter_patches.sh`。
- 紧凑行高覆盖段落、列表、引用与兜底 HTML；字号 `14px` 和块级代码不受影响。回归测试同时锁定选择结果、圆角与内外边距。

## 图片加载占位与能耗

- 正文图片请求仍由 `ArticleImageCacheService` 和既有缓存/重试链负责；UI 不擅自取消慢请求，也不把超时误判为永久失败。
- 不确定时长的图片占位只在前 4 秒显示旋转加载环，之后停在静态进度弧。图片随后成功时仍会正常替换占位。这样可避免网络请求长期挂起时，单个不可见进展的加载环持续按屏幕刷新率出帧。
- 静态进度弧本身不是失败状态；如果长期不被图片或错误占位替换，应检查 `ArticleImageCacheService` 中是否存在“已登记 cache key、缓存文件和 failed registry 均不存在”的悬挂下载。不要为让状态看起来活跃而恢复无限旋转，应修复具体网络链或给下载所有权增加可取消的超时。
- `DiagnosticActivityMarker.imagePlaceholder` 仅在加载环实际旋转时计为活动。能耗日志可据此区分短时正常加载与长期动画泄漏；静态占位不应继续制造帧。

## 文章链接 hover 生命周期

- 已确认日志：`ValueNotifier<String?> was used after being disposed`，位于 `_InteractiveLinkExtension` 的 onExit。
- 修复：链接 hover 不再由生成后的旧 TextSpan/MouseRegion 直接持有 ValueNotifier，改为由活动页面 State 提供的生命周期安全回调（`HtmlChunkCard.onLinkHover`）。
- State 在写入前检查 `mounted` 与 dispose 守卫（`_hoverUrlWritable`），离开时只在预览仍指向该链接时才清空。
- 保留链接 hover URL 预览与点击行为；切换文章、YouTube 回退、快速移动鼠标不再产生 MouseTracker 连锁断言。

## Android 骨架与共享 inset

- 主 Scaffold 使用 `extendBodyBehindAppBar=true`；真实列表带顶部 inset，骨架屏曾缺失导致卡片埋入 AppBar。
- 新增共享 `MobileViewportInsets`（顶部/底部 inset），时间线、垃圾拦截、订阅源的真实列表与骨架屏共用，禁止复制魔法数字。
- Android 嵌入主壳的列表顶部只使用 Scaffold 已重写后的 `MediaQuery.padding.top`；不得再次叠加 toolbar 高度，否则真实卡片和骨架都会在 AppBar 下方留下重复空白。
- macOS 从相关文章进入嵌套详情时，顶部使用项目统一的玻璃返回按钮并支持 `Esc` 返回上一层；在嵌套层阅读一篇未读文章并按 `M` 标为已读后，也自动返回上一层。该自动返回只属于相关文章嵌套详情的键盘操作，不改变根文章、恢复未读、工具栏点击或 Android 完整路由的行为。图片预览使用 root navigator，避免“全屏”只占右侧文章栏。
- 相关文章的“标为已读后返回上一层”现在是跨平台共享语义：`ArticleOpenOrigin.related` 只标记由相关文章进入的应用级路由，`ArticleNavigationPolicy` 统一保证返回来源优先于切换下一篇。macOS 继续弹出右侧详情栏的嵌套 `Navigator`；Android 继续弹出应用级文章路由，并在右下角按钮把未读文章标为已读后返回上一层。普通入口、恢复未读、只含外部 URL 的关系项均不触发自动返回；连续打开多层相关文章时每次只弹出一层。不要为了复用业务语义而把两端不同的 Navigator 容器合并。
