# 交互模式

通用规则：

- 避免会移动布局的 hover 效果。
- Press 反馈可以轻微缩放，但前提是不扰动周围内容。
- 纯图标控件应提供 tooltip。
- 浮层 tooltip 必须根据自身真实尺寸限制在应用窗口内；靠边时优先自动向内收或翻转，不应允许文案越过窗口后被裁切。
- 鼠标指针应匹配可点击性。

文章交互：

- `M` 在文章详情中切换已读/未读。
- 摘要和翻译按钮在底层状态变化时应立即更新文字。
- 从卡片右键菜单删除翻译/摘要后，可见详情状态应立即更新，不需要重新选择文章。
- macOS 右键菜单统一使用 `AppContextMenu`。它只统一容器外观、行高、图标、危险色、loading/disabled 状态和弹出位置；不要强行统一不同业务的菜单内容。
- 当前已迁移的右键菜单包括文章动作菜单、正文内图片菜单和图片查看器菜单。普通筛选/下拉菜单可后续按视觉效果再决定是否迁移。

时间线交互：

- 模式切换应避免为数百/数千个插入删除操作逐个播放动画。
- 排序菜单关闭时不应闪过 overflow。
- 同步 spinner 应反映初始同步状态。

</script>
