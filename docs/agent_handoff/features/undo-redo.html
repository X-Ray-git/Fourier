# 撤销与重做

macOS 的业务撤销/重做由 `UndoService` + `BoundedHistory` 提供，容量 50 项，覆盖标为已读、垃圾拦截保留/移除、误分类（<kbd>N</kbd>）和静默订阅源整批标为已读。

## 行为

- <kbd>Cmd+Z</kbd> 使用最多 50 项的业务历史连续撤销“标为已读、垃圾拦截保留、垃圾拦截移除、静默文章整批标为已读”；<kbd>Shift+Cmd+Z</kbd> 按相反顺序连续重做。新的业务动作会清空 redo 栈；导航、切换时间线范围、订阅源、分类或静默 scope 不清空历史。
- 业务栈在应用本次运行期间保持一致，只有进程彻底退出才自然消失，不持久化到下次启动。不要在 scope 切换时调用 `UndoService.clear()`。
- 文本输入框继续使用 Flutter 自身的文本 Undo/Redo。原生“编辑”菜单与全局快捷键必须先检查当前焦点，不能让文章业务历史抢走输入框里的 <kbd>Cmd+Z</kbd> / <kbd>Shift+Cmd+Z</kbd>。
- 全部过滤动作的撤销路径（`filterKeep`/`filterReject`/`misclassifyKeep`/`misclassifySpam`）都使用 `upsertOne(forceReplace: true)` 整条还原动作前快照；不能用普通 merge，`item.userAction ?? existing?.userAction` 会把动作标记留在已回滚的文章上。
- 误分类（<kbd>N</kbd>）是一条原子 UndoAction：撤销/重做同时恢复分类与已读状态。<kbd>N</kbd> 撤销时可先将动作前的完整快照写回数据库，但时间线内存快照必须暂时保持已读，再由 `markAsUnreadLocal` 完成唯一一次未读插入。如果内存也提前恢复为未读，标准恢复路径会提前返回，后续数据库通知只能通过整表结构刷新重插卡片，并会取消进场动画。
- 静默订阅源整批标为已读只占一个业务撤销项；部分 Undo/Redo 会把已完成与未完成子集拆到 redo/undo 两侧，使两侧历史始终对应最终远端状态。
- `UndoService` 使用 `BoundedHistory` 保存 undo/redo 双栈，并串行执行撤销/重做，避免快速连续按键造成网络回滚乱序。`UndoAction` 可以承载单篇或不可拆分的一批文章；页面只通过 redo preparation 在数据变化前登记列表离场；数据变更集中复用单篇或批量本地状态入口，不能在重做路径复制数据库规则。

## 菜单与反馈

- macOS 菜单栏由 `MacOSAppMenu` 的 `PlatformMenuBar` 管理，结构为 `Auto Folo / 编辑 / 显示 / 文章 / 窗口 / 帮助`。系统 About、Services、隐藏、退出、全屏、最小化和缩放继续使用 `PlatformProvidedMenuItem`；XIB 只为这些系统项提供本地化标题和 AppKit selector。
- “编辑”菜单的业务动作名必须始终放在长标题之前，单篇格式为 `撤销“动作” · 《截断标题…》` / `重做“动作” · 《截断标题…》`。整批静默文章使用 `撤销“批量标为已读” · N 篇`，不显示任意一篇文章标题。完整 50 项栈不暴露成菜单列表，只展示下一项。`UndoAction.actionName` 是菜单动作名，`description` 用于反馈正文，不要再把完整句子整体截断。
