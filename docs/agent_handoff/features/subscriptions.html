订阅源数据支撑时间线过滤和展示。

当前行为：

- macOS 已提供第一轮订阅管理：`订阅源` section 标题右侧的 `+` 直接通过 RSS URL 添加普通订阅。该入口使用紧贴 `18px` 图标的 `20px` 点击区，静止时不绘制玻璃底板、边框或圆形轮廓，只在 hover/press 时显示轻量中性反馈，避免透明大点击框造成视觉错位；其右缘使用侧边栏普通行数量气泡的 `24px` 基准线，不改变 section 标题原有位置和信息密度。普通订阅源行右键可编辑或取消订阅；普通分类行右键可重命名或取消分组。Inbox 不是普通 RSS 订阅，不进入这些写操作。
- 添加与编辑共用同一套表单状态和校验。添加时 RSS URL 可编辑，编辑时 URL 只读；两种模式都可设置自定义标题、分类和内容类型（`Articles` / `Social Media`）。第一轮不做关键词发现、推荐、RSSHub 浏览、OPML、私密订阅或“从 Folo 总时间线隐藏”。
- 远端订阅元数据与 Auto Folo 本地偏好必须分层：自定义标题、分类和内容类型写入 Folo；静默、自动翻译、自动全文仍是本地设置，不得伪装成 Folo 订阅字段。“从总时间线隐藏”不引入本项目，现有静默机制继续承担对应的个人工作流。
- `FeedModel.title` 是最终显示标题，优先使用订阅关系的自定义标题；`sourceTitle` 保留 RSS 源标题，`customTitle` 保留用户覆盖值。编辑表单清空自定义标题后必须恢复显示源标题。
- 订阅写操作集中在 `SubscriptionManagementService`，HTTP 细节集中在 `FeedHttp`。服务端变更成功后先更新共享目录并同步缓存，再通过 `SubscriptionCatalogService` 通知侧边栏和时间线；页面不得分别维护自己的订阅副本。
- 取消订阅需要确认，并作为自定义命令进入全局 50 项 Undo/Redo 历史。撤销会使用原 URL、标题、分类和内容类型重新订阅，重做再次取消；应用彻底关闭前应与其他已读/垃圾拦截动作共享同一条历史栈。
- 取消订阅只删除远端订阅关系及共享目录条目。不得删除历史文章、正文/图片缓存以及按 feed id 保存的静默、自动翻译和自动全文偏好；重新订阅同一 feed id 后这些本地偏好可以继续生效。
- 如果取消的是当前正在查看的具体订阅源，macOS 时间线立即回到“全部文章”，避免保留指向已不存在目录项的 scope。
- 订阅源会被缓存，但缓存不是永久并集。`SubscriptionCatalogService` 是时间线 feed mapping 与侧边栏订阅树的共享目录；启动和手动刷新都先同步目录，再加载文章，两处不得各自维护独立请求和合并规则。
- 普通订阅和 Inbox 分区独立同步：某分区成功时，返回结果是该分区的权威快照，新订阅立即加入、已取消订阅立即移除；某分区失败时，只保留该分区旧缓存，不能因为另一分区成功而误删。成功的空列表同样表示该分区应清空。
- 共享目录只更新订阅元数据及侧边栏，不删除本地历史文章，也不删除按 feed id 保存的静默、自动翻译或自动全文设置。以后重新订阅同一 feed id 时，这些本地设置仍可继续生效。
- 订阅源/分类过滤应保持文章计数和 header 副标题准确。
- 静默订阅源设置会影响普通时间线计数和可见性。
- macOS 侧边栏里，静默订阅源属于订阅源体系，不是主导航入口。普通订阅源树会排除静默源，静默源作为 `订阅源` section 滚动内容末尾的特殊分组展示，避免重复。
- macOS 静默订阅源分组的筛选与展开状态相互独立：点击分组行只切换到静默时间线，不应自动展开；只有用户点击展开/折叠按钮时才改变子列表可见性。
- macOS 普通订阅源分类必须区分导航选择、用户手动展开和临时可见性。分类主体只切换分类筛选，箭头只改变手动展开状态，订阅源行只选择具体订阅源；不要让这些点击互相附带副作用。
- 分类行的 hover/press 必须是覆盖整行的单一视觉反馈。展开箭头仍保留独立点击语义和 tooltip，但自身 `IconButton` overlay 应透明，由外层行统一绘制反馈；箭头点击只展开/折叠，行主体点击只选择分类。临时锁定导致箭头不可折叠时，箭头区域仍应消费点击并保持 no-op，不能穿透成分类选择。
- 当前时间线正在查看某个具体订阅源时，其父分类临时锁定展开，保证当前项可见；该临时状态不能覆盖用户原来的展开偏好。切换到最近阅读、垃圾拦截或设置后解除锁定：原来手动展开的继续展开并可折叠，原来折叠的恢复折叠。
- macOS 从文章元数据点击来源进入具体订阅源时，时间线保存一层临时返回上下文。目标订阅源中没有打开文章时按 `Esc`，应恢复此前 scope、原文章、时间线滚动位置、正文滚动位置以及译文/摘要显隐；如果先打开了目标订阅源中的文章，第一次 `Esc` 仍只关闭该文章，第二次才返回。用户手动切到其他订阅源、分类或静默范围后返回上下文失效；同一订阅源内点击来源不建立返回点。
- 临时锁定期间，折叠箭头不应暗中写入折叠状态，tooltip 应说明当前订阅源位于该分组。将来若侧边栏加入搜索，搜索期间的临时展开也应遵循同一规则，清除搜索后恢复手动状态。
- macOS 订阅源侧边栏使用独立 `ScrollController`、单一显式 `Scrollbar` 和可一次得到真实总高度的 `SingleChildScrollView + Column`。不要恢复成“一个 view/category 大组对应一个 `ListView.builder` item”的粗粒度懒加载：展开后的分组高度差异很大，Flutter 会在滑动到新组时反复修正 `maxScrollExtent`，导致 scrollbar 拇指长短剧烈变化并前后跳跃。折叠分类仍只构建标题，只有展开分类才构建订阅源行。
- Folo 官方来源类型展示名按英文保留：`Articles`、`Social Media`、`Inbox`。不要再把 `social` 显示成“社交”，也不要使用 `Social Inbox Feed` 这类官方不存在的组合名。

相关服务：

- `FeedTranslationSettingsService`
- `FeedReadabilitySettingsService`
- `FeedSilentSettingsService`

UI 注意点：

- macOS 订阅源专属 header 可以显示自动翻译和自动全文开关。
- `FeedDetailPage` 仍是有效入口：订阅源页中点击某个 view/category 的“全部”会进入它。不要把该页面当作废弃代码删除。
- macOS `FeedDetailPage` header 的阅读状态筛选必须和主时间线保持一致：复用圆形“文章范围” morph 按钮，只暴露“未读/全部”，不再显示旧的 `仅未读/全部/仅已读` 三项 PopupMenu。
- Android `FeedDetailPage` 与主时间线复用圆形“文章范围”按钮；点击后从共享玻璃底部面板选择“未读/全部”，不再维护旧 switch 或三项阅读状态菜单。订阅源级自动全文、自动翻译和静默设置也位于共享 `AppMobileGlassSheet`。
- 清除选中订阅源时，适当情况下也应清除选中分类。
- macOS 订阅源/侧边栏相关按钮应避免遗留 Flutter 默认 tooltip。订阅源分类展开箭头、订阅源搜索清空按钮等入口应使用 `AppGlassTooltip` 或 `AppGlassIconButton`。
- 订阅源分类展开/折叠箭头仍保留原本紧凑尺寸和旋转动画，只把 tooltip 从默认系统样式迁移到玻璃样式；不要借 tooltip 迁移扩大行高或改变侧边栏信息密度。

Android 导航与状态：

- 最近阅读是不常用的二级时间线，入口位于订阅源页，不占用主底部导航；进入后使用独立 AppBar 返回。
- 主底部导航的一级入口依次为时间线、垃圾拦截、订阅源和设置。订阅源仍保留自己的二级时间线入口，不要把最近阅读重新放回底栏。
- 移动端订阅源详情使用紧凑 `68px` header，显示头像、标题、未读数和总数；不要恢复旧 `220px` 杂志式 hero。
- 静默订阅源的未读数仍显示为零，但 `SubscriptionsController.unreadFor()` 必须在静默判断前读取 `_unreadCounts`，保证外层 `Obx` 始终建立 Rx 依赖。提前返回会在 Debug 触发 GetX misuse，在 Release 表现为展开 Inbox 后的灰色色块。
