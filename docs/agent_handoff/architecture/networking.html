# 网络

Folo API：

- Base URL：`https://api.folo.is`
- 用户身份认证只依赖 `__Secure-better-auth.session_token` cookie；用户不需要查看、填写或备份 `X-Client-Id`、`X-Session-Id`。后二者是 Folo 客户端协议元数据：Fourier 首次运行时内部生成并持久化 installation-level Client ID，每次进程启动生成新的 Session ID，由 `FoloRequestMetadata` 统一附加。它们不是账号凭据，不进入设置导入导出。
- 当前接口契约以 2026-08-01 的 Folo 上游提交 `3846c90b67da351b6017cd4fe9d0992b8077224e` 和 `@follow-app/client-sdk 0.3.95` 为审计基线。上游升级后应先核对 SDK 类型与官方调用点，再修改 Fourier，避免根据响应样本猜测字段。
- `lib/http/init.dart` 中的 `Request` 是只允许访问 `https://api.folo.is` 的认证客户端。interceptor 会拒绝 HTTP、相似域名和任意第三方地址，只有通过域名校验后才注入 Session Cookie。
- 公共文章网页抓取必须使用 `lib/http/public_content_http.dart` 的无认证客户端。严禁为了复用连接池而用 `Request` 获取文章原文，否则会把 Folo Cookie 发送给第三方站点。
- `/subscriptions` 返回 feed/list/inbox 联合类型；普通订阅目录只解析带 `feeds` 的成员。创建订阅的 `feed/list/unread` 位于响应顶层，不在 `data` 中；取消普通订阅使用 `feedIdList`。分类改名使用 `/categories` 的批量 `feedIdList + category`，不要逐订阅循环更新。
- 普通条目与 Inbox 条目的 `read` 都位于列表元素顶层，不在 `entries` 中。Inbox 列表不支持 `withContent`，但支持 `publishedAfter` 分页；恢复未读必须同时传递正确的 `isInbox`。
- 设置页“测试连接”和保存/导入共用 `/better-auth/get-session` 会话验证，不再单独拼 Cookie 调用订阅接口。
- macOS 使用 Folo 官方 CLI 同类协议：临时 loopback callback 只绑定 `127.0.0.1` 随机端口；官方网页返回一次性 token 后，应用通过 `/better-auth/one-time-token/apply`（兼容 `/verify`）换取长期 Session Token，再调用 `/better-auth/get-session` 验证。callback 服务等待三分钟后自动关闭，用户取消也必须立即关闭。
- macOS loopback 回调不依赖应用焦点：候选账号验证完成后必须立即结束等待框并应用账号，即使系统浏览器仍在前台。不要把 Android 为避免深链路由竞态而设置的 `resumed` 生命周期门禁扩散到 macOS。
- Android 不访问 `/login` 页面：移动 UA 会被重定向至 `folo.is`，而桌面 UA WebView 又会被 Google 拒绝。应用优先从 `/better-auth/get-providers` 动态读取 Folo 当前登录方式，Android 排除需要原生身份令牌的 Apple；provider discovery 是辅助能力而不是登录硬依赖，网络或响应异常时必须回退至 Email、Google、GitHub 本地列表。Google、GitHub 等社交登录复用 Better Auth Expo 浏览器协议，Email 则直接调用 `/better-auth/sign-in/email`，并在需要时携带短期 two-factor cookie 调用 `/better-auth/two-factor/verify-totp`。社交流程通过 `/better-auth/expo-authorization-proxy` 让服务端根据 authorization URL 自行签发 OAuth state，授权完成后由 `folo://fourier-auth` 返回带 Session Cookie 的回调。不要把首个响应中的普通 `better-auth.state` 当成 Expo 专用 `oauth_state` 转发，否则授权后会落回 `folo.is`。
- Android manifest 只匹配 `host=fourier-auth`，不宽泛接管其他 `folo://` 路径；`MainActivity` 必须关闭 Flutter 默认 deep-link navigation，回调只能由认证 MethodChannel 消费。否则同一 URI 会额外压入 Flutter 路由，完成登录时 `Navigator.pop` 会弹错路由，表现为界面闪烁后重新露出“等待浏览器登录”。
- loopback 登录 URL 不包含长期 Session Token；返回 token 只在内存中交换和验证。不要把 callback query、Set-Cookie、长期 Token 或完整认证响应写入日志。
- `/better-auth/get-session` 除验证长期 Token 外，也提供当前用户的 `id/name/email/image`。这些字段只用于本地账号身份展示并缓存为一份轻量资料；头像图片走普通图片缓存与首字符回退，不应让资料刷新失败阻塞启动或同步。
- 账号切换使用两阶段隔离：清理开始时进入 transitioning 并推进一次 `AccountSessionGuard` revision，此时 `Request` 直接拒绝新 Folo 请求；凭据持久化结束后退出 transitioning 并再次推进 revision。旧账号请求即使网络层成功返回、或恰好在清理窗口内启动，也必须作为 cancel 拒绝，不能进入业务合并逻辑。

DeepSeek API：

- Base URL：`https://api.deepseek.com`
- 用于翻译、摘要和 AI 过滤服务。
- API key 以 `deepseek_api_key` 存在 settings 中。

YouTube 播放：

- macOS 与 Android 首选仓库内可复现构建的 YouTube.js + googlevideo SABR +
  Shaka Player 运行时；应用不依赖 Node.js，生产产物位于
  `assets/embed_video_player/`，构建源和锁文件位于
  `tool/embed_video_player_runtime/`。该运行时的 Shaka 控件壳也由
  Bilibili 共用。
- 运行时页面由进程内 `127.0.0.1` 随机端口提供。路径包含每次进程随机生成的
  256-bit 能力令牌；代理只接受 YouTube/GoogleVideo 明确白名单内的 HTTPS
  目标，拒绝用户信息、非 443 端口和相似域名，POST 请求体限制为 2 MiB，
  媒体响应保持流式转发。不要把它改成局域网监听或通用开放代理。
- loopback 服务只在用户点击 YouTube 播放后启动。macOS Release 需要
  `com.apple.security.network.server` 与 `NSAllowsLocalNetworking`；Android
  的 network security config 只对 `localhost/127.0.0.1` 允许明文 HTTP，
  外部目标继续强制 HTTPS。
- VOD 的 SABR 取流失败时，先在同一个 Shaka 控件内关闭 SABR 请求改写并
  尝试普通自适应 DASH；SABR 与普通 DASH 都失败，或 BotGuard、超时、主
  frame 加载失败时，才切到现有 YouTube 官方 iframe。官方回退仍使用
  `youtube-nocookie.com` 和可识别 Referer，以避免错误 `153`；不要删除
  这两层兼容兜底。
- 播放启动超时按阶段计算：主页面、运行时就绪、manifest、metadata 和
  canplay 每取得一次真实进展，都重新开始 35 秒无进展计时。不能用一个从
  WebView 创建起覆盖整条 WEB_EMBEDDED/SABR/MWEB 回退链的总计时器，否则
  前两条路径的正常失败会吃掉 MWEB 的启动时间，并把已经可播放的视频错误
  回退到官方网页。
- Debug 构建可记录无签名 URL、无 Token 的播放阶段、缓冲、画质和代理
  host/resource/status 诊断；10 秒周期采样必须由注入配置关闭于 Release，
  不得为长期排障给正式版本增加周期工作或泄露媒体能力 URL。
- 两条链路都必须懒加载。文章初始渲染只显示缩略图，不得静默创建 WebView
  或请求 YouTube API。

Bilibili 播放：

- `BilibiliEmbedInfo` 必须要求有效 `bvid` 或 `aid`，只保留 `cid`、分 P 等
  明确视频参数；不要把普通 Bilibili 页面或任意 iframe 当作播放器。
- 只有用户点击后才调用匿名 `x/web-interface/view`（缺少 `cid` 时）、
  `x/player/playurl` 和 `x/player/v2`。不复用 Folo 登录信息，不接入
  Bilibili 登录态，不在未播放态预取封面或媒体。
- 播放地址响应转换成静态 DASH MPD；为保证 macOS WKWebView 和 Android
  WebView 的共同兼容性，每个画质只选 AVC 轨，并搭配一条最高码率普通音轨。
  匿名接口实际返回哪些画质就展示哪些，不伪造会员画质。可用字幕会从
  Bilibili JSON 转成 WebVTT 后加入同一个 Shaka 设置菜单；字幕准备最多
  等待 4 秒，超时只舍弃字幕，不能阻塞视频播放。
- Bilibili 使用独立的 `127.0.0.1` 随机能力路径服务。媒体代理只接受当前
  播放 session 中由官方 API 实际返回的完整 HTTPS URL；重定向还必须落在
  `bilivideo.com` 或明确的 Akamai 镜像。请求补充 Bilibili Referer/Origin，
  Range 响应保持流式转发。不要放宽为通用 URL 代理。
- 弹幕使用匿名 `x/v2/dm/web/seg.so` Protobuf 接口，以 `cid` 为对象、每
  6 分钟一段。loopback 只允许当前播放 session 的正整数分段号，并按视频
  时长限制最大段；共享网页运行时通过 Protobuf-ES 结构化解析。当前段按需
  获取并预取下一段，弹幕失败只舍弃该段，不能阻塞视频、触发播放器回退或
  改变字幕状态。当前只读，不接登录态和发送弹幕。
- 详情、播放地址、字幕、MPD、媒体或 Shaka 播放任一环节失败时，自动回退
  `player.bilibili.com` 官方 iframe。匿名接口属于兼容性能力而非稳定公开
  SDK，因此官方 iframe 必须长期保留。

Debug 日志：

- Debug Dio 日志刻意不打印请求头、请求体或响应体。
- 原因：启动同步时的大量日志曾导致 `flutter run -d macos` 不稳定，而且 headers/body 可能包含敏感用户数据。

安全：

- 外部链接应经过 URL 校验 helper。
- Debug 和 Release 都必须使用系统 HTTPS 证书校验。不要设置无条件返回 `true` 的 `badCertificateCallback`；抓包代理应通过系统信任证书配置，不应让应用全局接受无效证书。
- 不要在提交的代码里记录凭据或原始响应体。
