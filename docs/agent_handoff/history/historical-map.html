## 维护规则

- 历史归档不追加当前事实；新结论写入对应专题页或 [决策日志](../history/decisions.html)。
- 引用旧章节时使用 `chronology.md` 中的稳定链接，不写只有“第 N 节”而没有链接的引用。
- 一个旧章节只保存在一个主归档页，跨主题关系通过链接表达，不复制原文。
