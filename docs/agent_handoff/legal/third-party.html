# 第三方依赖、许可与致谢

Auto Folo 项目整体采用 `AGPL-3.0-only`（见根目录 [`LICENSE`](../../../LICENSE)）。仓库实际包含来自多个开源项目的代码，各自的版权与许可证条款继续适用于对应部分；完整清单与许可证文本见根目录 [`THIRD_PARTY_NOTICES.md`](../../../THIRD_PARTY_NOTICES.md) 与 `third_party/licenses/`。

## 第三方项目

- **Folo** — AGPL-3.0，版权归 Folo contributors；Auto Folo 是围绕 Folo 使用场景构建的个人客户端，不暗示官方所有权。
- **PiliPlus** — GPL-3.0，版权归 PiliPlus contributors。
- **Flutter** — BSD 3-Clause，版权归 The Flutter Authors。
- **interactiveviewer_gallery** — MIT，Copyright (c) 2020 Nell。
- **liquid_glass_widgets** — MIT，Copyright (c) 2024 Sebastian Degenaar。
- **liquid_glass_renderer** — MIT，Copyright 2025 Tim Lehmann for whynotmake.it。
- **YouTube.js**（17.2.0）— MIT，Copyright (c) 2021 LuanRT。
- **googlevideo**（4.0.4）— MIT，Copyright (c) 2024 LuanRT。
- **bgutils-js**（3.2.0）— MIT，Copyright (c) 2024 LuanRT。
- **Shaka Player**（4.16.2）— Apache-2.0，Copyright Shaka Player authors。
- **Protobuf-ES**（2.8.0）— Apache-2.0 与 BSD-3-Clause，Copyright 2021-2025 Buf Technologies, Inc.；varint 实现 Copyright 2008 Google Inc.。

## 依赖位置说明

- Flutter/Dart 依赖由 `pubspec.lock` 锁定，完整许可证声明位于 `third_party/licenses/`。
- 网页媒体运行时（YouTube.js、googlevideo、bgutils-js、Shaka、Protobuf-ES、fflate、Meriyah）固定在 `tool/embed_video_player_runtime/` 的锁文件与构建源中，生产资产位于 `assets/embed_video_player/`。
- 本 Wiki 的 Markdown 解析器固定在 `docs/agent_handoff/assets/vendor/`，许可证文本见该目录内的 `*.LICENSE.txt` / `*.UNLICENSE.txt`。

## 维护规则

- 新增第三方源码时必须同步补充许可证声明与 `THIRD_PARTY_NOTICES.md` 条目。
- 仅参考交互思路而未采用源码的项目不写入声明，避免错误归因。
- 许可证文件作为 Flutter asset 注册，Android 和 macOS 设置页的“关于”区域提供统一的“开源许可证”入口。
