# 设置

设置页有 macOS 和移动端布局。

重要设置：

- 服务认证：Folo Session Token，以及 DeepSeek API Key。
- LLM 模型/配置值。
- Prompt 模板。
- 已读同步窗口。
- 角标策略。
- 文章内容最大宽度。
- macOS max fling velocity。
- 外观模式：`system`、`light`、`dark`。
- 任何会改变持久用户偏好的设置，都应考虑是否加入备份导出。

导入/导出：

- 使用剪贴板 JSON。
- 由 `SettingsBackupService` 白名单管理。
- 如果新增持久设置需要跨设备迁移，应加入导出/导入。
- 导出内容可能包含敏感值；UI 应提醒用户。
- 备份格式继续保持 `version: 1`，并继续导出长期 `session_token`，因此旧备份和当前备份都可以在重新安装后恢复登录，不需要强制重新走浏览器。
- 导入必须先完整解析并验证候选 Session Token，验证通过后才能替换当前账号数据。无效或过期 Token 不能先覆盖当前设置，也不能触发本地账号数据清理。

Folo 登录与退出：

- macOS 首选 Folo 官方网页登录。实现对标 Folo CLI：应用在 `127.0.0.1` 随机端口启动临时 callback，在系统浏览器打开 `https://app.folo.is/login?cli_callback=...`，收到一次性 token 后调用 Better Auth `one-time-token/apply`（404 时兼容 `verify`），最后用 `/better-auth/get-session` 验证长期 Session Token。
- Folo 官网在生成 CLI 回调期间仍会显示通用的“打开 Folo”按钮，点击会唤起官方客户端，Auto Folo 无法从系统浏览器中隐藏它。macOS 等待框必须提示用户无需点击该按钮；localhost 回调一旦验证成功，应立即在后台完成登录，不能等待 Auto Folo 重新获得焦点。Android 深链仍需等待应用恢复前台后再关闭登录界面。
- Android 点击“登录 Folo”后动态读取并显示服务端提供方。当前 Folo 返回 Google、GitHub、Apple、Email；Android 与官方移动端一致地排除 Apple。Google/GitHub 在真实系统浏览器中完成，最终通过仅匹配 `folo://autofolo-auth` 的深链返回；Email 使用本地邮箱/密码表单，并支持 TOTP 二步验证码。不要恢复移动 `/login` 页面或登录 WebView；前者会跳官网，后者会被 Google 拒绝。
- 社交登录已有对应网页会话时可能直接返回；Auto Folo 不读取系统浏览器 cookie，只接收 Better Auth Expo proxy 返回的会话 cookie。Email 密码与 TOTP 只在内存中提交，不写入设置、日志或配置备份。
- 手动 Session Token 入口继续保留。手动保存同样必须先调用 `/better-auth/get-session` 验证，不能把任意字符串直接写成已登录状态。
- 当前采用“单一活动账号”，不维护多账号档案，也不尝试识别不同 Session Token 是否属于同一用户。Token 实际变化时一律重建账号内容；完全相同的 Token 重复保存不清理数据。
- “退出账号”是本地退出：删除 Auto Folo 的 Token 和账号内容，但不调用 Folo 远端 sign-out，也不退出系统浏览器。这样旧配置备份中的长期 Token 仍可导入。若要测试账号密码页面，需要用户自行在浏览器退出 Folo。
- 浏览器登录、手动 Token、配置导入三条入口最终必须汇入 `AccountService.applyAccountChange()`，不要分别维护数据清理逻辑。
- 登录状态的主视觉使用 Folo 返回的头像和用户名，不再用“已配置 Token”代表用户身份。`/better-auth/get-session` 返回的 `id/name/email/image` 会以轻量资料缓存在本机；旧安装仅在有 Token 但缺少资料时补查一次，头像失败则回退为用户名首字符。账号资料不进入 version 1 配置导出，导入 Token 时利用既有在线验证结果重新生成；切换或退出必须和 Token 一起替换或清除，不能残留上一个账号的头像。

macOS UI：

- 设置/任务中心已经从重型玻璃面板转向轻量描边面板，以改善性能/可读性。
- Scrollbar 不应和内容重叠，也不应出现重复条。
- 设置顶部 chrome 已简化：不再保留大块冗余标题/说明/版本号区域。
- 设置底部/右侧 padding 应尽量保持和 macOS frame/侧边栏一致的边缘节奏。
- Segmented 控件应使用当前 hover/cursor 行为，中性控件避免橙色 hover。
- macOS 设置页 segmented 保留自身极弱主色 tint 和主色文字。时间线 `未读/全部` 已迁移为圆形 morph 选择按钮，不再和设置 segmented 共用 switch 视觉参数；不要为了机械统一把 header 选择器重新改回 segmented/switch。
- macOS 自定义下拉菜单使用 `_MacGlassSelectField`。下拉 overlay 不能完全透明：菜单面板需要局部静态底色遮住背后内容，且底色圆角必须和外框圆角对齐。
- 下拉 overlay 的可读性修复是局部处理，不应通过全局提高 `AppGlassSurface` 不透明度解决，否则会影响其他已经验证过的玻璃控件。
- 三选一的外观 segmented 高度和普通下拉/文本输入结构不同，应在“阅读与后台偏好”中独占完整一行；不要为了机械配对压缩其已验证的动画和玻璃规格。其余普通设置再进入响应式两列网格，窄窗口回落为单列。
- macOS 的 Folo 与 DeepSeek 凭据位于同一个“服务认证”容器，底部右侧共用紧凑的“测试连接 + 保存认证”按钮行；Prompt 保存/重置仍位于各自容器底部右侧。不要把保存按钮挤在输入框右侧或横向撑满卡片。

Android UI：

- Android 设置页使用独立的移动端分组布局，但继续复用相同保存语义与业务组件。页面水平边距为 `12px`，大面板使用 `MobileSettingsPanel` 的 `24px` 连续圆角和轻量静态材质；不要把 macOS 双栏设置布局压缩后直接搬到手机。
- 服务认证卡提供动态登录方式选择、手动长期 Session Token 和本地退出。所有登录方式最终都必须经过 `/better-auth/get-session` 验证，不能仅凭 OAuth 回调、Email 200 响应或 cookie 存在就切换账号。
- 点击登录后，provider 请求期间按钮显示旋转进度和“正在连接 Folo…”，但仍等待官方 provider 响应后再打开选择面板；不要用无反馈的禁用按钮让网络等待看起来像点击失效。
- 账号切换、退出、配置导入/导出等确认面板在 Android 使用 Material 3 `AlertDialog`；不要复用 macOS 的透明 `AppGlassSurface/nativeBackdrop`，后者在 Android 透明 Dialog 上会让正文对比度不足。macOS 继续使用玻璃确认框。
- 离散选择统一使用 `MobileSettingsSelectField<T>`。字段本身不裁剪 `InputDecorator` 的浮动标签；点击后打开 `AppMobileGlassSheet`，选中项显示勾选，选择后立即关闭并保存。不要恢复透明的 Material dropdown overlay。
- `OutlineInputBorder` 的浮动 label 会向上越出输入框布局框约 `8.6px`。字段自身已经不裁剪它，但放进 `ExpansionTile`（内部对 body 用 `ClipRect`）或 `MobileSettingsPanel`（`Clip.antiAlias`）时，若控件上方紧贴容器顶部且缓冲 `< ~9px`，上溢部分仍会被上层容器切掉。`_LlmConfigCard` 的 `ExpansionTile` children padding 顶部因此从 `0` 改为 `10`；以后在裁切容器顶部紧跟带 `labelText` 的 outline 输入控件时，必须同样预留 `≥ 9px` 顶部缓冲。`AppGlassTextField` 用独立 `Text` 标题 + `InputBorder.none`，无浮动 label，不受此约束。
- 移动端服务认证、LLM 自动提交数字输入和 Prompt 行为仍与 macOS 共享语义。正文最大宽度、macOS fling 上限等桌面专属项不得出现在 Android 设置页。
- 后台任务中心是独立二级页面，入口位于设置页。该页面有实时队列和失败记录导航，保持独立路由比把全部状态展开在设置列表中更清晰。

保存语义：

- 选择型控件应选择即保存，包括 dropdown、segmented、switch/checkbox 等。
- 单值数字输入不应边输边写盘；按 Enter 或失去焦点时校验并静默保存，无效值或写入失败应提示并恢复上一次有效值。
- 凭据、API Key 和 Prompt 等敏感、组合或大段文本输入保留明确保存按钮。
- Folo Session Token 与 DeepSeek API Key 共用一次保存操作：先完成所有格式与 Folo 会话校验，再写入本地；Folo Token 必填，DeepSeek Key 可以留空，留空保存表示清除已有 Key。Token 发生变化时会清理账号内容，DeepSeek Key、Prompt 和其他普通设置不属于清理范围。
- 旧设置备份中的 `client_id`、`session_id` 继续允许导入但会被忽略并清理，保证旧 JSON 可迁移；新导出不再包含这两个字段。
- “测试连接”读取输入框当前值但不保存：Folo 仍使用只读 `/subscriptions` 并校验业务 `code == 0`；实际保存/导入则必须使用 `/better-auth/get-session` 验证会话结构。DeepSeek 使用需 Bearer 认证的只读 `/models`，不发起推理、不产生推理 token。两项独立测试并分别反馈，单项失败不能阻止另一项完成；DeepSeek Key 留空时显示“未配置，已跳过”，不把可选配置计为失败。
- LLM 参数卡片中，模型、思考模式、思考强度和 `max_tokens` 选择后立即保存；Temperature 和并发数按 Enter/失焦保存，编辑中的草稿不得阻塞或污染其他选项。重置默认立即落盘。
- Prompt 保留卡片内保存/重置操作；不要重新引入设置页全局“保存全部”按钮。
- 摘要、翻译和过滤 Prompt 都使用同一份跨平台持久设置，Android/macOS 不维护两套默认值。代码默认值只在对应 key 从未保存时生效；用户手动保存或通过配置备份导入后，应用更新、覆盖安装和后续默认值调整都不得覆盖现有 Prompt。“重置此 Prompt”会删除持久值并显式回到当前代码默认值。
- 默认过滤 Prompt 必须是保守、通用的内容质量审核，只过滤明确的空正文、抓取损坏、纯广告和无实质内容等噪声；不得在公开默认值中内置特定用户的技术兴趣、来源白名单、媒体偏好或“宁可错杀”等策略。个性化筛选继续由用户保存/导入自定义 Prompt 实现。
- macOS 与移动端的无按钮数字输入复用 `_AutoSavedSettingsTextField`；两端服务认证共用 `_CredentialActions`，避免按钮语义、加载态和提交时机分叉。
- 自动保存写入必须串行，并以最后一次用户选择为准；正常选择不弹成功提示，失败时恢复上一次持久值并提示。单行文本按 Enter 与点击保存等价。
