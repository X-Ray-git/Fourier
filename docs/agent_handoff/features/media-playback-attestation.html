# YouTube 播放 attestation 排障案例（2026-08-13）

本文完整记录 YouTube 首选播放器「中间卡死 / 回退官方 iframe」问题的定位、验证与修复全过程。当前架构事实以[媒体播放](media-playback.html)专题页为准；长期取舍见[决策日志](../history/decisions.html)；本文是那次排查的完整证据与思路档案，也是后续排查类似问题的参考方法论。

## 症状

用户报告的两个症状（macOS 真机）：

1. **播放中卡死**：视频开始播放一段时间后卡住不再前进。
2. **回退网页嵌入**：点击播放后自定义播放器启动失败，整链回退到官方 iframe。

## 证据收集（日志时间线）

调试期间用户把每次运行的日志保留在 `/private/tmp/fourier-youtube-*.log`。按时间排列的关键证据：

| 日志（时间） | 关键观察 |
|---|---|
| `youtube` / `fixed`（08-12 22:18–22:30） | **integrity token 铸造成功**（"BotGuard client initialized" 无 fallback 字样）。当时 challenge 走 bgutils `Waa.Create` 端点 + 代理合成 Chrome UA。SABR 报 Shaka 1002 空响应；MWEB 直连播放后段请求 403。 |
| `pot` / `gvs3` / `gvs8`（22:36–23:08，次日 09:50） | MWEB 段 URL 携带 `pot`，**同一个 pot 值先 206 后 403**（试用配额耗尽模式），播放中卡死。 |
| `gvs5`（23:15） | interpreter 外部 URL 被代理白名单拒绝（HTTP 400），BotGuard 初始化被推迟。 |
| `gvs9–gvs14`（次日 09:36–10:38） | challenge 换成 Innertube `/att/get` 后，GenerateIT 全部只返回 fallback：`[null, number, null, string(108)]`。拒绝 fallback 的代码路径让 MWEB 直接失败 → 回退官方 iframe。 |

两个症状同根：**GenerateIT 只签发 websafe fallback token，不签发 integrity token**。

- 硬用 fallback token 铸 pot → GVS 给少量试用流量（前几个段 206），配额耗尽后 403 → **卡死**。
- 拒绝 fallback（`bgutils-js 3.2.0` 的 `WebPoMinter.create` 本就不接受无 integrity token）→ SABR/MWEB 无法开始 → **回退官方 iframe**。

## 假设提出与探针验证

为了在不运行 Flutter 应用的前提下区分假设，在已忽略的 `scratch/youtube-attestation-probe/` 建立探针（说明见文末「探针资产」）。逐层验证的假设：

1. **challenge 来源**（`/att/get`+本地 session vs 页面 `ytAtN`+真实 visitor data）：bgutils changelog 有「Locally generated Visitor IDs are no longer accepted」，且 bgutils v4.0.3 官方示例已改为从真实页面提取 ytcfg 与 `ytAtN(R/T)` 并注入 `yt.config_`。
2. **用户代理**：历史成功时用合成 Chrome UA，后来改回真实 UA。
3. **IP/设备软限**：晚间约 5 次成功后全天 fallback，怀疑 Google 预算式降级。
4. **cookie**：代理丢弃 set-cookie/cookie。
5. **页面环境（origin 与页面丰度）**：BotGuard 快照质量。

探针矩阵（同一 IP、同一视频 `JQ97GiDwPxc`、当天）：

| 环境 | challenge 来源 | GenerateIT 结果 |
|---|---|---|
| Node + JSDOM（任意配方） | ytAtN / att/get | fallback（BotGuard 识别非浏览器环境，预期内） |
| 真 Chromium + 真实 youtube.com 页面 | watchAtN / attGetLocal | **真 token** |
| 真 WebKit + 真实 youtube.com 页面 | watchAtN / attGetLocal | **真 token** |
| 真 WebKit/Chromium + 127.0.0.1 裸页 + 模拟代理 | 任意 | fallback（复现应用故障） |
| 真 WebKit + 拦截的空 nocookie 裸页 | attGetLocal | fallback |
| 真 WebKit + **真实 embed 页面** | embed 页 ytAtN | **真 token** |
| 真 WebKit + 拦截的 youtube.com 裸页 | attGetLocal | 真 token |

结论：

- challenge 来源、本地 visitorData、UA、cookie 都不是决定因素；**IP 没有软限**。
- **决定因素是 BotGuard 快照的页面环境**：快照大小直接相关——127.0.0.1 裸页约 800 字节（降级），youtube.com 页面约 1800 字节（通过），真实 embed 页面约 2176 字节（通过）。Google 按快照质量分级发 token。
- 22:18 的 Create 时代成功无法再复现，不影响结论。

## 方案选择

三个方向（与用户讨论后选择 A）：

- **A（选择）**：播放器 WebView 加载真实 `youtube-nocookie.com/embed/<id>` 页面，把运行时注入其中，API/媒体仍走 loopback 代理。证据：真实 embed 页探针成功。
- B：用 scheme handler / 请求拦截伪造 `www.youtube.com` origin 伺服自己的页面（裸页即可铸 token），工程量大。
- C：维持 127.0.0.1 本地页——已证实死路。

## 实现过程中逐层发现并解决的问题

方向 A 落地后，真机连续出现新问题，每层都已修复：

1. **混合内容拦截**：https embed 页 fetch `http://127.0.0.1` 被 WKWebView 拦（`Load failed`，请求根本到不了代理）。修复：macOS 代理另起**自签名 HTTPS loopback 实例**（`/usr/bin/openssl` 运行时生成 RSA-2048 证书，读入内存后立即删除临时文件），WebView 经 `onSslAuthError` 回调仅对「证书 DER 与当前进程生成一致 + host=127.0.0.1 + 端口匹配」放行。Android 不依赖 OpenSSL，继续使用 HTTP loopback，并只对该 YouTube WebView 会话放行 localhost mixed content；外部明文请求仍被 network security config 拒绝。
2. **CORS 预检头不全**：youtubei.js 的 config 请求带 `X-Origin`、播放器脚本请求带 `user-agent` 等非安全头，预检 `Access-Control-Allow-Headers` 只列了少数头 → 请求被拦（同样是 `Load failed` 且代理日志无记录）。修复：改为通配 `*`（无凭据请求下合法，代理本来丢弃所有 cookie）。
3. **Trusted Types 拦截 HTML 注入**：embed 页 CSP 含 `require-trusted-types-for 'script'`，Shaka UI 的 `insertAdjacentHTML`/`innerHTML` 被原生 sink 拒绝（`This assignment requires a TrustedHTML`）。实测 WebKit 允许在无 `trusted-types` 白名单时 `createPolicy`，于是安装 `installTrustedTypesShim`：优先用直通策略 `fourier#runtime` 包装字符串走原生 sink；策略不可用时退回「blob URL + 同步 XHR `responseType=document` 解析 + 节点搬移」（实测唯一未被强制且同步可用的解析路径；`createHTMLDocument`/`DOMParser`/`createContextualFragment`/`template` 全被强制）。
4. **Trusted Types 拦截 eval**：BotGuard interpreter 与 SABR 的 `Platform.shim.eval` 都被拒（`Refused to evaluate a string as JavaScript...`）。修复：统一经 `trustedScriptSource` 用同一策略包装脚本源。
5. **构建产物形态**：注入真实页面的脚本必须能经 `runJavaScript` 执行，ES Module 语法不可行。vite 改为 **IIFE 经典脚本构建**（`inlineDynamicImports` + 自定义 `copy-index.mjs` 生成本地页模板，CSS 内联进 JS）。
6. **注入时序**：真实页在 `onPageFinished` 后注入，此时 `DOMContentLoaded` 早已触发，bootstrap 监听器永不执行。修复：`document.readyState` 非 loading 时直接启动。
7. **播放中段请求 206→403（卡死根因）随之消失**：真 integrity token 铸出的 pot 不再受试用配额限制（探针里段请求持续 206 无 403；真机验证通过）。

修复过程中的决策记录（探针日志序列 `embed.log → embed2.log → embed3.log → embed4.log`）与上述 1–4 层一一对应；每层修复后都在探针环境先复现验证，再交付真机。

## 随后的两个独立修复

- **hover 进度条下方细线**：Shaka 给 seek-bar/input 内联 12px 高度并相对 4px 容器上移，容器还带 4px 透明上下边框，hover 时轨道段溢出到下方。修复见[媒体播放](media-playback.html)的 CSS 收敛说明。
- **关页/切换文章后声音继续**：两个原因——路由被覆盖（相关文章压栈，下层路由保留）和 dispose 时未暂停。修复：dispose 时 `runJavaScript` 暂停全部 `video`，并用 `TickerMode.valuesOf(context).enabled` 监听路由覆盖主动暂停。详见[媒体播放](media-playback.html)。

## 参考工程输入

排查期间读取了 `reference/` 中的参考工程，最具价值的输入：

- **FreeTube**（Electron + 同栈生产实现）：真实页面 `ytAtN(R/T)` + `ytcfg` + 注入 `window.yt = { config_ }`（BotGuard 读 EVENT_ID）；`/att/get` 回退带 `eacrToken=T`；hidden view 以 `baseURLForDataURL` 伪造 youtube.com origin；对所有响应补 CORS；拒绝无 integrity token 的 GenerateIT 响应。本案例的配方即来自它。
- **yt-dlp**（`extractor/youtube/_video.py`）：PLAYER pot 绑定 videoId、GVS pot 登出时绑定 visitor_data（除非 `html5_generate_content_po_token` 实验开启——当时 embed 页 ytcfg 中该实验为 true，故 videoId 绑定正确）；`/player` 请求的标准通道是 `serviceIntegrityDimensions.poToken`。
- **bgutils-js v4.0.3 官方示例**：Node 环境用 JSDOM + 页面 ytcfg/ytAtN 的完整配方（Node 探针据此搭建）。
- **kira / googlevideo / YouTube.js / yattee / PiliPlus / Folo 生态**：kira 仍是旧 Create 流程；googlevideo 4.1.1 仅多 SabrSeek 导出；其余与本问题无关。

## 当前架构与边界

最终架构（真实 embed 页 + 注入 + HTTPS/CORS 代理 + Trusted Types shim）的当前事实、运行边界与安全约束见[媒体播放](media-playback.html)。

已知边界（当时接受）：

- SABR UMP 仍报 Shaka 1002 空响应（即便有真 pot），VOD 由 MWEB 直连 DASH 兜底；属独立问题，未在本轮修复。
- WEB_EMBEDDED 直连 `/player` 请求仍返回 "This video is unavailable"；MWEB 兜底已覆盖主场景。
- Android 尚未真机验证（WebView 注入时序、混合内容策略、证书信任路径与 macOS 不同）。

## 探针资产与复现方法

`scratch/youtube-attestation-probe/`（**已 gitignore，克隆后不存在**；本文档自包含全部结论）。如需重建探针：Node 22 + `npm i`（bgutils-js 4.0.3 与 3.2.0 别名、jsdom、youtubei.js 17.2.0、playwright、esbuild）+ `npx playwright install chromium webkit`。主要脚本：

- `probe-a/b/c/d.mjs`：Node/JSDOM 下各 challenge 配方的 GenerateIT 结果。
- `probe-f.mjs`：真浏览器 × challenge 来源矩阵（watchAtN/embedAtN/attGetLocal/attGetEacr × webkit/chromium）。
- `probe-g.mjs`：应用环境模拟——本地 origin + Node 版 Dart 代理（含 TLS/CORS/头合成），隔离 origin 变量（localhost / youtube / nocookie / realEmbed）。
- `probe-i.mjs`：全链路复现（注入真实 bundle + 代理 + 播放），后续逐层调试都在此完成。
- `probe-proxy.mjs`：Dart loopback 代理的忠实 Node 移植（白名单、头合成、CORS、自签 TLS）。
- `probe-j/k/l.mjs`：控制栏截图像素分析、DOM 几何检查。
- `RESULTS.md`：当时的结果矩阵快照。

方法论要点（后续排查可复用）：先隔离变量（探针矩阵）→ 用同引擎真浏览器复现（Playwright WebKit ≈ WKWebView）→ 每层修复先在探针验证再上真机；真机日志文件保留在 `/private/tmp` 并按序号命名。

## 协作与决策过程

- 用户要求先不改代码、只定位并讨论；探针获授权后自行设计与运行（不运行应用以免与正在使用的实例冲突）。
- 方案 A/B/C 选择、最小变量原则、HTTPS 代理与证书放行策略均经讨论后实施。
- 全程未提交代码；文档（本页、媒体播放专题页、决策日志、当前状态）在功能验证通过后统一维护。
