## 2026-10-02 已读队列修复与快照完整性诊断（源码完成，待新构建）

用户随后说明近期几乎没有通过其他途径使用 Folo/Fourier，并授权发现 bug 后及时修复、增加诊断点。该信息降低“其他客户端操作”的可能性，不能补回历史未读响应；不再将其他客户端当作这 14 篇的默认解释。下节保留调查阶段的统计/证据和当时“尚未修复”状态，本节描述最终源码。

### 已读任务与请求顺序

- `PendingReadSyncItem` 新增 revision，`pending_read_revision` 为账号缓存内的单调序号；旧 Map 无该字段及字符串 ID 队列兼容 revision=0，不清空历史队列或关系。入队返回任务身份，成功清理只删除匹配的 ID/类型/入队时间/revision，旧响应不能删掉新任务。
- `ReadSyncService` 每批、每次重试以及真正拿到同文章发送机会后复核当前队列；取消/替换项不再发送。持续读取新任务，但同一任务单轮最多三次；失败仍留待后续触发。清空持久队列不会忘掉仍在执行的 drain，账号改变时允许新账号独立开始，旧响应不能操作新队列。
- 用户恢复未读的取消动作集中在 `LocalArticleDbService.setReadState(false, source:user)`，在旧状态相同或缺失时也取消。无详情控制器的撤销、普通恢复和失败回滚共享保护；批量恢复在发送未读请求前也取消旧项。原有撤销/重做和动画语义保持。
- `RemoteReadRequestCoordinator` 只按同一账号/同文章 ID 串行所有来源的已读/未读 HTTP。已发出的 read 不能靠删队列撤回，因此新 unread 等它结束再发送；重叠批次同步预留全部 ID，避免交叉锁死，不同文章仍并发，不增加固定延迟。
- 文章控制器与普通直接已读重试绑定任务身份；被更新/取消后不再重试、删新项或回滚较新本地选择。未读重试也检查最新本地目标；账号代次贯穿请求、队列、批量操作和补偿，旧请求/旧补偿不能进入新账号或写其账本。

### 未读快照保护

原实现把“个别 inbox 失败后的聚合”“重复游标/重复页/缺游标/页数上限导致的提前结束”当作成功完整快照；HTTP 200 且缺 data 时也可能变成空列表。这些确认为代码缺口，但不能据此认定已经解释历史 14 篇的每一篇。

新增共享 `EntrySnapshotCollector` / `EntrySnapshotResult`：正常空页或末尾短页才完整；无进展、游标异常、页数限制、失败/解析异常均不完整。已得到的数据继续合并，本地缺失项保留未读。普通/social/inbox 共用分页收集，所有 inbox 必须完整才能信任聚合；成功包络缺失列表、列表中非法行或缺 ID 作为失败。时间线和订阅源详情都改用完整性标记，不把部分 Success 当作缺失文章已读的依据。

### 新诊断点与运行边界

`analysisEvents` 增加 `remote_mark_unread_attempt/result`（来源、ID、关联序号、耗时、状态/失败类型），以及未发送的 `read_request_suppressed`。`entry_snapshot_result` 记录来源分区、read 参数、页大小、收集数、完整性、停止原因、各页游标/返回数/新 ID 数/首尾 ID/末尾时间、inbox 子快照序号。由快照推断的 mark_read 携带 `snapshotSequence`，所有新事件带 PID，可追溯到具体请求链及进程。只记元数据，不记录响应体、正文、异常内容或凭据；记录失败不阻断业务，账号切换后不落入新账本。

正式回归覆盖三条原始缺口、取消等待中的任务、旧完成不删新 revision、同文请求顺序及其他文章并发、旧/新账号请求与批量补偿隔离、旧队列兼容、异常分页/包络/inbox 聚合、实际 TimelineController 保留缺失未读文章。测试均为临时 Hive/假 HTTP，不调用真实 API。最终验证见[验证记录](../status/verification.html)。本轮不改正式文章状态，不自动恢复两篇或 14 篇历史记录，也不清 AI 缓存/关系。

当前运行的正式 v2.5.0 不会因源码更新自动获得修复或新字段；重新运行含这些修改的新构建后才生效。后续若仍出现意外已读，按 PID、任务 revision、未读请求与 snapshotSequence 定位，无须用户逐篇记忆。未知历史样本的根因仍开放；源码提交 `ff08645`，用户随后授权代码与文档分批提交、推送，本次未打包或发布。下面保留调查阶段记录，最终状态见[当前状态](../status/current.html)。

### 当前源码确认的缺口

1. `ReadSyncService._syncPendingReadsInternal()` 固定捕获 items/分组/IDs；等前批 HTTP 时移除后批项，不会更新旧快照，后批仍发出。
2. 失败重试沿用旧 chunk，不复核当前队列；即使 ArticleController 已移除持久项，旧循环仍可退避后补发。
3. `UndoService._undoLastAction()` 无对应 ArticleController 时，恢复未读分支只改本地并发 markUnread，没有取消旧已读项。详情已关闭时可走此分支；AlphaGenome 时序吻合，但日志未记录控制器注册状态，不把具体分支归因称为直接日志事实。

当前源码、隔离临时 Hive、假 HTTP adapter 受控复现三条缺口，**3/3 通过**：取消后重试仍发送、首批等待期间取消后批仍发送、无详情控制器撤销成功但队列仍保留。探针断言现有错误行为，不是修复回归，尚未移入正式测试或改业务代码。

修复建议：恢复未读/撤销统一取消旧任务；每批发送、重试、成功删除时按当前任务身份复核，防止旧请求删掉新入队项。已发到服务器的请求不能靠删持久项撤销，须保证同文章读/未读最终意图的顺序或安全补偿，不能用固定 sleep 代替竞态保护。实现与历史数据恢复另作为后续任务，不自动批量回写历史文章。

# 后台任务

任务中心在 macOS 和 Android 上都可见，用于展示正在进行或排队中的工作。

## 任务中心失败列表的页面容器

- macOS 从设置打开任务中心时使用现有局部玻璃面板；摘要和翻译的“查看失败”必须在该面板内切换内容，不能 `Get.to` 推入覆盖整个窗口的旧式页面。沿用面板外层遮罩、圆角、边距和关闭按钮，子页使用 22px 标题并为关闭按钮留位，左侧返回按钮恢复概览及原滚动位置；关闭按钮及遮罩仍关闭整个任务面板。
- 独立任务中心入口保留独立页面容器，Android 保留共享 `MobileBlurAppBar`、`MobileSettingsPanel` 和系统返回。进入失败子页时概览不再每秒触发重建；打开文章返回后刷新失败记录。失败卡片的时间与操作按钮在窄布局可换行，重试、禁用和空状态沿用既有语义。
- 同类排查覆盖自动翻译/自动摘要入口、关系重试、已读同步、过滤审核入口，以及设置中的许可证/认证弹窗。确定的容器错用出现在两个共享失败列表入口；许可证和认证已有平台容器，其他任务操作没有相同的失败页面跳转。2026-09-24 已通过导航、窄窗长标题与返回滚动恢复测试，随后用户确认新构建显示正常；确认范围见 TASK-UI-01。

返回概览时先恢复保存的偏移，由 ScrollPosition 在布局后处理真实边界；不要用惰性列表首帧估计的 maxScrollExtent 提前截断，否则靠近底部会产生位置偏差。

## 当前设计

- 应和设置页共享同一种轻量面板语言。
- 列表内部避免密集 Liquid Glass 表面；使用简单描边和微弱 hover 状态。
- 作为 overlay 打开时，背景应保证可读。
- Scrollbar 不应造成左右 padding 不对称或出现重复条。
- Android 保持设置页进入的二级页面，使用 `MobileBlurAppBar`、`12px` 页面边距和 `MobileSettingsPanel` 轻量外壳。AI 失败记录继续作为下一级页面；不要用旧式透明 Card 或密集实时玻璃重做。

## 交互注意点

- macOS 如需保留上下文可以继续使用 overlay；Android 已确认采用完整二级页面，不应为了跨平台形式一致强行改成 overlay。
- “去审核”等操作应符合当前 macOS 控件语言，不要使用旧的移动端按钮样式。
- 如果某个操作被刻意隐藏或移除，应记录产品原因；否则把它当作 bug。

## AI 队列：滚动补位调度

三个 AI worker（自动翻译 / 自动摘要 / AI 过滤）与全文抓取队列采用**滚动补位**调度：

- 任一任务完成后**立即**补充一个新任务，运行中数量始终不超过各自并发配置；不再整批取并发数后 `Future.wait`，慢任务不再阻塞后续任务。
- 三个 worker 保持完全独立：独立的队列、独立的并发配置（`LlmConfig` 的 translate / summary / filter 前缀）与独立生命周期，不合并成共享调度器。
- 并发数在每次补位时按最新配置读取；运行中修改并发数在后续补位时生效，不中断正在运行的任务。
- 取消（账号切换时由 `AccountDataService` 调用）清空队列与运行中集合，并推进各 Worker 自己的运行代次；旧代次任务可以自然结束，但其完成回调不得删除新代次的同 entryId 运行标记或触发补位。账号 revision 失效后的在途结果不落库，全文抓取的旧失败结果也不得写失败状态或安排重试。
- AI 过滤出队时按最新持久化状态跳过已读 / 已判定 / 已捞回文章。
- 全文抓取（`AutoReadabilityWorker`）为并发 3 的滚动补位队列。
- 刷新响应可能仍携带 RSS 短摘要，而本地库已保存 Readability 全文。全文 Worker 真正执行时必须按 `entryId` 重新比较持久化正文：队列正文为空，或本地正文比队列快照明确多出 `100` 字符以上时，过滤、摘要和翻译统一使用本地完整正文；不得把刷新时的旧短快照直接传给 AI。
- 所有可导入的 LLM 并发值在运行时限制为 `1..1024`；旧配置或手工 JSON 中的 `0` 不得让 worker 永久空转。
- DeepSeek 返回确定性的 `Content Exists Risk` 时，三个 AI worker 只执行当前一次请求，并按任务类型与文章 ID 写入账号级自动重试阻断；后续刷新不再重新入队。用户明确手动重试摘要或翻译时解除对应阻断，普通网络错误仍按既有退避策略重试。

## 长文章分块翻译

- worker 的翻译并发表示“同时处理的文章数”。不同文章继续按翻译并发配置运行。
- 单篇超过阈值后，其内部 HTML 分块必须顺序请求，避免 `文章并发 × 分块数` 放大为瞬时 API 洪峰。
- 每个分块独立重试；已成功分块在本次翻译过程中保留，一个分块失败不得重发此前成功块。
- 任一分块最终失败时不保存残缺译文，继续沿用整篇失败/恢复上一完成态的语义。
- 每次真实分块请求仍独立写入 `LlmUsageLedger`，因此重试成本可以准确复盘。

## 全文抓取成功标记与重试

- 成功标记 `readability_fetched_<entryId>` **只在成功解析并持久化有效正文后写入**；失败不再写标记，因此可重试。
- 失败登记可诊断状态 `readability_fetch_state_<entryId>`（attempts / lastError / lastAt），自动重试有限次数 + 指数退避（2s / 5s），达到上限后停止并保留失败状态。
- 上述上限只约束一次入队链路。当前持久化失败状态会让文章在后续启动/刷新再次满足兼容入队条件，因此长期失败的文章累计 attempts 可能明显超过单轮上限。2026-08-31 只读数据库审计确认存在该现象；它不是正文 `SelectionArea` 空 chunk 断言的原因，本轮没有顺带修改。未来应先确定“永久失败、手动重试、刷新重试”的产品节奏，再收敛跨刷新策略。
- 旧版本在请求前就打标记的历史数据**不批量清除**；只有正文为空或明确失败且文章仍未读时进入有限次兼容重试。
- 已开始抓取的文章即使完成前被标为已读，也允许这一条已开始的流水线继续进入翻译和摘要（`AutoAiQueueCoordinator.onArticleContentAvailable(allowRead: true)`）；尚未开始的等待任务在出队时若已标为已读则移除。
- 打开文章只记录最近阅读，不得因此标记已读。

## 关系建立队列

文章关系是摘要完成后的独立增益链路，不属于现有 AI 质量过滤，也不与翻译、摘要、过滤三个滚动补位 worker 合并：

- 关系建立是可选的高 token 消耗功能，默认关闭。关闭不是暂停：当前任务结果作废，pending 节点被删除，关闭期间完成的摘要不会排队或在重新开启后补算；已有关系与历史窗口保留。
- 任务中心在关闭时显示“已关闭”，垃圾拦截 header 的关系建立状态显示“关闭”，不能把已保留的历史关系误报为正在工作。
- 第一次启用时写入账号级 `activatedAt`；只消费此后完成并持久化的结构化摘要，启用前旧摘要不会批量进入关系判断。摘要正文缺失、失败或仍 pending 时不入队。
- 每次最多取 128 篇新摘要；历史窗口从 0 开始随成功批次增长。请求输入是“本批新摘要 + 当前历史窗口”的一个整体，不生成 128×1024 个请求。
- worker 固定单飞。凑满 128 篇立即发车；摘要 worker 完全空闲后，不足 128 篇的尾批也立即发车。冷启动本身不得反复冲刷尾批；失败、空响应、非法 JSON 或输出截断时保留 pending，且不推进历史窗口，重启后恢复任务中心错误提示并等待用户明确重试。
- 手动生成或重试摘要不依赖自动摘要 worker 的生命周期；单篇完成后会显式请求处理当前尾批，避免少于 128 篇时必须等到重启。
- DeepSeek 使用 JSON Object 模式。批次记录保存模型、Prompt/schema 版本、耗时、组数以及 prompt/completion/cache hit/cache miss token，供后续真实数据分析。
- JSON 结果区分 `equivalent`（近似重复）和 `same_event`（同一事件）两类无向关系。v4 使用稳定事件组 ID 显式加入，每篇文章最多一个事件归属；取消重叠合并与递归扩散，近似重复独立保留。新协议首次启动重置旧派生关系与队列，保留摘要、批次和调用账本，详见[关系语义](translation-summary.html)。
- 关系 Prompt 已纳入设置与 version 1 配置导入导出；每次请求的 Prompt 版本使用内容指纹区分，修改 Prompt 后不会把新旧关系结果误当成同一实验口径。
- 当前调度参数固定为每批最多 128 篇新摘要、历史阈值 2048、单批串行。关系请求默认输出上限为 32K；仅在明确因输出上限截断时以 64K 重试，其他错误不靠提高上限解决。设置页将调度字段并入“关系判断 LLM 参数”并保持禁用，继续通过真实质量、token、缓存命中和耗时调整。
- 所有 Prompt 的请求使用单一 `articles` 数组和末尾 `new_ids`，其后追加可变的事件组主题、归属映射和 v4 协议：文章以持久 sequence 生成稳定 `Axxxxxx` ID，历史文章在前、本批新文章只追加到数组末尾；下一批中文章从“新”变成“历史”时不再改标签或移动 JSON 区域，因此除数组尾部外可以继续命中 DeepSeek 自动前缀缓存。由旧 `N/H + new/history` 默认格式升级后的第一次请求需要重建缓存，后续可复用相同前缀，但不保证服务端必然缓存命中。
- 成功追加后仅当历史数超过 2048 才从队首固定淘汰 1024 篇，因此窗口会在约 1025～2048 篇间波动：例如 `2048 + 1 - 1024 = 1025`，随后再新增 20 篇为 1045。淘汰步长与每批新摘要上限彼此独立，避免为了降低换头频率而放大单次关系判断。队首淘汰仍会改变请求开头并使下一次缓存命中明显下降。
- 已知仓库默认 Prompt 会精确匹配并自动迁移到 `articles/new_ids` 新契约；真正自定义的旧 Prompt 不覆盖，并继续接收原 `history/new + H/N` 输入以保持兼容。不要用关键词模糊判断用户是否自定义。
- pending、历史窗口、关系节点/组和批次使用账号级 Hive 数据；账号退出或切换时清理，不进入设置导入导出。
- 任务中心“关系建立”展示排队数、当前 `new + history`、本次完成批次、历史窗口、关系组和最近错误，并允许安全重试。

当前阶段只记录、展示和统计关系，**不会**自动改变已读、人工动作或垃圾拦截状态。未来自动连带拦截仍是独立待验证决策；即使启用，也只能由 `equivalent` 触发，`same_event` 只用于发现和比较，不能因同一事件存在新增信息而自动拦截。

## DeepSeek 请求用量账本

`LlmUsageLedger` 为翻译、摘要、质量过滤和关系建立提供统一的请求级 Hive 账本（box `llmUsageEvents`）：

- 每一次真实 HTTP 尝试单独记录，重试和分块翻译不会被合并；响应成功但本地解析失败时仍保留已经产生的 token 用量。
- 记录任务类型、文章/批次/分块标识、请求次数、耗时、结果、请求与实际模型、thinking/reasoning 参数、HTTP 状态、provider request id、finish reason、system fingerprint，以及 prompt/cache hit/cache miss/completion/reasoning/total token。
- 只保存 Prompt 的 SHA-256 指纹，不保存 Prompt、正文、摘要、译文、模型输出或 reasoning 内容；错误文本截断为 500 字符。
- `LlmUsageLedger.summarize()` 可按全部任务或单一任务汇总请求数、成功/失败数、各类 token 和缓存命中率，供未来统计中心直接复用。
- 账本采用尽力写入；本地存储异常时允许漏记统计，但绝不能让翻译、摘要、过滤或关系请求因此失败。
- 该账本是应用级历史统计，账号退出或切换时不清除；它不进入设置配置导出。后续如提供导出功能，需要单独说明其数据范围与隐私边界。
- DeepSeek 在省略 `thinking` 时会按 Provider 默认值启用思考模式；因此 `LlmConfig.toRequestBody()` 始终显式发送 `thinking.type`（`enabled` 或 `disabled`），且只有启用时才发送 `reasoning_effort`。这保证设置中的关闭状态不会被 Provider 默认值覆盖；历史账本记录不回写，需按请求时间观察修复后的新记录。

## 本地分析事件账本

`AnalysisEventLedger` 是版本化、追加式、本地 Hive 事件账本（box `analysisEvents`），作为未来统计中心和 JSON 导出的唯一数据来源：

- 记录 AI 分类结果、理由与时间；用户 M/K/N 操作及操作前后状态快照；真实发生的已读 / 未读状态变化；文章打开事件；事件含 articleId、feedId、订阅源名称、标题与必要状态。
- 已读状态事件携带 `user` / `syncInference` 来源；服务器快照推断与用户动作必须可区分。状态没有变化时不得重复记账，避免每次刷新污染未来统计。
- 每次真正调用 Folo 标已读接口时，追加 `remote_mark_read_attempt` 与 `remote_mark_read_result`：记录文章 ID 列表、Inbox 分组、调用来源、请求耗时、HTTP 状态和失败类型，并以 attempt sequence 关联请求与结果。离线待同步队列还记录各文章原始入队时间，以区分“当前操作”与“旧任务稍后补发”。
- 远端请求来源分为文章控制器、普通操作、批量操作和待同步队列。该审计用于回答“Fourier 是否、何时、经哪条链路向 Folo 发出标已读请求”；syncInference 只表明客户端从未读快照缺失推断已读，不等于逐条服务端明确返回 read=true，也不能反推状态由谁造成或快照是否完整。
- 审计从功能加入后开始生效，不能重建此前已经成功并从待同步队列删除的请求历史。请求已发出但应用退出时，可能只有 attempt 而没有 result，这本身也是诊断证据。
- 语义：K 表示「保留或稍后确认」，不能自动解释为 AI 分类错误；N（n_spam）把漏网文章移入垃圾拦截，才是明确纠正信号。
- 从新版本开始记录，不伪造历史事件；`article.userAction` 等现有字段继续兼容，不移除。
- 不保存正文、摘要、翻译、Prompt、API key、Session Token，也不保存请求头或完整响应体。
- 数据属于当前活动账号，退出或切换账号时随账号数据清理；暂不限制事件数量、不做统计中心与导出 UI。
- 事件写入集中在操作服务（过滤 worker、UndoService、LocalArticleDbService、文章页打开入口），不在页面重复拼装。
