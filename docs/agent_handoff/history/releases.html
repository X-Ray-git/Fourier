# 发布记录

本页保存曾由发布流程追加到根 `AGENT_HANDOFF.md` 的发布足迹。当前发布方法以 [发布与构建](../operations/release-build.html) 为准，更完整的旧发布背景位于 [发布、Git、Worktree 与 CI 归档](../history/archive/release-git-and-ci.html)。

## v1.1.27

```bash
./scripts/release.sh 1.1.27 -m "- feat: support inline YouTube playback and macOS system fullscreen\n- fix: improve local video loading, aspect ratio, controls and keyboard behavior\n- style: refine macOS timeline, article cards, scrollbars and compact glass controls\n- fix: improve article metadata rendering, timeline interactions and macOS startup stability" --push
```

## v1.1.28

```bash
./scripts/release.sh 1.1.28 -m "- feat: add swipe review actions and coordinated list transitions\n- fix: stabilize macOS control interactions and timeline read animations\n- style: refine compact timeline controls and article scrollbar spacing" --push
```

这些命令只作为历史证据，不应直接复制执行。创建新版本前必须重新确认版本号、提交状态和 release notes。

## v1.2.0

```bash
./scripts/release.sh 1.2.0 -m $'- feat: add macOS subscription management with undoable changes\n- feat: add unified YouTube and Bilibili playback with quality, subtitles and danmaku\n- fix: align embedded video controls, shortcuts, scrolling and fullscreen across platforms' --push
```

首次 tag 触发时，Android 因 workflow 引用了不存在的
`actions/setup-java@v6` 而在 job 初始化阶段失败，未创建 GitHub Release。
确认没有正式发布产物后删除该 tag；workflow 改为使用 Node 24 的
`actions/setup-java@v5`，随后在保持 `1.2.0+31` 和原 release notes 不变的
前提下，于修复提交上重建 annotated `v1.2.0`。

## v1.2.1

```bash
./scripts/release.sh 1.2.1 -m $'- feat: add cross-platform Folo browser login and account switching\n- feat: add misclassification actions with atomic undo and review markers\n- feat: retry failed article images with deterministic backoff\n- fix: preserve undo animations and Android settings labels' --push
```


## v2.0.0

```bash
./scripts/release.sh 2.0.0 -m $'- breaking: rebrand Auto Folo as Fourier with new app identifiers and icons; existing version 1 settings exports remain importable\n- feat: add summary-based article relationship discovery, related-article review, queue monitoring, and local LLM usage/analysis ledgers\n- docs: replace the legacy handoff with a self-contained offline Fourier Wiki and complete repository identity cleanup\n- perf: use rolling-slot AI workers and harden translation, readability, image-cache, and account-bound task persistence\n- fix: improve YouTube/Bilibili fallbacks, image recovery, external links, recent-reading stability, and Android haptics\n- style: unify Android reading pages with transparent headers, shared edge fades, safe insets, and native-backdrop toolbar controls' --push
```

首次生成的 GitHub Release 正文原样采用了上述英文 tag annotation，因而缺少
此前版本使用的中文章节与完整变更链接。2026-08-09 已仅编辑公开 Release 正文，
未移动 tag、未替换附件、未重新触发构建。随后为 `scripts/release.sh` 增加标准
章节校验与 `--notes-file` 支持，避免普通发布再次依赖事后人工整理。

## v2.1.0

```bash
./scripts/release.sh 2.1.0 -m '## 本版重点

Fourier 2.1.0 完善了文章关系分析、跨平台媒体播放与后台任务可靠性，并首次加入手动检查更新能力。本版本还完成 Flutter 3.47 工具链迁移，收敛 Folo 接口与认证边界，修复 Android 导航、macOS 能耗诊断和多项文章阅读体验问题。

## 新功能

- 扩展文章关系上下文，区分“内容近似”和“主题相关”两类关系，并优化稳定前缀以提高模型缓存复用率。
- 关系建立功能可在设置中独立开关且默认关闭；关系导航、审核页状态与后台任务进度得到补全。
- 设置页加入手动检查更新：Android 从 GitHub Release 下载并校验 APK 后交给系统安装器；macOS 使用 Sparkle 签名更新。
- 重新设计开源许可证页面，并完善项目内许可证与第三方贡献信息展示。
- 增加 macOS 能耗诊断能力，便于后续定位长期运行时的高功耗来源。

## 修复与改进

- 对齐 Folo 官方接口契约及认证边界，增强账号切换、异步状态和后台服务的隔离与恢复能力。
- 完善阅读状态审计，修复审核页面与相关文章之间的返回、跳转和标题显示问题。
- 修复 Android 顶栏透明横带、返回导航、邮件内容渲染及文章图片显示问题。
- 修复 macOS 右键菜单定位、非活动文章动画占用及多项图片和过滤界面细节。
- 改善 YouTube 启动状态：隐藏中间失败画面，并将统一总超时改为分阶段无进展超时，避免 WEB_EMBEDDED/SABR 失败耗尽 MWEB 播放时间后错误回退网页播放器。
- YouTube Debug 诊断不记录签名媒体 URL、Token 或请求体；Release 不运行周期采样。
- 收紧本地隐私边界，并增强后台任务取消、持久化和失败恢复的一致性。

## 性能改进

- 关系判断使用稳定历史标签与扩展上下文，减少相邻批次中不必要的前缀缓存失效。
- 不可见文章暂停动画，降低 macOS 长时间阅读时的持续渲染负担。
- YouTube 播放诊断仅在 Debug 启用，正式版本不增加周期采样开销。

## 升级说明

- 本版本升级到 Flutter 3.47.0 / Dart 3.13.0，macOS 最低支持版本调整为 macOS 12，macOS 安装包仍仅构建 arm64。
- 这是首个包含 Sparkle 更新器的版本，因此从 v2.0.0 升级到 v2.1.0 仍需手动下载安装；安装 v2.1.0 后，后续 macOS 版本可使用设置页中的手动检查更新。
- Android 仍要求与现有安装版本使用相同签名，升级过程不会清除应用数据。
- 文章关系建立默认关闭；启用后仅处理启用期间新进入流程的文章，不补积压关闭期间的旧文章。

**完整变更**：https://github.com/X-Ray-git/Fourier/compare/v2.0.0...v2.1.0' --push
```

## v2.2.0

```bash
./scripts/release.sh 2.2.0 -m '## 本版重点

Fourier 2.2.0 扩展了图片型内容的多模态摘要与质量过滤能力，引入跨平台静默订阅源分组，并继续完善相关文章导航、文章渲染、媒体播放和阅读状态动画。本版本也强化了后台任务持久化与诊断能力，减少长时间使用和异步更新中出现的状态错乱。

## 新功能

- 摘要和质量过滤可在纯文本信息不足时使用视觉模型，并将本地缓存图片以内联数据传给 DeepSeek 多模态接口。
- macOS 与 Android 均支持将静默订阅源整理到自定义分组；既有静默源自动归入“未分组”，不改变 Folo 原始分类。
- 扩展相关文章历史窗口至 2048 篇，保持每批最多 128 篇新摘要，并按 1024 篇步长淘汰旧历史，以增强远距离关联和前缀缓存复用。
- 增加 macOS 能耗活动诊断，为长期运行时的异常功耗定位提供本地证据。

## 修复与改进

- 修复视觉模型请求只传图片 URL、导致模型无法读取图片的问题；图片获取失败时仍保留纯文本结果。
- 明确关闭翻译任务的思考模式，避免不必要的 reasoning token 消耗。
- 修复全文抓取后下游 AI 仍使用短摘要、邮件正文清洗不完整以及翻译结果持久化时序问题。
- 稳定 macOS 时间线的已读、撤销和相关文章跳转动画，并在相关文章操作后恢复原阅读上下文。
- 修复文章正文选择、列表与引用排版、空文本范围断言、HTML 实体显示及图片反复重建闪烁等问题。
- 修复 Android 次级列表顶端安全距离、隐藏页面视频继续播放和顶端渐变不均匀的问题。
- 改善过期媒体链接识别与可播放视频缓存，避免失效视频长期显示为普通加载失败。
- 完善后台任务取消、失败恢复、账号会话隔离和本地分析事件记录。

## 升级说明

- 版本号更新为 `2.2.0+35`，配置和本地数据继续兼容 `v2.1.0`。
- 已有静默订阅源升级后进入“未分组”，仍保持静默；自定义静默分组属于本地配置，可随配置备份迁移。
- 文章关系建立仍默认关闭；新的 2048 篇历史窗口会随启用后的新摘要逐步增长，不会主动补处理关闭期间的文章。
- 既有的纯文本摘要不会因升级自动重新生成；需要时可手动触发，使用新的多模态链路。

**完整变更**：https://github.com/X-Ray-git/Fourier/compare/v2.1.0...v2.2.0' --push
```

## v2.3.0

```bash
./scripts/release.sh 2.3.0 -m '## 本版重点

Fourier 2.3.0 增加 DeepSeek V4.1 Flash 支持，并强化翻译、摘要和质量过滤面对 Provider 异常响应时的恢复与停止策略。本版本同时恢复 macOS 文章行内代码样式和相关文章切换动画，并降低长期图片加载失败时的持续渲染开销。

## 新功能

- 增加 DeepSeek V4.1 Flash，统一使用规范模型 ID `deepseek-flash`，并兼容迁移旧版 Flash 模型配置。
- 摘要和质量过滤的视觉模型设置同步支持 V4.1 Flash，配置导入导出继续兼容旧版本。

## 修复与改进

- 修复 DeepSeek JSON 模式在翻译 HTML 中返回裸换行或 `\%` 非标准转义时，完整译文被错误丢弃的问题；真正截断的响应仍会保持失败状态。
- 对 DeepSeek 内容安全拒绝建立统一策略：摘要、翻译和质量过滤不再重复提交相同的确定性失败请求，手动重试仍然可用。
- 修复摘要中的尖括号代码文本被误当作 HTML 标签、导致后续内容消失的问题。
- 恢复 macOS 行内代码的圆角、内边距和连续文本选择，并恢复相关文章原有的滑入淡入过渡与返回上下文。
- 限制长期图片加载占位符的持续动画时间，图片请求和后续恢复仍继续进行，减少异常资源导致的后台高功耗。

## 升级说明

- 版本号更新为 `2.3.0+36`，配置与本地数据继续兼容 `v2.2.0`。
- 旧版 `deepseek-v4-flash` 和 `deepseek-v4-flash-vision-exp` 配置会自动迁移为 `deepseek-flash`，无需重新填写 API Key 或 Prompt。
- 此前已经进入错误态的翻译不会批量自动重做；需要时可手动重新翻译，并使用新的有限 JSON 恢复逻辑。

**完整变更**：https://github.com/X-Ray-git/Fourier/compare/v2.2.0...v2.3.0' --push
```

## v2.3.1

```bash
./scripts/release.sh 2.3.1 -m '## 本版重点

修复 GitHub Release 构建与本地构建之间的文本渲染差异，使文章正文的选择高亮和行内代码样式保持一致。

## 修复与改进

- 修复 macOS Release 版本中文字选择高亮高度参差不齐的问题。
- 恢复行内代码的圆角、内边距与复制文本行为。
- 为 GitHub Actions 引入经过约束的 Flutter 3.47.0 文本渲染补丁，避免本地与发布环境再次分叉。
- 发布前在干净的官方 Flutter SDK 上执行完整测试、macOS Release 构建和 Android 烟雾构建。

**完整变更**：https://github.com/X-Ray-git/Fourier/compare/v2.3.0...v2.3.1' --push
```

## v2.3.2

```bash
./scripts/release.sh 2.3.2 -m '## 本版重点

改善部分订阅来源的正文与图片加载，清理阅读和 AI 处理中的重复内容。

## 修复与改进

- 修复 Paul Graham 部分旧式网页无法提取正文的问题，包括《Making Startups Powerful》，保留正文链接和脚注。
- 优化微信转载文章的图片加载，直接使用微信原图地址，避免第三方图片代理悬挂导致图片长期无法显示。
- 清理小众软件文章中固定的 AI 总结免责声明，减少阅读、摘要、翻译与导出中的重复噪声。

## 升级说明

- 版本更新为 `2.3.2+38`，无需迁移配置或本地数据。
- 此前没有正文的 Paul Graham 文章可在升级后重新打开，让应用重新抓取正文。
- 已保存的旧摘要不会自动重新生成，需要时可手动重新生成。

**完整变更**：https://github.com/X-Ray-git/Fourier/compare/v2.3.1...v2.3.2' --push
```
