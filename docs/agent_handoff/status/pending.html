# 待办与搁置事项

这是当前有效的未来事项索引，但不是必须立刻执行的任务列表。`history/archive/` 中的旧“后续计划”只是历史证据；除非已经提炼到本页或当前专题页，否则不能据此直接开工。旧章节的时间顺序和位置通过 `history/chronology.md` 查询。

## 操作事项

- 发布：当前源码版本为 `1.2.0+31`。除非用户明确要求，不提前改版本、打 tag 或触发 release；下一版本号应根据此后的实际改动规模按既有语义化规则决定。
- Worktree 清理：本地可能仍有功能 worktree。删除前必须检查，并且只在用户确认后清理。
- 旧 GitHub Release assets：可能包含历史签名或构建产物；用户可以在未来 release 后手动删除。当前不主动轮换密钥或改写历史。
- Android 多方式登录：Google 的精确深链、Session 落地和数据重建已真机确认；仍需验证方式选择 UI、取消、GitHub、Email 错误反馈、Email 正常登录及 TOTP（具备对应账号时）、账号切换确认和本地退出重登。当前 intent filter 只声明精确 host；若仍出现应用选择器或进入官方 Folo，必须停止并重新评估，不能扩大到整个 `folo://`。
- Android 误分类按钮：macOS 已上线（`N`/右上角旗帜按钮）；Android 是否安装待定。字段与统计语义已随共享模型落库，接入时复用 `applyMisclassify`/`applyFilterReject`/`applyFilterKeep` 与页面级/组件级快捷键模式，并补充本页 `features/filter-review.md` 的禁用规则。

## 已确认的功能缺口

- 旧图片缓存清理：新文章级缓存机制不会清理历史 `v2_` 文件。后续如确有空间回收需求，应提供一次明确的旧缓存清理操作，不要把迁移隐式塞进普通刷新。
- 关系自动拦截：第一阶段只记录和展示关系。待真实数据确认关系数量与准确性后，再决定是否启用“任意近似重复组员已读时，把尚未人工 K/M/N 的未读组员移入垃圾拦截”。只有 `equivalent`（近似重复）可以参与自动化；`same_event`（同一事件）因允许明显新增信息，只用于发现和对比。启用前必须评估已有关系会移动多少文章；若会批量影响现有数据，应先确认，不能静默生效。K/M/N 文章永远不能作为连带操作目标，但已读的 K/M/N 仍可作为触发来源；K 不等于关系误判。质量过滤与关系原因必须结构化保存，未来同时命中时才机械展示 `相关文章已阅读；质量理由`。

## 已接受的源内容边界

- 破损交互式 iframe：部分 Folo 内容已丢失 `srcdoc` 或脚本上下文，无法可靠还原。若未来支持，应重新抓取原网页并设计受限、懒加载 WebView；不要放宽当前“仅 YouTube/Bilibili 官方视频 iframe”白名单。
- 罕见畸形 HTML：继续遵循窄修复原则。除非同类失败明确反复出现，否则不要为了个例增加复杂通用启发式。

## 条件触发的架构方向

- 阅读渲染与 LLM 输入清洗拆分：只有表格、Newsletter 布局等规则继续分化时，才审计调用链并建立两套规范化管线与独立缓存键。
- macOS 分栏文章列表协调器：垃圾拦截和主时间线已经接入；最近阅读尚未迁移。只有最近阅读继续出现选择、移除动画或 reveal 分叉问题时再接入，且恢复未读后的选择语义需要先确认。
- 文章正文虚拟化：正文 `Column` 是有意保留，用于保护全文选择、目录锚点、图片生命周期和稳定滚动。只有出现可复现且其他办法无法解决的长文性能问题时，才重新评估 `SliverList.builder`。
- macOS 滚动惯性：已有可配置 fling 上限；更深层触控板输入过滤因早期实验效果不佳且可能破坏平台手感、scrollbar、选择、嵌套滚动和可访问性而搁置。
- 完整 Liquid Glass UI：当前实现刻意克制。未来若做更大范围 macOS UI 重构，必须持续做性能验证，不能在密集重复元素上重新引入重型玻璃。
- Android 视觉 fallback：这不是要求把 macOS Liquid Glass 完整移植到 Android。Android 应继续使用轻量实现，不继承 macOS 专属 renderer 和重复玻璃的性能成本。
- 真实窗口后方取色边框：Flutter-only 方案已放弃。若重新讨论，应作为独立 native/AppKit renderer 实验。
- 圆角/半径统一：macOS 主几何层第一阶段已完成。后续只在用户视觉验证驱动下微调，不全局替换图片、胶囊、小标签或 Android 圆角。
- 菜单视觉统一：文章动作、正文图片和图片查看器菜单已经迁移；普通筛选/下拉菜单只有在现有视觉确实产生问题时再决定是否迁移。
- 文章封面：当前没有独立封面机制。未来加入时必须使用 `article-cover` 缓存角色，不能复用正文五分钟清理键。
- 其他旧缓存数据迁移：除非用户明确要求，一般不做批量迁移；大多数兼容修复只作用于新拉取数据或读取时规范化。

## 维护规则

- 新增明确延期事项时更新本页，并在对应专题页保留实现边界；不要只写进历史时间线。
- 已完成、取消或被新决策覆盖的事项应从本页删除，历史证据继续留在 `history/archive/`、`history/chronology.md` 和 `history/decisions.md`。
- 继续维护专题页和决策页，不要重新形成单个巨大的交接文档。
