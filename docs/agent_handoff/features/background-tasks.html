# 后台任务

任务中心在 macOS 和 Android 上都可见，用于展示正在进行或排队中的工作。

## 当前设计

- 应和设置页共享同一种轻量面板语言。
- 列表内部避免密集 Liquid Glass 表面；使用简单描边和微弱 hover 状态。
- 作为 overlay 打开时，背景应保证可读。
- Scrollbar 不应造成左右 padding 不对称或出现重复条。
- Android 保持设置页进入的二级页面，使用 `MobileBlurAppBar`、`12px` 页面边距和 `MobileSettingsPanel` 轻量外壳。AI 失败记录继续作为下一级页面；不要用旧式透明 Card 或密集实时玻璃重做。

## 交互注意点

- macOS 如需保留上下文可以继续使用 overlay；Android 已确认采用完整二级页面，不应为了跨平台形式一致强行改成 overlay。
- “去审核”等操作应符合当前 macOS 控件语言，不要使用旧的移动端按钮样式。
- 如果某个操作被刻意隐藏或移除，应记录产品原因；否则把它当作 bug。

## AI 队列：滚动补位调度

三个 AI worker（自动翻译 / 自动摘要 / AI 过滤）与全文抓取队列采用**滚动补位**调度：

- 任一任务完成后**立即**补充一个新任务，运行中数量始终不超过各自并发配置；不再整批取并发数后 `Future.wait`，慢任务不再阻塞后续任务。
- 三个 worker 保持完全独立：独立的队列、独立的并发配置（`LlmConfig` 的 translate / summary / filter 前缀）与独立生命周期，不合并成共享调度器。
- 并发数在每次补位时按最新配置读取；运行中修改并发数在后续补位时生效，不中断正在运行的任务。
- 取消（账号切换时由 `AccountDataService` 调用）清空队列与运行中集合，并推进各 Worker 自己的运行代次；旧代次任务可以自然结束，但其完成回调不得删除新代次的同 entryId 运行标记或触发补位。账号 revision 失效后的在途结果不落库，全文抓取的旧失败结果也不得写失败状态或安排重试。
- AI 过滤出队时按最新持久化状态跳过已读 / 已判定 / 已捞回文章。
- 全文抓取（`AutoReadabilityWorker`）为并发 3 的滚动补位队列。
- 所有可导入的 LLM 并发值在运行时限制为 `1..1024`；旧配置或手工 JSON 中的 `0` 不得让 worker 永久空转。

## 长文章分块翻译

- worker 的翻译并发表示“同时处理的文章数”。不同文章继续按翻译并发配置运行。
- 单篇超过阈值后，其内部 HTML 分块必须顺序请求，避免 `文章并发 × 分块数` 放大为瞬时 API 洪峰。
- 每个分块独立重试；已成功分块在本次翻译过程中保留，一个分块失败不得重发此前成功块。
- 任一分块最终失败时不保存残缺译文，继续沿用整篇失败/恢复上一完成态的语义。
- 每次真实分块请求仍独立写入 `LlmUsageLedger`，因此重试成本可以准确复盘。

## 全文抓取成功标记与重试

- 成功标记 `readability_fetched_<entryId>` **只在成功解析并持久化有效正文后写入**；失败不再写标记，因此可重试。
- 失败登记可诊断状态 `readability_fetch_state_<entryId>`（attempts / lastError / lastAt），自动重试有限次数 + 指数退避（2s / 5s），达到上限后停止并保留失败状态。
- 旧版本在请求前就打标记的历史数据**不批量清除**；只有正文为空或明确失败且文章仍未读时进入有限次兼容重试。
- 已开始抓取的文章即使完成前被标为已读，也允许这一条已开始的流水线继续进入翻译和摘要（`AutoAiQueueCoordinator.onArticleContentAvailable(allowRead: true)`）；尚未开始的等待任务在出队时若已标为已读则移除。
- 打开文章只记录最近阅读，不得因此标记已读。

## 关系建立队列

文章关系是摘要完成后的独立增益链路，不属于现有 AI 质量过滤，也不与翻译、摘要、过滤三个滚动补位 worker 合并：

- 关系建立是可选的高 token 消耗功能，默认关闭。关闭不是暂停：当前任务结果作废，pending 节点被删除，关闭期间完成的摘要不会排队或在重新开启后补算；已有关系与历史窗口保留。
- 任务中心在关闭时显示“已关闭”，垃圾拦截 header 的关系建立状态显示“关闭”，不能把已保留的历史关系误报为正在工作。
- 第一次启用时写入账号级 `activatedAt`；只消费此后完成并持久化的结构化摘要，启用前旧摘要不会批量进入关系判断。摘要正文缺失、失败或仍 pending 时不入队。
- 每次最多取 128 篇新摘要；历史窗口从 0 开始随成功批次增长。请求输入是“本批新摘要 + 当前历史窗口”的一个整体，不生成 128×1024 个请求。
- worker 固定单飞。凑满 128 篇立即发车；摘要 worker 完全空闲后，不足 128 篇的尾批也立即发车。冷启动本身不得反复冲刷尾批；失败、空响应、非法 JSON 或输出截断时保留 pending，且不推进历史窗口，重启后恢复任务中心错误提示并等待用户明确重试。
- 手动生成或重试摘要不依赖自动摘要 worker 的生命周期；单篇完成后会显式请求处理当前尾批，避免少于 128 篇时必须等到重启。
- DeepSeek 使用 JSON Object 模式。批次记录保存模型、Prompt/schema 版本、耗时、组数以及 prompt/completion/cache hit/cache miss token，供后续真实数据分析。
- JSON 结果区分 `equivalent`（近似重复）和 `same_event`（同一事件）两类无向关系。同一事件簇按重叠成员跨批次合并；近似重复组不被事件合并吞并。持久化 schema v1 中没有类型的旧关系按近似重复读取。
- 关系 Prompt 已纳入设置与 version 1 配置导入导出；每次请求的 Prompt 版本使用内容指纹区分，修改 Prompt 后不会把新旧关系结果误当成同一实验口径。
- 当前调度参数固定为每批最多 128 篇新摘要、历史阈值 1024、单批串行。关系请求默认输出上限为 32K；仅在明确因输出上限截断时以 64K 重试，其他错误不靠提高上限解决。设置页将调度字段并入“关系判断 LLM 参数”并保持禁用，继续通过真实质量、token、缓存命中和耗时调整。
- 请求序列化时把稳定的 history 数组放在变化的 new 数组之前，以尽量利用 DeepSeek 自动前缀缓存。成功追加后仅当历史数超过 1024 才从队首固定淘汰 128 篇，因此窗口会在约 897～1024 篇间波动：例如 `1024 + 1 - 128 = 897`，随后再新增 20 篇为 917。分块淘汰让小批量更新之间保留更长的稳定前缀；发生淘汰的那一次仍会因 history 起点变化而降低缓存命中。
- pending、历史窗口、关系节点/组和批次使用账号级 Hive 数据；账号退出或切换时清理，不进入设置导入导出。
- 任务中心“关系建立”展示排队数、当前 `new + history`、本次完成批次、历史窗口、关系组和最近错误，并允许安全重试。

当前阶段只记录、展示和统计关系，**不会**自动改变已读、人工动作或垃圾拦截状态。未来自动连带拦截仍是独立待验证决策；即使启用，也只能由 `equivalent` 触发，`same_event` 只用于发现和比较，不能因同一事件存在新增信息而自动拦截。

## DeepSeek 请求用量账本

`LlmUsageLedger` 为翻译、摘要、质量过滤和关系建立提供统一的请求级 Hive 账本（box `llmUsageEvents`）：

- 每一次真实 HTTP 尝试单独记录，重试和分块翻译不会被合并；响应成功但本地解析失败时仍保留已经产生的 token 用量。
- 记录任务类型、文章/批次/分块标识、请求次数、耗时、结果、请求与实际模型、thinking/reasoning 参数、HTTP 状态、provider request id、finish reason、system fingerprint，以及 prompt/cache hit/cache miss/completion/reasoning/total token。
- 只保存 Prompt 的 SHA-256 指纹，不保存 Prompt、正文、摘要、译文、模型输出或 reasoning 内容；错误文本截断为 500 字符。
- `LlmUsageLedger.summarize()` 可按全部任务或单一任务汇总请求数、成功/失败数、各类 token 和缓存命中率，供未来统计中心直接复用。
- 账本采用尽力写入；本地存储异常时允许漏记统计，但绝不能让翻译、摘要、过滤或关系请求因此失败。
- 该账本是应用级历史统计，账号退出或切换时不清除；它不进入设置配置导出。后续如提供导出功能，需要单独说明其数据范围与隐私边界。

## 本地分析事件账本

`AnalysisEventLedger` 是版本化、追加式、本地 Hive 事件账本（box `analysisEvents`），作为未来统计中心和 JSON 导出的唯一数据来源：

- 记录 AI 分类结果、理由与时间；用户 M/K/N 操作及操作前后状态快照；真实发生的已读 / 未读状态变化；文章打开事件；事件含 articleId、feedId、订阅源名称、标题与必要状态。
- 已读状态事件携带 `user` / `syncInference` 来源；服务器快照推断与用户动作必须可区分。状态没有变化时不得重复记账，避免每次刷新污染未来统计。
- 语义：K 表示「保留或稍后确认」，不能自动解释为 AI 分类错误；N（n_spam）把漏网文章移入垃圾拦截，才是明确纠正信号。
- 从新版本开始记录，不伪造历史事件；`article.userAction` 等现有字段继续兼容，不移除。
- 不保存正文、摘要、翻译、Prompt、API key、Session Token。
- 数据属于当前活动账号，退出或切换账号时随账号数据清理；暂不限制事件数量、不做统计中心与导出 UI。
- 事件写入集中在操作服务（过滤 worker、UndoService、LocalArticleDbService、文章页打开入口），不在页面重复拼装。
