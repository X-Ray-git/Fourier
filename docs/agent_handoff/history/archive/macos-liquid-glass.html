## 146. 后续 macOS 液态玻璃 UI 重构上下文（2026-06-26）

### 146.1 用户意图与总体边界

用户明确表达：后续有将整体 UI 重构为更接近 Apple / iOS 26 Liquid Glass 风格的想法，尤其是 macOS 端。当前只是讨论与准备上下文，尚未开始正式 UI 重构。

已确认边界：

- `reference/liquid_glass_widgets` 只作为参考工程。
- 不把参考工程作为 package、submodule、git 依赖或运行时外部路径。
- 当前仓库必须保持自包含：clone 到任何地方都应能独立构建和运行。
- 如果未来迁移/复制参考工程中的 MIT 代码或 shader，必须把需要的源码、shader、资源、许可与 attribution 一并纳入本仓库。
- 不允许要求运行环境额外存在 `reference/liquid_glass_widgets`。
- 用户不希望做“先凑合、以后再改”的半成品。如果开始重构，应按目标形态认真设计与实现。
- 新问题当然可以继续向用户确认，但不要重复询问上述已经确认的原则。

### 146.2 为什么本轮没有直接引入完整 shader 液态玻璃

本轮阅读参考工程后确认：`reference/liquid_glass_widgets` 不只是毛玻璃样式库，而是有完整渲染体系：

- `shaders/lightweight_glass.frag`
- `shaders/interactive_indicator.frag`
- `shaders/liquid_glass_geometry_blended.frag`
- `shaders/liquid_glass_final_render.frag`
- `LiquidGlassLayer`
- `LiquidGlassBlendGroup`
- `AdaptiveLiquidGlassLayer`
- `GlassMorphController`
- `LiquidMorphPhysics`

参考工程的 `GlassMenu` 是“小按钮/小组件液态展开成大组件”的标准参考实现，使用：

- ghost trigger
- menu body
- J-curve / spring
- anchor blob 缩小
- body 从触发器中心移动并扩张
- SDF/metaball 形变
- 内容在容器接近成形后再淡入

但本轮只是文章页目录与阅读体验小版本修复，直接引入 shader/renderer 体系会把风险扩大到构建、性能、平台兼容和发布链路，因此没有混入 `v1.1.22`。

### 146.3 推荐路线：先 macOS，后 Android

已经讨论并建议：下一阶段如果开始液态玻璃 UI 重构，应优先做 macOS，不建议 Android 同时全量重构。

理由：

- macOS 端的使用场景更适合液态玻璃：左侧列表、右侧阅读、悬浮目录、工具按钮、分栏布局都接近桌面 Apple 风格。
- Android 刚处理过文章打开转场卡顿和进度条/滚动稳定性问题，大量 blur/shader/玻璃层更容易引入性能和视觉问题。
- “逻辑统一”不等于“双端视觉同步上线”。更好的方式是抽象统一组件 API，然后按平台实现：
  - macOS 使用液态玻璃实现。
  - Android 先保留轻量 Material / 轻毛玻璃实现。
- 这样调用层统一，平台差异集中在组件实现中，避免到处写零散 `Platform.isMacOS` 判断。

### 146.4 建议的技术组织方式

如果开始重构，建议先引入项目内自有设计系统层，而不是直接在业务页面里散写样式：

- `AppGlassSurface`
- `AppGlassPanel`
- `AppGlassButton`
- `AppGlassIconButton`
- `AppGlassToolbar`
- `AppReaderShell`
- `AppSidebarSurface`

这些名字只是建议，实际命名应服从代码库现有结构。

目标：

- 页面业务逻辑不直接依赖 shader 细节。
- macOS/Android 差异集中在底层组件或少量 theme/adapter。
- 后续如果从毛玻璃 fallback 迁移到真实 shader Liquid Glass，不需要大范围改业务页面。

### 146.5 工作流建议

用户询问是否可以不等 `v1.1.22` 打包完成就开始新分支。结论：

- 可以不等打包完成，因为 `v1.1.22` tag 已推送，GitHub Actions 会按 tag 独立跑。
- 不建议直接在当前 main 工作区 checkout 到大重构分支。
- 建议使用新的 worktree，保持当前目录在 `main`，方便 release 如果失败可以随时热修。

推荐命令：

```bash
git worktree add ../auto-folo-liquid-glass -b codex/macos-liquid-glass-ui main
```

原因：

- macOS UI 全面重构跨度大，容易产生多轮半成品。
- 新 worktree 可以让 main 始终保持可热修状态。
- 不需要频繁 stash/WIP commit 才能切回 main。
- 重构满意后再从分支 merge 回 main。

如果用户明确要求简单处理，也可以在当前位置 `git checkout -b codex/macos-liquid-glass-ui`，但这不是推荐方案。

### 146.6 下一位 agent 进入重构线前应先做的事

进入新 worktree 后，建议先完成以下工作，而不是马上重写页面：

1. 阅读本节和第 145 节，理解用户边界和本轮文章页目录已做的轻量 morph。
2. 检查 `reference/liquid_glass_widgets` 的 license、shader 注册、renderer/fallback 结构。
3. 盘点当前 macOS UI 结构：
   - timeline / feed list / article split view
   - article detail / toolbar / TOC overlay
   - settings
   - dialogs / menus / context actions
4. 提出 macOS-first 的重构计划，明确哪些组件先抽象，哪些页面先改。
5. 单独评估是否要迁移 shader 级实现，还是先构建自有组件 API + 毛玻璃 fallback。
6. 如果迁移 MIT 代码，必须确认许可、归属说明、shader 路径、pubspec 注册和打包影响。

### 146.7 不要遗漏的风险点

- Android 性能不要被 macOS 液态玻璃牵连。
- 不要重新引入文章滚动条/顶部进度条抖动。
- 不要破坏 macOS 文章页键盘焦点：左右键、上下键、M 键、Esc 之前多次修复过。
- 不要让图片 hover 再次造成正文布局移动；之前已通过 `AnimatedScale` + 覆盖层边框修复。
- 不要让目录展开/收起重新出现按钮闪位移。
- 不要让目录点击跳转重新绑定到 heading card 外壳；应保持绑定标题内容本身。
- 不要把参考工程目录作为隐式依赖。
- 大范围 UI 重构前后都应跑 `flutter analyze --no-pub --no-fatal-infos lib test`。

## 147. macOS Liquid Glass 重构分支阶段记录（2026-06-26）

### 147.1 分支状态与发布边界

当前工作发生在 `codex/liquid-glass` 分支，不是 `main`。本轮目标是开始 macOS Liquid Glass 风格迁移与技术基建验证；用户明确要求暂时不要 tag、不要 release。

当前状态：

- 已经开始把 `reference/liquid_glass_widgets` 的实现按自包含方式迁入本仓库。
- `reference/` 仍然只是本机参考目录，不作为 git 依赖、不作为 submodule、不要求其他 clone 存在。
- 迁入代码放在 `lib/common/liquid_glass/`，shader 放在 `shaders/liquid_glass/`，并在 `pubspec.yaml` 中注册。
- 新增封装层 `lib/common/widgets/app_glass.dart`，业务页面应优先依赖这个封装层，而不是直接散用底层 renderer/shader 细节。
- 新增 `lib/common/widgets/continuous_rectangle.dart`，用于统一连续圆角/superellipse 路径。

注意：这不是完整的 macOS 全界面重构完成态。本轮主要落地了 macOS 主窗口外框、左侧侧边栏和基础 glass surface；设置页、文章页、列表卡片、弹窗、工具栏等还没有全面迁移到统一 Liquid Glass 设计系统。

### 147.2 为什么这次改为“完整引入参考实现的子集”

此前第 146 节建议先建立封装层，再决定是否迁移 shader 级实现。随后用户进一步明确：

- 希望最终效果对标参考工程，不希望做一个注定返工的半成品。
- 参考工程只作为参考，不作为外部依赖。
- 如果引入，就必须复制必要源码、shader、许可说明，让本仓库 clone 到任何地方都能直接构建。
- 用户后续随时可以重新把参考工程复制到 `reference/`，但仓库本身不能依赖该目录。

因此本轮从参考工程中迁入自包含的 Liquid Glass 子集，包括 renderer、shared widgets、theme/types/utils 和 shader。迁入后仍通过 `AppGlassSurface` 等项目内封装使用，避免业务页面直接绑定参考工程 API。

### 147.3 目前新增的基础组件

新增 `lib/common/widgets/app_glass.dart`：

- `AppGlassSurface`
  - macOS 默认使用项目内 Liquid Glass / native backdrop 路径。
  - 非 macOS 走轻量 fallback，避免 Android 被 macOS 玻璃重构牵连。
  - `nativeBackdrop: true` 用于 macOS 侧边栏这类需要透出系统后方内容的 surface。
- `AppGlassPanel`
- `AppGlassIconButton`
- `AppGlassTone`

新增 `lib/common/widgets/continuous_rectangle.dart`：

- `continuousRectanglePath(Rect rect, double radius)`
- `ContinuousRectangleClipper`
- `ContinuousRectangleClip`

用途：

- 避免标准 `RRect` 在圆角进入直边处出现视觉上的曲率突变。
- 统一全应用外框、侧边栏面板、侧边栏背景挖空、高光 painter 和阴影 painter 的路径。
- 当前实现基于 Flutter `RoundedSuperellipseBorder`，比随手手写贝塞尔更稳定、更接近 Apple continuous corner。

### 147.4 macOS 主窗口外框与侧边栏改动

涉及文件：

- `lib/pages/main/main_page.dart`
- `lib/pages/main/widgets/macos_sidebar.dart`
- `lib/common/widgets/app_glass.dart`
- `lib/common/widgets/continuous_rectangle.dart`
- `macos/Runner/MainFlutterWindow.swift`

主窗口：

- `main_page.dart` 中 macOS 根布局从普通 `Row` 改为包在 `ContinuousRectangleClip` 内。
- 当前 Flutter 内容外框半径为 `_macOSWindowContentRadius = 28.0`。
- 原 `VerticalDivider` 移除，左侧侧边栏改为悬浮 glass panel，右侧内容区继续使用 `colorScheme.surface`。

侧边栏：

- 展开宽度：`290.0`
- 折叠宽度：`80.0`
- 面板 inset：`EdgeInsets.fromLTRB(8, 8, 8, 8)`
- 面板半径：`20.0`
- 外框半径 28 与 inset 8 + 面板半径 20 对齐，目的是让左上角圆心关系更自然。
- `_MacOSSidebarSlotPainter` 负责在侧边栏 slot 中绘制普通背景，并用 continuous path 挖掉面板区域；这样只有侧边栏内部半透明，面板外圈与右侧内容保持同一材质。
- `_MacOSGlassPane` 使用 `AppGlassSurface(nativeBackdrop: true)`。

用户对视觉结果的关键反馈：

- 最初侧边栏变化不明显，只是略发白。
- 用户希望侧边栏成为四角圆角的悬浮面板，而不是贴边整栏。
- 用户明确不需要右侧内容延伸到侧边栏下方。
- 用户希望“左侧只有侧边栏内部半透明，周围那一圈和右侧是同一个材质”。
- 用户认为后续可继续处理背景，但本轮先聚焦侧边栏和窗口壳。

### 147.5 红绿灯按钮处理过程与当前方案

用户希望 macOS 红黄绿窗口按钮位于侧边栏框内，并且视觉上贴合窗口/侧边栏圆角。曾尝试直接移动系统 `standardWindowButton`，但 AppKit 会在窗口生命周期中反复重排，出现以下问题：

- 应用刚打开时按钮在内部，随后跳到边缘，再跳到“全部文章”附近，最后又回到边缘。
- 点击区域和视觉位置不一致，有时按钮外能点，有时按钮内没反应。
- 即使多次重新定位，系统仍会覆盖位置。

当前方案：

- 在 `MainFlutterWindow.swift` 中隐藏系统标准按钮。
- 自绘三个 `NSControl`：close / minimize / zoom。
- 按钮颜色、hover 符号、pressed 状态均由 `TrafficLightButton` 绘制。
- 点击行为仍调用原生窗口方法：
  - close: `performClose(nil)`
  - minimize: `miniaturize(nil)`
  - zoom: `zoom(nil)`
- 当前 metric：
  - `windowRadius = 28`
  - `trafficLightCenterX = 28`
  - `trafficLightCenterYFromTop = 28`
  - `trafficLightDiameter = 14`
  - `trafficLightCenterSpacing = 23`

用户验证：

- 自绘后红绿灯点击范围和显示位置已经一致。
- 后续只做 metric 调整，不再回到直接移动系统按钮的方案，除非重新设计原生窗口标题栏。

### 147.6 高光、边框与 continuous corner 的讨论结果

高光尝试过程：

1. 先做了白色高光。
2. 用户希望边框不要直接定义为白色，而是跟随背景变化。
3. 尝试从背景派生提亮色。
4. 又尝试混入主题 `primary/tertiary`，但用户指出这不符合预期：他要的是背景颜色基础上的提亮毛玻璃，不应包含主题色。
5. 改成背景同色系局部提亮后，用户仍觉得效果不理想。
6. 最终用户决定：先回到最早的白色高光。

当前结论：

- 保留白色薄高光。
- 不混入主题色。
- 不继续在颜色算法上试探。
- 如果后续继续调，优先调 stroke / alpha / radius，而不是改成彩色边框。

continuous corner：

- 用户指出“全应用 + 侧边”两个边框的曲线不理想，圆角到直边处有曲率突变。
- 已确认用户说的两个边框是：
  1. 全应用外框。
  2. 左侧侧边栏边框。
- 当前已将两者的 Flutter 可见路径改为 continuous/superellipse：
  - 全应用外框：`ContinuousRectangleClip`
  - 侧边栏背景挖空：`continuousRectanglePath`
  - 侧边栏玻璃裁剪：`ContinuousRectangleClip`
  - 侧边栏高光：`continuousRectanglePath`
  - 侧边栏阴影：`continuousRectanglePath`
- 用户验证后反馈“似乎得到了改善，先就这样”。

注意：

- macOS 原生 `NSVisualEffectView.layer.cornerRadius` 仍是系统 layer 圆角，不是 Flutter continuous path。
- 当前用户主要验证的是 Flutter 内部可见外框和侧边栏轮廓。
- 如果未来要连原生窗口最外层也完全 continuous，需要单独研究自定义 window mask，不应混在普通 Flutter UI 调整中。

### 147.7 参考工程与许可/自包含要求

迁入参考工程子集时必须保持：

- `lib/common/liquid_glass/ATTRIBUTION.md`

- `pubspec.yaml` 中注册所有使用的 shader：

  - `shaders/liquid_glass/interactive_indicator.frag`
  - `shaders/liquid_glass/liquid_glass_geometry_blended.frag`
  - `shaders/liquid_glass/liquid_glass_final_render.frag`

新增依赖：

- `equatable`
- `flutter_shaders`
- `logging`
- `meta`

如果后续裁剪、重命名或移动这些文件，需要同步检查 imports、shader asset path、license attribution 和 `pubspec.lock`。

### 147.11 侧边栏真实背景取色边框实验结论（2026-06-27）

用户希望侧边栏边缘高光尽量来自窗口背后的真实内容：背景是黑色时仍然要有明显光照，背景有颜色时边缘应明亮、鲜艳但不过曝。讨论中曾推导出一个目标映射：**背景只提供 hue / saturation，输出亮度固定接近 0.9**。

已尝试的原生实现路线：

- 在 `MainFlutterWindow.swift` 中给侧边栏边缘单独叠加 `NSVisualEffectView` ring。
- 该 ring 使用 `blendingMode = .behindWindow` 和系统 material，以便让边框本身也是原生背后窗口材质。
- 进一步尝试在 ring 的 layer 上挂 `CIColorCube` / `backgroundFilters`，把采样到的背景色重映射为固定高亮度的边缘颜色。

用户验证结果：该 `backgroundFilters` 映射**完全没有可见效果**。这说明当前 AppKit 路线下，`NSVisualEffectView` 的系统毛玻璃确实由 macOS compositor 处理窗口背后的内容，但我们挂在 view layer 上的 Core Image filter 不会作用到那批真实背后像素。换句话说，中间的毛玻璃可见，并不等于 Flutter 或普通 `CALayer` 能读取、重映射、再绘制窗口背后的真实内容。

因此本轮已移除无效的 `CIColorCube` 代码，避免仓库保留“看起来能取色、实际不起作用”的实现。

随后用户确认：真实背景驱动边缘高光这条路线先放弃，恢复成稳定的白色版实现。当前代码状态：

- `MainFlutterWindow.swift` 不再保留侧边栏专用 `NSVisualEffectView` ring。
- `main_controller.dart` 不再通过 `MethodChannel` 同步侧边栏折叠状态给原生层。
- `app_glass.dart` 的 `nativeBackdrop` surface 回到 Flutter 侧白色 overlay 高光；主体毛玻璃仍来自 macOS 窗口底层 `NSVisualEffectView`。

后续不要重复尝试：

- 不要继续调 `CIColorControls`、`CIVibrance`、`CIToneCurve`、`CIColorCube` 等挂在 `NSVisualEffectView.layer.backgroundFilters` 上的参数；这条路已经被实测排除。
- 不要把这类 filter 当作真实桌面背景取色方案。

可继续讨论的真实取色方案只有更重的原生路线：

- ScreenCaptureKit / 原生截图采样窗口背后像素，再绘制自定义边框；缺点是权限、性能、隐私提示和窗口遮挡处理都更复杂。
- 自定义 Metal / Core Image compositor；工程量明显大于当前侧边栏视觉调参。
- 当前采用的折中方案：保留系统 `NSVisualEffectView` 负责真实毛玻璃，边缘高光用项目内可控白色 specular painter 作为最低可见度保障。这不是严格真实背景取色，但稳定、轻量、不会引入权限问题。

  - `t == 0` 和 `t == 0.24` 都严格归零。
  - 形态是 `-sin(u * pi) * 0.032`，不会产生目标点后的二次动画。
- `morphT` 在收起方向允许最低到 `-0.014`，对应一个很小的“略小于按钮尺寸”视觉回摆。
- 仍保留 `hasHandedOff` 后强制 `effectiveValue = 0.0` 的保护，因此 `GlassMorphController.close()` 内部过零后的正向回弹仍不会影响目录尺寸。

背景：

  - `PointerScrollEvent.scrollDelta` 底层拦截可以限制手指仍在触控板上的即时 delta，但侵入性高，容易影响嵌套滚动、滚动条、选择文本、可访问性和平台手感。
  - `ScrollPhysics.maxFlingVelocity` 是 Flutter 提供的较干净入口，只限制松手后的 fling / ballistic 惯性速度，不拦截手仍在触控板上的直接滚动 delta。
- 用户后来查到 `maxFlingVelocity` / `kMaxFlingVelocity`，确认希望先用官方入口做轻量尝试。

  - 后续依次试过 `2800`、`3400`、`4500`，用户确认 `4500` 基本符合预期。
  - 用户进一步要求 macOS 内所有地方都应用该改动，并希望做成设置项，避免硬编码且适应不同用户习惯。

- `lib/common/widgets/no_overscroll_indicator_behavior.dart`
  - 在既有 `NoOverscrollIndicatorBehavior` 上扩展，而不是另起全局滚动系统。
  - 新增 `CappedMacosFlingPhysics`，覆盖：
    - `maxFlingVelocity`
    - `createBallisticSimulation`
    - `carriedMomentum`
  - 只在 `Platform.isMacOS` 时叠加 fling 上限；Android 和其他平台保持原状。
  - 当前只限制松手后的 fling / ballistic 速度，不拦截 `PointerScrollEvent.scrollDelta`。

- `lib/main.dart`
  - `GetMaterialApp.scrollBehavior` 接入 `NoOverscrollIndicatorBehavior`，覆盖大多数没有显式 `physics` 的滚动区域。
  - 在 app builder 内监听 `StorageKeys.macosMaxFlingVelocity`，并用新的 `ScrollConfiguration` 包裹子树，使保存设置后不必重启应用；新发生的滚动/惯性会使用新值。

  - 时间线、订阅源等下拉刷新页面使用显式 `_refreshPhysics`，会绕开全局 `ScrollBehavior`。

注意事项：

- 它只能限制松手后的惯性滚动速度/距离；手指仍在触控板上时，系统连续发送的 `PointerScrollEvent.scrollDelta` 不受该参数控制。
- 若未来继续追求“手还在触控板上也限速”，需要另做更底层的 pointer signal/scroll position 方案；这类方案复杂度和副作用明显更高，本轮刻意不做。
- 保存设置后不需要重启应用；当前已在根部监听该 Hive key。极少数正在进行中的惯性过程可能要等下一次滚动才完全体现新值。

验证：

- `dart format lib/main.dart lib/common/constants/constants.dart lib/common/widgets/no_overscroll_indicator_behavior.dart lib/common/widgets/refresh_aware_scroll_physics.dart lib/pages/settings/settings_page.dart lib/services/settings_backup_service.dart lib/pages/feed_detail/feed_detail_page.dart lib/pages/widgets/article_search_delegate.dart` 通过。
- `dart analyze lib/main.dart lib/common/constants/constants.dart lib/common/widgets/no_overscroll_indicator_behavior.dart lib/common/widgets/refresh_aware_scroll_physics.dart lib/pages/settings/settings_page.dart lib/services/settings_backup_service.dart lib/pages/feed_detail/feed_detail_page.dart lib/pages/widgets/article_search_delegate.dart` 通过。
- `git diff --check` 通过。

## 162. 软件内外观模式设置与圆角收敛调研（2026-07-07）

背景：

- 用户希望深色/浅色模式可以在软件内调整，同时保留“和系统对齐”的选项。
- 初始要求是先阅读仓库、确认理解、定位问题并讨论，不要马上修改。
- 仓库检查结论：
  - `lib/main.dart` 已经定义了 light/dark 两套 `ThemeData`。
  - 但 `GetMaterialApp.themeMode` 写死为 `ThemeMode.system`，因此此前只能跟随系统，不能由应用内部覆盖。
  - 设置页有 macOS 与移动端两套 UI；偏好配置使用 Hive `GStorage.setting`。
  - 配置导入/导出走 `SettingsBackupService` 白名单，如果新增设置 key 不进白名单，迁移配置时会丢失。
- 用户随后确认：如果能做到“一选择就立刻生效”，就按立即生效实现。

已实现：

- `lib/common/constants/constants.dart`
  - 新增 `AppConstants.defaultAppearanceMode = 'system'`。
  - 新增 `StorageKeys.appearanceMode = 'appearance_mode'`。
  - 合法存储值为：
    - `system`：跟随系统。
    - `light`：强制浅色。
    - `dark`：强制深色。
- `lib/main.dart`
  - 用 `ValueListenableBuilder` 监听 `GStorage.setting.listenable(keys: [StorageKeys.appearanceMode])`。
  - `GetMaterialApp.themeMode` 改为读取 `_currentThemeMode`，不再固定 `ThemeMode.system`。
  - 这样设置页写入 `appearance_mode` 后会立即重建 `GetMaterialApp` 并切换主题，不需要重启，也不需要点保存。
  - 原有 macOS 滚动惯性上限监听仍保留在 `builder` 内，未改变滚动行为。
- `lib/pages/settings/settings_page.dart`
  - 新增 `_appearanceMode` 状态。
  - `_loadPersistedSettings()` 读取并规范化外观模式，非法值回退到 `system`。
  - 新增 `_setAppearanceMode()`：
    - `setState` 更新设置页当前选项；
    - 立即 `GStorage.setting.put(StorageKeys.appearanceMode, normalized)`。
  - `_save()` 也会再次保存当前 `_appearanceMode`，作为与其他偏好统一的兜底。
  - macOS 设置页在“阅读与后台偏好”中新增 `_MacGlassSegmentedField<String>`：
    - `跟随系统 / 浅色 / 深色`
    - 文案提示“选择后立即生效；跟随系统会响应 macOS 外观变化”。
  - 移动端设置页新增普通 `DropdownButtonFormField<String>`，保持原移动端 Material 表单风格。
- `lib/services/settings_backup_service.dart`
  - `appearance_mode` 加入 `_fixedKeys` 与 `_stringKeys`。
  - 导入时只允许 `system/light/dark`，否则抛 `FormatException`，避免错误配置落入未知状态。

设计决策：

- 选择“写入 Hive 后由根部监听重建”的方案，而不是引入新的 GetX controller 或手动调用 `Get.changeThemeMode`。
  - 原因：项目设置项已经主要依赖 Hive；根部监听设置 key 更直接，也能保证重启后持久化一致。
- 外观模式采用字符串 `system/light/dark`，而不是数字枚举。
  - 原因：配置导出为 JSON 时更可读，也更利于后续兼容。
- macOS 端使用现有 `_MacGlassSegmentedField`。
  - 原因：三档选项紧凑、符合当前 macOS 设置页设计语言，不需要新造控件。
- 移动端暂时使用现有 Material 下拉表单。
  - 原因：移动端设置页尚未做 macOS 那种全量玻璃化重构，应保持现有风格。

需要后续验证的重点：

- 设置页切换 `跟随系统 / 浅色 / 深色` 是否立即生效，不需要保存、不需要重启。
- 切换时设置页不应退出、跳页、丢失明显状态或闪退。
- macOS 主界面重点检查：
  - 左侧侧边栏玻璃效果；
  - 中间文章列表；
  - 右侧文章详情；
  - 右上角已读/目录/刷新等按钮；
  - tooltip、弹窗、后台任务页。
- 特别验证“系统浅色但应用强制深色”和“系统深色但应用强制浅色”：
  - 大多数项目代码使用 `Theme.of(context)`，应跟随应用内设置。
  - 但 `lib/common/liquid_glass` 中仍有少量底层代码直接读 `MediaQuery.platformBrightnessOf(context)` 或 `CupertinoTheme.brightnessOf(context)`；如果发现玻璃高光/材质仍跟随系统而不是跟随应用主题，后续应专门修这些底层读取点。
- Android 也要验证设置项存在、切换立即生效、返回时间线和文章详情后颜色一致。
- 配置导出 JSON 应包含类似：

```json
"appearance_mode": "system"
```

或 `light/dark`；导入后外观模式应恢复。

验证：

尚未实施但已讨论的圆角收敛：

- 用户进一步提出“整个软件稍稍将圆角半径变小一点”，要求先扫描工程并查 macOS 官方是否有圆角参数推荐。
- 已扫描工程中显式圆角：
  - 大面板/窗口层级集中在 `28 / 20 / 18 / 16`。
  - 小控件/内容裁剪集中在 `12 / 10 / 8 / 6 / 4`。

- 建议后续如果要做圆角收敛，优先改 macOS 主视觉层级，不要盲目全局等比例缩放：
  - 强烈建议联动：

    - `AppGlassSurface` 默认 `18` 与 `AppGlassPanel` 默认 `20`。
    - 设置页和后台任务页里大量 `AppGlassSurface(borderRadius: 20)`。
  - 可以考虑的方向：
    - 外框 `28 -> 24`。
