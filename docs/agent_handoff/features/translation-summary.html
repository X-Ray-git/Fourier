## 2026-10-02 最终决定：过滤与摘要维持现状

用户在核对真实前缀缓存实验和一周费用后明确决定“先维持不动”。本轮讨论的取消过滤前500字符截断、统一过滤/摘要模型配置面板、正文共同前缀与任务后缀、按文章合并调度/缓存间隔、单次联合输出过滤＋摘要，以及翻译请求前缀调整，均暂不实施。当前过滤仍采用清理正文前500字符，摘要采用当前可用完整清理HTML；现有独立配置、队列、Prompt及文本/必要时视觉复核沿用已有实现。

此前方案与实验保留为评估证据，不是实施授权：相同模式下公共正文前缀可命中，但扩大过滤输入和失去跨文章长规则缓存未必净省钱；联合请求的思考输出节省未经验证。按现价统一非高峰重算的一周基线约3.71美元，按1美元=7元仅作量级换算约26元；避免重复输入的可能收益约每周一元量级，不作为确定费用下降承诺。以后如重新考虑，应由用户明确恢复这一改造，再核对新的输入输出与需求。

本轮仅有忽略目录中的只读统计/授权实验脚本及结果，以及文档记录；没有修改过滤、摘要、翻译或调度业务代码、Prompt、用户配置、文章状态或关系数据库。此前白屏诊断源码改动另属已约定的下次更新内容，不因本决定回退或扩大。未提交、推送或发布本轮文档。


## 2026-10-02 优先评估过滤＋摘要联合请求（设计建议，未实施）

用户提出“优先缓存过滤规则还是文章”及“一次模型输出过滤结果＋摘要”。基于现有费用与工作流，当前建议优先保留跨文章静态规则前缀，并把自动过滤＋摘要合并为一次正文理解/一次JSON响应，取代两份全文请求加缓存间隔作为主要设计方向。两份业务Prompt仍可分别编辑，程序协议合并输出字段；规则稳定放在正文前，文章放后面，每篇首次输入共用长规则缓存，不再只依赖每篇最多两次的正文复用。此前同文章完成后4秒延迟方案仅是两请求继续存在时的候选，联合请求无需此间隔。

9/25～10/2用量窗口中按articleId选每项最新success：1731篇同时有过滤和摘要，5篇只过滤、1篇只摘要。此配对只说明该窗口共同完成是主流，不证明所有任务必然同时需要运行。两项原输出（包含思考）合计中位750token、P90=2279、P95=3310、P99=6032；不能将联合结果的预算直接沿用单项2048并声称必定足够，也不能把此分布当成联合请求未来输出分布。联合可能减少重复理解和部分思考，但实际节省需A/B，输出和思考不会因请求数减半自动减半。

联合调度按文章执行，本轮此前提出共用设置也更自然。保留任务需求掩码：两项缺失时联合；只有一项缺失或手动重做一项时只执行该项，避免覆盖人工过滤状态/旧摘要。过滤被拒仍生成摘要供审核；生成的摘要应忠实正文，不因过滤结论刻意贬低或美化。保存结果继续分流到现有过滤字段/摘要记录，独立验证、账号与已读/人工审核保护，不新增一套替代数据库。摘要保存后仍接现有关系入队。

现有文本/必要时视觉复核继续复用总体流程，联合请求可以同时产出两项结果而不为同图分别复核；具体内部协议随实现调整，本轮不额外设计图片缓存。单次失败可能影响两项，需要保留已有效落盘结果、只补缺失任务，避免把整个文章不断重跑。未来实验应对照当前500字符过滤＋全文摘要、两份全文请求缓存、单次联合全文请求，比较判断差异、摘要完整性、合计输入输出/思考与重试费用。尚未获实施指令，本轮只讨论并记录，不改代码/Prompt/配置/数据库，不发额外API请求。


## 2026-10-02 缓存改造的总费用评估：不能按命中率预测省钱

用户询问预计总价格下降幅度。只读复制 llmUsageEvents 和 setting 到临时目录，导出请求级用量字段及Prompt字符数；没有读取key、没有调用API或修改数据库。账本29222条，历史范围8/8～10/2；分析9/25～10/2 11:27的5153条有usage请求。所有模型均为Flash或已由官方映射为Flash的旧别名，统一按当前Flash非高峰价重算用于方案比较，不是账户实际账单，历史峰谷/价格差异未逐次还原。实验脚本的23次请求另存，不计入此应用基线。

| 任务 | 输入费用 USD | 输出费用 USD | 合计 USD |
|---|---:|---:|---:|
| 过滤 | 0.15510 | 1.13737 | 1.29247 |
| 摘要 | 0.71347 | 0.42536 | 1.13883 |
| 翻译 | 0.15373 | 0.54254 | 0.69627 |
| 关系 | 0.10176 | 0.48521 | 0.58697 |
| 合计 | 1.12405 | 2.59049 | 3.71454 |

输出含reasoning，不能再把reasoning重复加价；输出占69.74%，过滤输入仅占整体4.18%。过滤既有输入命中2694395token、未命中980102token，命中率约73.3%；当前自定义过滤规则2394字符，其稳定前缀已有跨文章复用。9/29后的独立窗口输出占比仍约69.9%，方向一致。

重要修正：本文前面的93%～94%缓存实验比较的是两个同样携带全文的请求，而实际基线是过滤前500字符+摘要全文。改造后仍要支付一份全文的冷输入，再付第二份全文的缓存输入，不能把“摘要全文省了”算进去同时忽略“过滤全文新增了”。所有任务指令移到文章后面还可能丢失旧的跨文章长规则前缀缓存，尤其当前过滤规则较长。

用于说明量级的理想化比较：把当前过滤全部未命中输入改为命中、其余完全不变，节省约0.14407USD，仅占整体3.88%；尚未计扩大全文和规则前缀失去缓存的成本。此数不是所有优化的数学上限，也不是本方案预测值。敏感性比较若过滤/摘要现有全部命中输入都变为未命中，并抵扣上述理想节省，整体反而增加约9.40%；并非所有现有命中都来自固定规则，因此这只是风险量级，不是预测会增加9.4%。输入长度增加后思考输出数量/失败重试也可能改变，目前未做实际完整业务质量与费用A/B。

结论：现有证据不支持宣称总费用显著下降，也没有可信的净下降百分比；预算应先按接近持平考虑，并允许小幅增加。取消过滤500字截断的主要确定收益是完整判断依据，统一调度/前缀可避免两份全文都冷计费，但不是相对于旧截断方案必然净省钱。若首要目标成本，应在实现前考虑同时保留跨文章固定规则缓存，而非把长规则一律放到文章后面。当前仍仅评估，不改业务代码或配置。

汇总与敏感性数据在忽略目录scratch/prefix-cache-20261002/cost-baseline.json、cost-estimate.json。价格来源：[DeepSeek官方](https://api-docs.deepseek.com/quick_start/pricing/?tab=case-studies)。


## 2026-10-02 过滤与摘要调度设计讨论（尚未实施）

用户明确无需另行设计文本/视觉交付，当前讨论焦点是同一文章两个任务的缓存时序。当前独立Worker立即补位，存在同文并行冷请求。建议统一调度并以文章记录待办的过滤/摘要任务，各任务处理服务、Prompt、结果和失败仍分开；任务标记仅为运行时计划，持久结果复用现有文章过滤字段与摘要记录，不新增两份数据库完成布尔值。

同文章/同正文版本/同模型思考模式，同一时刻仅一项执行，首次未发时由调度器原子认领，通常过滤优先；只有一项需要运行则立即可执行。第一项完成后设置后续最早发射时间，基于本轮已验证串行完成后4秒先用4秒作为初值，而不是首个请求发出后固定5秒。4秒是有效测试点，不是最优或供应商保证；可在后续用量里校验。第二项已自然排队超过该时间就无需再额外sleep，等待不占处理名额、不挡其他文章，不每篇新建永久定时器。首项失败不因缺失成功标记让另一任务永久等待，账户切换清掉旧运行计划；各项失败/已完成状态继续独立。过滤拒绝不额外取消目前会生成的摘要。

合并队列时应明确并发为两任务合计请求容量；不能把当前各32未经说明改成总32。手动请求应沿用统一的同文互斥/去重入口，但额外缓存等待可优先让用户操作，避免为节省输入费无条件延迟交互。原有视觉流程不在此重新拆分，图片缓存有效性没有被本轮文本实验验证。本节是候选方案与待确认边界，未修改代码或设置。


## 2026-10-02 取消过滤前500字截断的评估

用户澄清“不需要阶段”指取消正文截断，保留文本判断/必要时视觉复核。只读正式 articleDb 的临时副本，使用应用实际 normalizeHtml（同摘要核心清理函数）统计5000篇；4997篇非空、3篇空正文、0次清理异常。清理后HTML字符数：P50=1187、P90=20784、P95=34430、P99=86165、最大288741；纯文本对应P50=546、P95=9079、最大186551。HTML超过100000字符36篇，超过500000字符0篇。本轮未读取key、未发API请求，只保存汇总数字，样本均为现有缓存文章，当前过滤可入队数0，不能据此证明未来所有来源规模或实际分类效果。

结论：赞成过滤与摘要共用当前可用完整清理HTML及元信息，取消固定500字符截断。全文能避免把引言/广告当成整篇、漏掉后文实质信息；HTML结构保留利于识别正文、表格、链接及图片分布。同一正文仍需明确作为数据，与任务指令分隔。清理不代表全文抓取成功，来源本身截断时不要把短正文自动等同低质量。

成本与实现配套：缓存命中仍低价计费，首个全文请求/并发冷请求仍有输入费用，不能称正文免费。自动Readability完成后当前同时开启过滤与自动摘要/翻译，实验串行4秒间隔不能证明并行也能复用；后续实现应验证真实命中率并评估同文章调度时序。全文会扩大过滤输入并可能增加思考输出，过滤当前120秒timeout比摘要300秒短，应随长文运行重新评估有界超时/失败重试；证据不足继续保留文章，不通过随意截断制造拒绝依据。

本轮只做评估，未修改业务代码、配置、Prompt、数据库或任务结果。设置合并与共享请求格式待用户批准实施；保留各任务Prompt与视觉交付流程，不把澄清理解为授权取消视觉阶段。

承接用户关于“是否为个例”的追问，在原公开样本上进行三轮对照，每轮更换最前端实验标识，以隔离不同轮次旧缓存。每轮消息完全一致（记录 messagesDigest 并核对每轮唯一），请求体只改变 thinking.type；两种模式都不传 reasoning_effort，其他模型、消息、温度、JSON格式、max_tokens=256不变。第一/三轮从 enabled 开始，第二轮从 disabled 开始，避免只验证一个切换方向。串行请求完成后等待4秒，API key沿用临时副本读取、内存使用、无密钥输出流程，不更改用户设置或正式Hive。

结论：在当前deepseek-flash、账号、约3300token文本样本与短间隔条件下，跨模式首请求不命中可以重复复现（3/3），同模式重复和切回已预热模式全部命中3072（9/9）。准确表述为“两种模式需各自预热，可分别保留缓存”，不是“每次切换都会失去缓存”。本轮为缓存探针，只要求返回ok=true，不评估正文理解质量；结果不可推广为所有模型/所有时间间隔永久规则。

结论：同一模式下，文章相同、任务不同的后缀请求真实命中3072token。第二次已命中，说明长公共前缀不必等待第三次才一定有效；官方文档仍只给出尽力缓存保证，不能把本轮顺序结果推广为所有输入长度和并发都命中。更改最前端标识后降为0，支持命中依赖完整公共前缀。完全重复摘要与换任务摘要命中数相同，说明命中不依赖复用上一任务的答案。

从思考开启切为关闭的第一条标题翻译请求命中0；关闭模式下后续摘要/新关键词任务又命中3072。故本轮不能把“相同模型、正文相同”视为跨思考模式可复用；落地应保留各任务用户配置，按模型/思考模式区分统计，不能只为缓存强行开启翻译思考。这里是实测现象，未证明供应商内部缓存隔离实现。

8次共26190输入token（命中15360、未命中10830），输出1040token。按当天官方Flash非高峰价格估算约$0.00229458，非账户余额扣款核验；全未命中的同token对照估算约$0.00455250。费用示例仅针对本轮脚本（含冷启动和负对照），不是生产费用降幅预测。摘要第2次因512输出上限思考截断，完全重复第4次正常结束；其余7次完成且返回合法JSON。截断不妨碍读取缓存计数，但此实验没有评估摘要/过滤/全文翻译质量。

限制：只测试公开文本、一个约3300token输入样本和顺序请求，未测试同时并发、不同模型、图片缓存、长文翻译分块或更长时间间隔。标题翻译是短输出探针，不是整篇翻译。统一全文将增加过滤首请求输入，是否净省钱还需生产用量评估。本轮未调用应用LLM账本写入链路，8次请求用量保存在独立实验结果；会计入同一个DeepSeek账号费用。

原始无密钥指标与临时脚本保存在忽略目录 scratch/prefix-cache-20261002/results.json 和 experiment.dart，真实内容不提交。业务代码/Prompt/数据库/设置本轮不改，未提交推送发布。实现讨论可先统一过滤与摘要的正文、元信息及公共system，把任务规则放末尾；翻译可统一消息构建，但沿用现有思考设置和长文分块。

自动任务只在入队时检查文章的最新已读状态。已经是已读的文章不进入自动翻译和摘要队列；以未读状态入队后，后续即使标记为已读也不追踪取消，任务照常完成。这是经长期使用后确认的取舍：旧取消机制只能命中尚未被高并发 Worker 取入批次的少量任务，收益不足以支撑额外状态分支。手动翻译/摘要和垃圾拦截判定均不受影响。

新正文可用后的自动 AI 流转由 `AutoAiQueueCoordinator.onArticleContentAvailable()` 统一负责。后台 Readability、文章详情页直接补抓全文和 Inbox 详情补正文都必须在成功持久化正文后调用该入口；入口读取数据库中的最新已读状态，只给当时仍未读的文章排摘要，并按订阅源自动翻译开关排翻译。不要让详情页只更新显示和数据库而遗漏 AI 队列，也不要在 `setReadState()` 中重新加入队列取消副作用。

刷新后入队的 `ArticleModel` 可能仍是上游 RSS 短摘要，即使 `LocalArticleDbService.upsertMany()` 已在数据库中保住先前抓取的全文。`AutoReadabilityWorker` 开始处理时必须调用 `preferPersistedContent()`，让过滤、摘要和翻译看到同一份更完整正文。否则一次长文分块翻译失败后，后续刷新可能用一句话短摘要生成合法的完成态译文，并永久阻止自动重译。

## 确定性 Provider 拒绝

- `LlmFailurePolicy` 集中解析 DeepSeek 的结构化错误。当前已确认 `HTTP 400 / Content Exists Risk` 属于相同请求不经修改便无法恢复的内容安全拒绝，不应当与超时、断网或服务端临时故障使用同一重试策略。
- 摘要、翻译（含长文章分块翻译）和质量过滤遇到该错误时只请求一次；摘要与翻译保存错误态并显示“DeepSeek 内容安全检查拒绝处理此文章”，不得通过删词、改写正文或隐藏来源来绕过 Provider 检查。
- `LlmAutoRetryBlockService` 按“任务类型 + 文章 ID”将阻断状态存入账号级 `localCache`。三个自动 Worker 在入队前统一检查，因此后续启动或刷新不会反复消耗请求；切换账号时随派生数据清除，不进入设置配置备份。
- 用户从正文、右键菜单或任务中心明确触发摘要/翻译时视为手动重试，先解除对应阻断，再按当前正文和配置发起新请求。普通网络错误仍沿用原有有限重试。
- 如果纯文本摘要已经成功、只有可选的视觉复核被内容安全检查拒绝，则保留纯文本摘要，不把整篇文章标为失败；质量过滤的视觉阶段同样继续保守保留文章。

## 翻译 JSON 的有限恢复

- 2026-09-12 的真实用量账本与受控请求确认：DeepSeek V4.1 Flash 即使收到 `response_format: json_object`，仍可能在 `translated_html` 字符串内输出未经 JSON 转义的真实换行，或把百分号写成非法的 `\%` 转义。接口会返回 HTTP 200、`finish_reason: stop` 和完整可读译文，但严格 `jsonDecode` 会失败；少数文章因此被自动 Worker 反复重试。
- 翻译服务仍以严格 JSON 解析为首选。只有严格解析失败时，才对 JSON **字符串内部**的裸控制字符和非标准反斜杠转义做一次字符级修复，然后重新执行完整 JSON 解析。修复不能补齐缺失引号、大括号或截断内容，最终结果仍必须是对象且包含非空 `translated_html`。
- 普通翻译与长文分块翻译共用同一解析入口。回归测试必须同时覆盖 HTML 属性中的合法 `\"`、裸换行、非法 `\%`，并确认真正截断的响应仍进入错误态。不要把该恢复扩展成任意 HTML 猜测或宽松字符串拼接，否则会掩盖真实截断与 Provider 协议变化。

相关服务：

- `lib/services/translation_service.dart`
- `lib/services/summary_service.dart`
- `lib/services/llm_config.dart`
- `lib/services/article_relation_service.dart`
- `lib/services/article_relation_worker.dart`

存储：

- 翻译记录在 `GStorage.translations`。
- 摘要记录在 `GStorage.summaries`。
- 摘要启用后产生的关系节点/组在 `GStorage.articleRelations`，批次与 token/cache 统计在 `GStorage.relationBatches`。

LLM 默认取向：

- 翻译：`deepseek-flash`、不思考、默认并发 32、低 temperature、大输出。
- 摘要：`deepseek-flash`、thinking max、默认并发 32、紧凑输出。
- 过滤：`deepseek-flash`、thinking max、默认并发 32；仓库默认只做保守、通用的内容质量审核，不表达特定用户的主题或来源偏好。用户保存/导入的自定义过滤 Prompt 优先于默认值。
- 关系判断：`deepseek-flash`、thinking max、每批最多 128 篇新摘要，网络请求固定单飞。这里的 128 是批大小而不是并发数；历史阈值为 2048，超限时从队首固定淘汰 1024 篇。

## 摘要与质量过滤的多模态转交

- 摘要和质量过滤都先调用各自现有的纯文本模型。纯文本阶段通过程序内置字段 `needs_visual_context` 判断：只有正文文字不足以可靠完成任务、且正文图片很可能承载缺失的实质信息时，才转交各自配置的视觉模型。普通配图不会仅因存在而触发第二次请求。
- DeepSeek V4.1 Flash 的规范 API 模型 ID 为 `deepseek-flash`，同时支持文本与视觉输入。摘要与质量过滤仍分别保存视觉模型选择，设置页沿用既有模型选择控件；当前视觉白名单只有 `deepseek-flash`，后续扩充白名单即可直接增加选项。该选择进入设置导入导出，旧备份缺少配置时回落默认模型，不受支持的导入值会被拒绝。
- 原生多模态模型不等于所有请求都应传图。现有“纯文本先行、按协议转交视觉”的两阶段策略继续保留，避免普通文章承担图片下载、Base64 编码、请求体积和视觉推理开销；文本阶段与视觉阶段可以使用同一个 `deepseek-flash` 模型 ID，但仍是用途和账本记录明确分开的两次请求。
- 旧配置中的精确别名 `deepseek-v4-flash`、`deepseek-v4-flash-vision-exp` 会在启动、读取、保存和设置导入导出边界迁移为 `deepseek-flash`。只迁移这两个已知别名，不改写用户自定义模型 ID；已有 Prompt、并发、thinking、temperature 和 token 上限不受影响。
- 两项任务共用 `ArticleVisualContextService` 的图片规则：从已经按文章来源规范化的正文提取图片，保持正文顺序、去重、排除 SVG，每次最多提供前 8 张可用位图。它们只共用图片上下文，不合并 Worker、Prompt、模型参数或任务结果。
- 图片交付方式统一为本地文件 Base64：仅在需要视觉复核时调用 `ArticleImageCacheService.getImageFile()`，复用 macOS/Android 的按文章缓存，缺失时沿用已有下载与请求头；不再要求 DeepSeek 服务端自行下载原始图片 URL。按文件签名识别 JPEG/PNG/GIF/WebP，不以扩展名猜测格式，不缩放或改变图片质量，`detail: original` 保持不变。编码放到后台 isolate，同一任务重试复用已准备好的数据。
- 传图保护：最多 8 张，单张最多 8 MiB、原始文件合计最多 24 MiB（Base64 约 32 MiB，留出请求体空间）。空文件、HTML 错误页、未支持的格式或超限都进入原有失败/降级路径，不静默删掉部分图片来改变判断依据。这是每项任务的上限，不是全局内存上限；Worker 并发与缓存生命周期本轮不调整。
- 用户可编辑 Prompt 只负责摘要表达或过滤标准。响应 JSON 与转交条件由版本化的 `LlmMultimodalProtocol` 控制，在设置页以只读文本显示，并展示当前任务实际选择的视觉模型；协议本身不进入配置导入导出，用户已保存或导入的旧 Prompt 仍然优先使用。
- 为兼容旧 Prompt，正文存在图片但纯文本响应缺少 `needs_visual_context` 时，程序保守执行一次视觉复核。视觉请求最终失败时，摘要保留纯文本阶段的尽力结果；质量过滤保守判定为保留，不能因图片暂时不可访问而误删文章。
- 文本和视觉请求分别写入现有 LLM 用量账本，便于区分模型、token、缓存与失败情况；账本沿用既有隐私边界，不把用户私有 Prompt 内容写入本专题文档。

### 2026-09-03 图片下载失败修复边界

- 实际故障不是视觉模型没有读图能力：本地请求图片成功，但 DeepSeek 返回 HTTP 400，错误指向 `messages[1].image[0]` 的图片下载失败。旧账本只保留 Dio 的通用 400 描述，因此难以区分下载失败、格式错误或模型参数错误。远端返回的错误有时是 `application/octet-stream` 中的 JSON，不能仅处理已经解码的 Map。
- `LlmUsageLedger` 现兼容 Map、受限长度 JSON 字符串与字节响应，只选取 `error.type/code/message`；移除请求 Authorization 凭据、URL 路径/查询参数、Base64 图片及引号包裹的输入片段，截断到 500 字符。未知/非 JSON 错误回落原通用描述，不保存整份响应。
- 本轮只修复传图与错误诊断，不调整纯文本转交协议、用户 Prompt、文本重试次数或最终降级规则。此前视觉失败后已保存为 `done` 的尽力摘要仍会被认为已完成，不自动追溯或批量重跑；想验证旧文章应手动重新生成摘要。不要把新传图成功误解成历史降级结果会自动修复。
- 使用隔离数据库与真实 API 验证单图、双图的摘要和过滤链路，结果与 token 预算见 [验证记录](../status/verification.html) 中的“2026-09-03 多模态本地传图与错误诊断”。真实测试配置与私有 Prompt 不进入仓库，也不覆盖运行中应用数据。

## 摘要完成后的关系建立

- 关系建立由跨平台设置 `article_relation_enabled` 控制，默认 `false`。只有开关开启后完成的摘要才进入关系队列；关闭期间不积压，重新开启也不追溯。已有关系数据保留，以便用户停止 token 消耗后仍可查看此前结果。
- 质量过滤的纯文本阶段继续使用标题、来源和正文前 500 字；只有程序协议明确要求时才追加共享图片上下文的视觉复核。关系判断只使用标题、来源、作者、发布时间和摘要，仍不得和质量过滤合并成一条 Prompt。
- `SummaryService` 先等待 done 摘要写入 Hive，再通知关系服务。关系入队失败只能记录诊断，不能把已经成功的摘要改判为失败；启动恢复会扫描启用时间后的 done 摘要，补上摘要落盘与关系入队之间的崩溃窗口。
- **关系 v5（2026-09-26）只保留 `equivalent`（近似重复）**：同一原始内容、明确转载，或阅读其中信息完整的一篇后其余基本无实质新增信息。仅同一事件、有新增事实/分析/后续进展的文章不再关联。不自动隐藏文章、联动已读或触发垃圾拦截。
- 判断不参考已读状态、用户兴趣或质量。日报/周报/合集和纯图片不建立关系；完整且有辨识度的同题论文/原文身份仍可支持近似重复，不能因一侧正文截断否定。截断版与完整版同源不等于任意一篇内容都足够完整。
- v5 输入保留稳定 `articles + new_ids` 前缀，可变 `relation_groups`（稳定组 ID、一句话 topic、最多三个当前窗口代表成员 ID）、`article_group_ids`（当前文章全部组 ID 的数组，保留历史重叠归属）和协议位于末尾。组目录目前无数量淘汰。协议/默认 Prompt 更新后原有缓存前缀需重新建立，后续仍可复用稳定文章前缀；不承诺首次请求命中。
- 所有新组都必须有一句话 `topic`，至少两篇文章；显式 `group_id` 加入可仅有一篇新文章，省略/空 topic 只允许沿用已有非空概述，旧空概述组入组时必须补充。缺失/非文本概述、输出占位文字“暂无关系概述”或旧/未知类型会使请求失败并按既有有限重试处理，最终失败保留 pending/history 等待手动重试，不能静默当作无关系成功。其他引用、归属冲突操作仍整体忽略，不自动合并或转移成员。“一句话、具体内容、微调不扩大”由 Prompt 约束，不引入句号计数等复杂语义规则；修改前概述存入 `topicHistory`。
- **保留全部旧关系并统一类型，不重判也不清空**。用户明确接受原 `same_event` 组可能不满足新重复标准。schema 5 迁移只逐组改写 `kind=equivalent`，原 ID、成员、reason、confidence、创建时间、enabled、topic/topicHistory、节点、pending/history、激活时间、序号和独立批次账本原样保留；不借重叠成员合并组。schema 最后写入，支持中断后幂等续作；epoch 拒绝旧批次迟到写回。新安装或跳过 v4 的旧安装同样不执行历史 v4 的清空迁移。运行新构建时由应用内迁移，禁止外部打开运行中的 Hive 改写。
- 旧组有概述则原样显示，缺失或空白显示“暂无关系概述”，占位仅在 UI 层计算、不写入数据库。相关文章区域复用 `ArticleInfoCard.content` 外框，标题为“相关文章”；框内先显示概述正文，再显示文章横条和展开/收起。外框沿用摘要/拒绝理由的 12px 内边距和 8px 圆角，但相关文章专用中性灰底（浅色 10%、深色 15% 的 #808080），标题/图标、关系标签和展开按钮使用 onSurfaceVariant，内部横条及 hover 使用低透明中性灰；摘要/拒绝理由配色不变。概述不再另套横幅，正文以 14px/1.5 行高自然换行；历史重叠组的不同概述全部保留显示，相同概述/占位去重。不递归扩展跨两级关系。列表默认三条，设置条数至少 1，超过后展开/收起，设置变化即时重新收起；无可展示关联时整个区域隐藏。
- 仓库 v1/v2/v3/v4 的逐字默认 Prompt 自动迁移，真正自定义文本不覆盖。已有自定义双类型规则必须在设置中替换为下方 v5 文本（或恢复默认）；旧 API 输出 `same_event` 或不带 type 不再兼容为有效结果，避免把新产生的同一事件判断伪装成重复。迁移不主动调用模型补填历史概述、不重跑已经处理的文章；原 pending 后续使用新规则。

- macOS 分栏点击相关文章时只在右侧详情区压入一层文章，不切换整个应用页面；按 `Esc` 逐层返回，前一篇文章的滚动位置、译文和摘要显隐由仍挂载的详情页自然保留。Android 使用完整文章路由，并对这条同名 `/article` 导航明确设置 `preventDuplicates: false`，否则 GetX 会把相关文章跳转误判为重复路由；系统返回键按访问顺序退回上一篇。完整文章若已被本地 5000 篇上限淘汰，关系节点仍保留标题和原文 URL，此时才退回浏览器打开原文。垃圾拦截通过相关文章临时查看其他文章时，页面级 `M/K/N` 必须停用，避免动作错误作用于原审核文章。

### 当前关系 Prompt（v5，可复制）

```text
你是文章重复内容分析器，只建立有明确证据的稀疏关系。判断与文章是否已读、用户兴趣或质量无关。

输入 articles 按时间稳定排列，每篇含稳定 ID、标题、来源等元信息和摘要；new_ids 标明本批新文章。末尾 relation_groups 提供既有关系组 ID、一句话概述 topic 和当前窗口内的部分代表成员 ID；article_group_ids 列出当前输入文章已有的全部组 ID。只使用输入中实际存在的文章 ID 和组 ID。

只建立 equivalent（近似重复）一种关系：指向同一篇原始内容、明确转载，或核心信息基本可替代，阅读其中信息完整的一篇后，其余基本不提供实质新增信息。完全重复也属于这一类型。仅报道同一事件，但包含实质新增事实、分析、评测或后续进展的文章，不建立关系。

先检查原始内容身份：完整、具体且具有辨识度的标题一致，元信息与摘要相容，足以确认同一篇论文或原始文章时，应建立关系。来源或收录时间不同、一方正文截断或摘要不足，不应单独否定这一强信号。通用标题、栏目标题、相同链接或仅主题相近都不足以证明重复；存在不同对象、版本或核心事实等冲突时不适用。无法确认身份且信息不足时，不建立关系。同一原文的截断版与完整版可以关联，但不表示读过截断版就已读完全部内容。

分组规则：
- 优先判断新文章是否与既有组所指向的原始内容或核心信息近似重复，符合时用 group_id 显式加入，members 只列新增成员，不借某个旧成员另建组。
- 没有合适既有组时，用至少两篇文章建立新组，至少一篇属于 new_ids。新组成员不能已有组归属；本批新成员最多加入一个组。历史重叠归属原样保留，不合并、拆分或重新分配既有组。
- 所有成员应共享同一份原始内容或基本可替代的核心信息。不能因 A 与 B 重复、B 与 C 重复就推导 A 与 C 重复；不能只形成首尾相接的相似链。
- 历史组可能由旧“同一事件”规则转换，范围可能较宽。保留它们不代表放宽新增标准；只凭概述主题相符或某一成员相似不够，缺乏充分证据就不加入。
- 每个新组的 topic 必须是一句简短、具体的中文概述，直接说明共同原文或重复的核心内容，不能只写“内容相似”、段落或列表，也不能填写占位文字。
- 加入既有组默认沿用概述，topic 可留空；若旧组 topic 为空，必须提供一句话概述。只有必要时微调措辞，不得通过扩大概述容纳有实质新增信息的文章，也不得通过连续微调逐步改变核心内容。

不要为日报、周报、链接合集、综合摘要或纯图片文章建立关系。不确定时不建立关系。每次操作都必须包含本批新文章，不要仅修改历史关系或概述。

只返回 JSON 对象，顶层为 groups 数组，不要 Markdown、解释或代码块。每项包含 type（固定为 equivalent）、members、reason、confidence。新组另含 topic；加入既有组另含 group_id。reason 简短说明重复依据，confidence 为 0 到 1 的数字。

示例结构（ID 仅为示意）：
{"groups":[{"type":"equivalent","members":["A000123","A000456"],"topic":"两篇文章收录同一篇关于视频生成记忆机制的论文。","reason":"完整论文标题一致，摘要相容。","confidence":0.98},{"type":"equivalent","group_id":"relation-000001-g1","members":["A000789"],"topic":"","reason":"转载组内同一篇原文。","confidence":0.96}]}

没有可靠关系时返回：{"groups":[]}
```


重试：

- 翻译和摘要使用由 `auto_retry_max_count` 控制的原地重试。
- 重试期间 pending 状态应可见。

UI 注意点：

- macOS 翻译/摘要工具栏按钮是普通胶囊控件，不是重型 Liquid Glass。
- 灰色非激活按钮 hover 时不应闪烁；hover 只轻微改变边框。
- 从卡片右键菜单删除摘要后，文章详情必须立即更新。`SummaryService` 记录删除后，不要回退到过期 controller summary text。
- 卡片右键操作会直接调用 service 方法；确保跨页面 UI 观察 service 状态或 notifier 状态。
- 文章在详情页打开后，后台译文仍可能稍后完成。`ArticleController` 监听 `TranslationService.versionFor(article.entryId)`，只为当前文章解析最终译文并刷新 `translatedChunks`；删除译文也必须清理详情页旧状态。不要重新把是否已有译文只固定在控制器初始化时判断，也不要让当前详情依赖 aggregate `recordsVersion`。
- 文章列表里的长按/右键 AI 菜单由 `lib/pages/widgets/article_actions_menu.dart` 统一维护。
- 普通时间线卡片和垃圾拦截审核行都应通过 `ArticleActionsMenu` 提供翻译、删除翻译、生成摘要、删除摘要。这样新增或修复文章级 AI 动作时不需要同时改两套页面。
- `ArticleActionsMenu` 只封装文章级动作和反馈，不拥有文章详情状态；删除翻译/摘要后的可见刷新仍依赖 service/notifier 和页面已有观察链路。


<a id="article-ai-selection"></a>
## 文章级状态通知与摘要选区

- `SummaryService` 与 `TranslationService` 的记录 map 是普通 `Map`，不是 `RxMap`。GetX 的 `RxMap` 下标读取会把整个 map 注册为依赖，任何文章的记录变化都会令所有读取者失效；普通 map 将“数据存储”和“是否重建”的信号分开。
- 两个 service 都通过 `versionFor(entryId)` 提供文章级 `RxInt`。当前文章详情、文章卡片、垃圾拦截审核行和详情控制器只观察自己的 entry；pending、完成、错误、删除和账号切换清理都必须触发对应 version。`recordsVersion` 只为任务中心的 done/pending/error 等聚合计数保留，不能拿它替代文章级观察。
- 摘要 HTML 位于文章级 `SelectionArea` 内，使用 `StableSelectableHtml` 传入稳定 `anchorKey`。相同摘要内容和渲染配置下的父级重建保留 `flutter_html` parser 与选区；摘要文字或主题渲染配置改变时轮换 key，让新 HTML 正确解析。不要直接在这些位置重新构造无稳定 key 的 `Html`。
- 模型摘要本质上是纯文本，即使显示层复用 `StableSelectableHtml`，也必须先经过 `SelectableHtmlCompatibility.normalizePlainText()`。否则摘要中的 `<stdatomic.h>`、`<threads.h>` 等代码片段会被 `flutter_html` 当成标签解析，导致后续文字消失；不要直接把摘要传给 `normalizeTextFlow()`。
- 这套边界解释了为何“另一篇文章被标记垃圾”或“后台任务延迟完成”会表现为当前摘要高光消失：事件本身不是清除选区的业务动作，而是触发了全局 `RxMap` 依赖的重建，重建又替换了旧 parser。完整调查记录见[文章渲染专题](article-rendering.html#article-selection-stability)。

## 翻译持久化时序

- 完成态（done）与错误态（error）记录**必须等待 Hive 持久化成功后**再对外返回 / 更新最终 UI 状态：`TranslationService._writeRecord` 会 `await` `GStorage.translations.put`，并只在写入完成后推进 `recordsVersion`。
- 覆盖普通翻译与分块翻译两条路径（含失败恢复 `_restoreAfterFailure`）；完成后立即退出应用也不会丢失译文（有临时 Hive box 的重启/重新 hydrate 测试覆盖）。
- pending 仍是瞬态，只存在内存中，不落盘；重启后残留 pending 会被清理。
- 删除译文（`deleteTranslation`）同样等待落盘完成。
