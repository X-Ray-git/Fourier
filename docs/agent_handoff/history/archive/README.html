# 历史主题归档

这些页面保存旧交接时间线中的原始排查、实验、验证与发布过程。它们是证据库，不是当前操作手册；当前实现以 `../../status/current.md`、对应专题页和 `../decisions.md` 为准。

- [项目基础与产品演进](../../history/archive/foundation-and-product.html)：25 个旧章节。
- [订阅源、缓存与同步](../../history/archive/subscriptions-and-sync.html)：20 个旧章节。
- [翻译、摘要与 AI 过滤](../../history/archive/ai-translation-and-filtering.html)：17 个旧章节。
- [文章内容与 HTML 渲染](../../history/archive/article-content-and-html.html)：18 个旧章节。
- [图片、视频与媒体交互](../../history/archive/images-video-and-media.html)：12 个旧章节。
- [性能、滚动与进度](../../history/archive/performance-and-scrolling.html)：11 个旧章节。
- [时间线与导航](../../history/archive/timeline-and-navigation.html)：16 个旧章节。
- [列表动画与撤销](../../history/archive/list-animation-and-undo.html)：10 个旧章节。
- [macOS 桌面框架与快捷键](../../history/archive/macos-shell-and-shortcuts.html)：12 个旧章节。
- [macOS Liquid Glass 重构](../../history/archive/macos-liquid-glass.html)：7 个旧章节。
- [设置、身份与迁移](../../history/archive/settings-identity-and-migration.html)：3 个旧章节。
- [Android 专项历史](../../history/archive/android.html)：3 个旧章节。
- [发布、Git、Worktree 与 CI](../../history/archive/release-git-and-ci.html)：14 个旧章节。

逐章查找请使用 [历史时间索引](../../history/chronology.html)。

维护规则：

- 归档只保存旧证据，不追加当前工作日志；当前结论写入专题页或决策日志。
- 一个历史章节只保存在一个主主题，跨主题关系使用链接，不复制原文。
- 单个归档接近 1,000 行时按自然子主题继续拆分，不使用数字文件前缀或机械分卷。
- 旧章节使用稳定的 `legacy-xxx` 锚点；移动章节时必须同步更新 `../chronology.md`。
