# 决策日志

## 应用整体迁移为 Fourier

背景：旧名称 Auto Folo 容易把个人二次开发客户端与 Folo 官方品牌混在一起，且旧应用身份、图标和包名已经不适合作为长期公开工程标识。

决策：应用展示名、Dart package、Android application id、macOS bundle id、MethodChannel、构建产物和视觉素材统一迁移为 Fourier；旧配置导入与历史内容保留明确兼容。GitHub 仓库名称、远端 URL 和本地目录另行迁移，当前不伪造已经完成的状态。

后果：Fourier 会被 Android 和 macOS 视为新的应用身份。迁移前必须从旧版导出设置，安装后再导入；旧 Auto Folo 名称不得重新出现在当前产品文案或命名空间中。

## Wiki 使用内嵌 Markdown 的离线单页结构

背景：目标要求克隆后直接双击 `index.html` 阅读，无服务、无构建步骤、无外部依赖，同时正文仍尽量保持 Markdown 编辑体验。浏览器在 `file://` 下不能可靠地由入口页读取独立 `.md` 文件。

决策：每个专题使用自包含 `.html`，正文写在 `script[type="text/markdown"]` 中并由仓库内置 markdown-it 渲染；`index.html` 负责入口，搜索索引作为已提交静态数据。正文允许内嵌可信 HTML 和 SVG，不使用 Mermaid。

后果：编辑和阅读是同一个文件，双击即可使用；修改内容后只需运行索引和一致性检查。不得重新引入必须启动服务器、CDN、ES Module 或运行时 `fetch()` 的方案。

## 保留根目录 `AGENT_HANDOFF.md` 作为入口

背景：后续 agent 会预期根目录存在交接文件。

决策：保留 `AGENT_HANDOFF.md` 作为短入口，把详细知识迁移到 `docs/agent_handoff/`。

后果：agent 能快速起步，同时完整历史仍然可查。

## 完整历史按主题归档

背景：旧的单文件交接文档包含重要历史讨论，但 8,000 余行内容集中在一个文件中，不适合作为 wiki 证据库继续维护。

决策：完整历史按主题迁移到 `history/archive/`，每个旧编号章节只归入一个主主题；`history/chronology.md` 保留原始出现顺序和稳定 `legacy-xxx` 锚点。`history/timeline.md` 只保留兼容入口。

后果：专题页可以保持简洁，历史仍可按主题或旧编号追溯，也不会继续形成新的巨型单文件。

## 不使用数字文件前缀

背景：开发顺序不遵循固定计划。

决策：使用语义化 wiki 路径，由 README 描述推荐阅读顺序。

后果：新增主题时无需重命名文件，也不会暗示优先级。

## 文章正文保留 `Column`

背景：Sliver 虚拟化可能提升性能，但会影响选择、目录锚点、图片生命周期和滚动行为。

决策：不要随意切换到 `SliverList.builder`。

后果：除非进行专门重构，否则围绕当前结构优化。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 保留全文选择行为。
- 保留目录锚点准确性。
- 保留图片预览/光标/菜单行为。
- 保留当前滚动位置语义。
</details>

## 畸形文章修复保持保守

背景：少数真实文章出现异常空白、表格渲染、空代码块或交互组件文本问题。有些问题来自上游内容本身畸形。

决策：添加宽泛渲染启发式规则前，先检查真实源内容。优先做窄修复，或接受罕见上游边缘情况。

后果：渲染保持可预测，不为了少数坏文章牺牲常见正确文章。

## 不裁剪宽表格 scroll viewport

背景：在横向表格 scroll viewport 外包圆角 `ClipRRect`，会在表格宽于文章栏时切掉矩形表格四角。

决策：不要仅为视觉一致性而给表格 viewport 加圆角裁剪。

后果：宽表格保持正确的直角边框，同时仍可横向滚动。

## 无 `<th>` 的稳定网格仍属于数据表

背景：阿里技术文章《为什么大模型的缓存命中率能到 90%？》包含 `7×5` 和 `4×2` 两个结构完整的数据表，但首行使用 `<td>` 而不是 `<th>`。旧规范化规则把所有无 `<th>` 表格当成 Newsletter 布局容器，导致两张表在渲染前被摊平成正文。

决策：布局表格清理改用保守的结构判断。有 `<th>` 的表格直接保留；无 `<th>` 时，至少两行两列、列数稳定、无嵌套、文本单元格占主导且非媒体主导的网格也保留。其余明确像布局容器的表格继续扁平化。

后果：修复不依赖订阅源、文章标题或具体文本，正确的 td-only 数据表可以进入现有表格渲染器，Newsletter 单单元格/嵌套布局仍保持轻量。

未来方向：如果表格与其他富文本清洗需求继续分化，应把阅读渲染规范化和 LLM 输入清洗拆成独立管线与缓存；本轮不扩大到该架构重构。

## 避免会改变布局的图片 hover

背景：macOS 图片 hover 缩小/边框效果会移动后续文字，造成明显布局不稳定。

决策：macOS 图片 hover 不应改变图片布局尺寸；用光标表达可点击。

后果：文章文字保持稳定，同时图片仍有可点击提示。

## 选择性使用 Liquid Glass

背景：全局铺开 Liquid Glass 会造成可读性和 macOS 性能问题，尤其是在密集重复 UI 中。

决策：有意义的浮动控件/表面可以使用玻璃；密集设置、任务中心、未读标签和重复装饰使用轻量描边/静态样式。

后果：应用保留设计方向，同时避免重现 `v1.1.25` 风格的性能回归。

## 不在 Flutter 中追求真实外部背景取色边框

背景：用户希望边框高光颜色来自应用窗口后方真实内容。Flutter 绘制无法可靠采样这些像素；NSVisualEffectView/系统 compositor 才拥有这部分模糊。

决策：放弃 Flutter-only 的真实外部背景取色边框。未来如果要做，应作为 native/AppKit renderer 实验。

后果：当前玻璃边框使用实用的白色/高光样式，不假装采样不可得像素。

## macOS 中间 header 保持轻量

背景：中间时间线/列表 header 的玻璃背景增加视觉重量，也可能影响性能。后续细线分隔也被取消。

决策：除非明确重新讨论，否则 macOS 中间栏 header 不使用玻璃背景。

后果：中间列表 chrome 保持安静且不显示底部分隔线；文章详情独立保留细分隔线和阅读进度。

## macOS 圆角收敛按层级联动

背景：用户希望 macOS 整体圆角略微变小，同时文章卡片圆角略微增大。此前调研 Apple 官方资料后，没有找到普通 macOS app 的固定圆角数值规范；官方更强调圆角同心性、容器关系和系统控件自适应。

决策：第一阶段只收敛主几何层和大面板：窗口/Flutter 外框 `24`，红黄绿圆心 `24`，侧边栏面板 `18`，`AppGlassSurface` 默认 `16`，`AppGlassPanel` 默认 `18`，突出面板 `20`，macOS 文章卡片 `10`。分屏文章右下角安全裁剪同步外框半径。

后果：红黄绿、外框、侧边栏和右下角文章裁剪必须联动维护。不要把“圆角收敛”扩展成全局搜索替换。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要单独改 `MainFlutterWindow.swift` 的 `windowRadius` 而不同步 Flutter 外框、红黄绿圆心和文章右下角裁剪。
- 不要把 `999` 胶囊、圆形按钮、图片、代码块、表格、小标签或 Android 端纳入这一轮 macOS 主几何收敛。
- 不要为了统一而给宽表格 scroll viewport 加圆角裁剪。
</details>

## 玻璃按钮先集中颜色 token，再统一角色规则

背景：用户希望进一步规划液态玻璃按钮的背景颜色规则，并评估哪些控件未来可以贴图/预绘制以改善性能。当前项目里右上角文章按钮、目录按钮、时间线排序/同步按钮、摘要/翻译 pill、设置页 segmented/select 等控件虽然都带有玻璃语言，但选中态、默认态、hover、橙色使用范围仍存在分叉。

决策：第一阶段只新增 `AppGlassControlPalette`，把散落的 hover、pressed、active、border、disabled 色值集中管理，并保持视觉体感基本不变。第二阶段再讨论和实现“按钮角色规则”，决定哪些状态允许橙色背景、哪些只改变图标色、哪些保持中性背景。贴图/预绘制应排在角色规则稳定之后。

后果：不要因为已经有 palette 就认为按钮设计语言已经统一。后续如果改右上角文章按钮、目录按钮、时间线排序按钮、同步按钮或 pill 控件，应优先接入同一套角色规则，而不是继续在各自页面手写颜色公式。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要重新在页面局部复制 `cs.primary.withValues(...)`、`cs.onSurface.withValues(...)` 等玻璃控制状态公式。
- 不要在角色规则未稳定前批量做贴图化，否则会把临时视觉状态固化成资产。
- 不要为了统一而把密集重复控件改回重型玻璃；性能约束仍然优先。
</details>

## 批量时间线变化保留列表实例，读状态变化保留动画

背景：切换未读/全部、从具体订阅源回到全部文章、排序、同步回填等操作会产生大量插入/删除/重排序 diff，并阻塞 UI isolate。用户明确希望列表动画只在“标为已读/恢复未读”时应用，其余批量变化不要动画，以节省性能。

决策：macOS 时间线列表 key 只包含 selected mode 和 scope key。批量变化递增 `TimelineController.timelineListResetVersion`，并作为 `ImplicitlyAnimatedList.batchUpdateVersion` 传入；组件在原有 `AnimatedList` / `ScrollController` 上以零时长同步项目。`markAsReadLocal` / `markAsUnreadLocal` 不递增该 version，保留单篇移除/恢复动画。单篇数据库通知只有在过滤后的 entry id 成员或顺序真的变化时才递增 version，普通正文/摘要等元数据更新不触发。

后果：批量变化避免全局动画卡顿，普通单卡片标已读/恢复未读动画保留；列表不再因为无关元数据通知被替换，因此滚动位置不会被重置到顶部。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要让排序、筛选范围切换、同步回填、加载更多重新触发大规模列表 diff 动画。
- 不要为了禁用批量动画把 reset version 放回列表 key；这曾直接造成 `M` 后回到顶部，并绕过单卡片退场动画。
- 不要在侧边栏直接连续设置 `isSilentSelected`、`selectedFeedId`、`selectedCategory`；应使用 `setTimelineScope()` 合并为一次过滤。
- 不要为了禁用批量动画而移除已读/未读的局部动画，除非用户重新明确要求。
</details>

## 本地已读覆盖保留到未读快照确认

背景：mark-read 请求和未读列表请求可能并发。即使 mark-read 已成功，先发出的未读请求仍可能返回包含该文章的旧快照。旧实现会在待同步队列清空后立即删除本地 `readStatus == true`，随后用旧快照把文章重新写成未读。

决策：mark-read HTTP 成功只移出待同步队列，不删除本地已读覆盖。未读快照仍包含文章时继续用覆盖保护本地已读；只有某次对应数据源成功返回且明确不再包含该文章时，才认为服务端状态已经收敛，清除覆盖并把本地缓存保持为已读。主时间线和订阅源详情使用相同规则。

后果：刷新与已读同步并发时，文章不会因为旧快照重新出现在未读列表；恢复未读的 `false` 覆盖也会在服务端快照确认文章已读后清除。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要在 `ArticleController.markAsRead()` 或 `UndoService.markAsRead()` 的 HTTP 成功分支立即删除 true 覆盖。
- 不要因为当前 pending 队列为空，就把未读快照中仍出现的文章直接降级为未读；pending 可能刚被并发同步清空。
- 不要永久保留已被服务端“未读快照缺席”确认过的覆盖，否则其他客户端后续恢复未读无法同步回来。
</details>

## 时间线排序保持本地化

背景：用户请求的长文/短文排序只针对当前已加载本地文章，不要求远端全历史排序。

决策：只排序本地已加载集合，并避免 UI 文案暗示远端/全局排序。

后果：排序保持快速、边界明确，不需要新增 API 或全历史抓取。

## macOS 快速切换只暴露未读/全部

背景：用户澄清：中间栏快速过滤器不需要 `已读`，但已读文章页面/入口仍需要保留。

决策：macOS 时间线 header 快速切换只暴露 `未读 / 全部`。

后果：不要删除已读页面能力；只是在这个局部快速过滤器中省略 `已读`。

## macOS 订阅源筛选 header 不重复侧边栏设置

背景：在左侧侧边栏点开某个分类并选择具体订阅源后，中间时间线 header 曾同时出现刷新、清除筛选、自动拉取全文、自动翻译等按钮。用户认为这些订阅源级设置已经可以在左侧侧边栏中处理，中间栏重复出现会拥挤且职责不清。

决策：macOS 中间时间线处于具体订阅源筛选状态时，不显示自动拉取全文、自动翻译、静默等订阅源级设置，也不显示清除筛选。header 保留时间线级操作，例如排序和同步。

后果：切换范围和订阅源级设置由左侧侧边栏承担；中间栏保持轻量，避免按钮拥挤。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要为了“方便”把订阅源级设置重新塞回中间 header。
- 不要在中间 header 添加清除筛选按钮，除非用户重新明确要求。
- 如果以后需要更多订阅源级操作，优先扩展左侧侧边栏或订阅源上下文菜单。
</details>

## 垃圾拦截页复用时间线级组件

背景：垃圾拦截页长期和普通时间线分叉，导致刷新按钮、文章右键菜单等功能需要单独维护。用户注意到刷新按钮位置不一致，右键菜单也缺少重新生成摘要等文章级动作。

决策：把可共享的时间线级 UI 和文章级 AI 动作抽成共用组件。同步按钮由 `AppGlassSyncButton` 维护；文章翻译/摘要菜单由 `ArticleActionsMenu` 维护。垃圾拦截页复用这些组件，但保留自己的审核业务布局和已拒绝文章处理逻辑。

后果：后续改同步按钮样式或文章 AI 菜单时，普通时间线和垃圾拦截页可以一起受益；审核页的保留/移除、拒绝理由、下一篇选择等特殊逻辑仍然独立。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要重新在 `ArticleCard` 和垃圾拦截审核行复制翻译/摘要菜单代码。
- 不要为了“统一”把垃圾拦截页的审核操作塞进普通 `ArticleCard`，除非重新设计整个审核流。
- 已读/未读快速切换属于普通时间线，不需要同步到垃圾拦截页。
</details>

## macOS Debug 禁用 Xcode Debug Dylib

背景：在 macOS 26 / Xcode 17 环境中，`flutter run -d macos --no-pub` 可能出现 Xcode 构建成功但 Flutter 等不到 debug connection。系统日志显示主程序加载 `Auto Folo.debug.dylib` 被拒绝：`library load denied by system policy`。

决策：Debug 配置设置 `ENABLE_DEBUG_DYLIB = NO`，避免 Xcode 生成并加载 `Auto Folo.debug.dylib`。

后果：`flutter run` 可以正常启动 Dart VM Service。修改后如果仍使用旧构建产物，需要先执行 `flutter clean && flutter pub get`。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要只看 Flutter 的 `log reader stopped` 表象就判断为 Dart 代码崩溃。
- 不要优先尝试普通 build phase 清理 xattr；实测时机不稳定，最终产物仍可能带 provenance。
- 如果本机有真实开发者证书，未来可以重新评估签名方案，但当前用户机器没有有效 codesigning identity。
</details>

## 使用 AppKit 系统红黄绿按钮

背景：自定义红黄绿按钮只能近似外观，无法正确匹配系统 hover、非激活、zoom 语义。

决策：使用标准 `NSWindow` 按钮并重新定位。

后果：AppKit 负责符号、非激活状态和 zoom/fullscreen 行为。

<details class="dg-callout" open>
<summary>不要回退</summary>

- Hover 任意红黄绿按钮时应显示系统 hover 符号。
- 非激活窗口应显示系统灰色状态。
- 绿色按钮应保留 AppKit zoom/fullscreen 语义。
- 红色关闭应保留“隐藏窗口而非退出应用”的行为。
</details>

## Android 内部安装签名保持对齐

背景：GitHub 构建 APK 和本地 debug APK 签名 key 不同时会互相安装冲突。

决策：通过 GitHub Secrets 使用用户本地 debug keystore 材料进行内部构建签名。

后果：包名相同时，内部 APK 可以覆盖本地 debug 构建。单纯提高版本号不能解决签名不匹配。

## 包命名空间迁移前先实现设置导出

背景：改变 Android application id / macOS bundle id 会创建新的应用身份，平台存储不会自动迁移。

决策：正式命名空间迁移前，先加入剪贴板 JSON 设置导入/导出。

后果：用户可以手动迁移凭据/设置；缓存和文章内容刻意不备份。

## 使用 `io.github.xraygit.autofolo` 命名空间

背景：`com.folo.*` 看起来像官方 Folo 命名空间所有权，用户希望避免这种暗示。

决策：当前应用标识命名空间为 `io.github.xraygit.autofolo`；产品仍是 X-Ray 个人使用的 Auto Folo。

后果：历史 `com.folo.*` 和 `com.autofolo` 引用已经废弃。

## Release notes 对字面量 `\n` fail-fast

背景：release message 里的字面量 `\n` 曾造成格式错误的 release notes。

决策：默认拒绝字面量 `\n`，确实需要时必须显式传 `--allow-literal-backslash-n`。

后果：release 脚本不猜测用户意图。

## Release tag 必须是 annotated tag

背景：release job 曾因 tag object 不是 annotated tag 失败。

决策：release tag 必须是 annotated tag，并通过 `scripts/release.sh` 创建。

后果：GitHub Actions 可以验证 tag metadata 并发布预期 release notes。

## 用户要求时保留 worktree 分支历史

背景：用户注意到早期有直接在 main 上改动的情况，明确偏好 worktree 功能集成使用 merge commit。

决策：已接受的 worktree 分支优先使用 `git merge --no-ff`，除非有具体理由不用。

后果：并行 agent 分支上下文在 git history 中可见。

## 历史证据不要作为当前操作手册

背景：旧交接内容保留了完整演进过程，其中也包含已经失效的实现、路径和阶段性判断。

决策：原始证据保存在 `history/archive/`，旧顺序由 `history/chronology.md` 维护；当前事实只维护在专题页、状态页和本决策日志。

后果：未来 agent 引用旧归档时，应把仍然有效的结论更新到专题页，不能直接把旧章节当作当前实现。

## macOS 分栏列表共享选择与移除协调器

背景：主时间线、垃圾拦截和最近阅读分别演进出了选择、后继项、移除动画、撤销恢复和确保可见逻辑。垃圾拦截还会在 `ArticleStateNotifier` 同步通知中提前 prune selection，使首次构建下一篇详情与卡片退出动画并发，表现为偶发瞬移；撤销后缓存已预热，第二次通常正常。

决策：提取 `MacSplitArticleListCoordinator`，共享稳定 key、删除前登记、删除期间选择保持、真实 `onRemoveEnd` 后切换详情和 reveal。页面只保留业务动作及各自的滚动策略，不创建覆盖所有时间线结构的大型通用 Widget。

后果：垃圾拦截先行迁移并独立验证；主时间线和最近阅读分阶段接入。主时间线的虚拟列表定位、最近阅读的恢复未读语义仍作为页面差异保留。

## 同步持久化与 macOS 单项移除动画跨帧隔离

背景：用户长期观察到垃圾拦截 `M/K` 和主时间线双击偶发没有动画。定向日志证明这不是固定时长或曲线问题：正常移除约 180ms，异常会从动画值 `1.0` 在 30–80ms 内直接跳到接近 `0`。垃圾拦截中，`ArticleStateNotifier` 会在页面显式删除前同步删掉列表项；主时间线双击则在 post-frame callback 中执行约 100ms 的同步数据库写入，消耗了动画首帧。原文浏览器还曾在动画中途抢走前台。

决策：垃圾拦截用 pending action 屏蔽本次状态广播和 reload 对可视列表的提前修改，持久化完成后在帧边界只提交一次删除。主时间线双击允许 `markAsReadLocal` 先持久化，再在下一帧边界更新内存列表；会删除卡片时，浏览器在真实 `onRemoveEnd` 后再跨一帧打开。其他已读调用方保持默认同步视觉更新。

后果：不改变既有 180ms 动画曲线，也不把平台特殊时序扩散到 Android。用户验证 `M/K` 和双击恢复稳定。诊断埋点保留为 Debug 显式开关 `AUTO_FOLO_ANIMATION_PROBE`，普通运行和 Release 没有监听/日志成本。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要让垃圾拦截在 pending action 期间响应同一 entry id 的增量状态通知并提前删项。
- 不要把同步数据库写入和 `ImplicitlyAnimatedList` 列表变更重新放进同一个 post-frame callback。
- 不要用固定短延迟在移除动画中途打开外部浏览器；应依赖真实移除生命周期。
- 不要默认开启同步诊断日志；需要排查时用 dart-define 临时启用。
</details>

## macOS soft scroll edge 实验已撤销，回到固定 header

背景：用户希望正文和各类时间线滚入 header 时没有硬分界，同时发现文章 header 左侧会出现疑似相邻刷新按钮投射的白光。参考工程的 `GlassScrollEdgeEffect` 并不是让模糊半径随位置增加，而是在滚动内容上覆盖页面背景纹理/底色并渐变 alpha。

实验：曾让主时间线、垃圾拦截、最近阅读、订阅源详情共用 `MacHeaderScrollEdge`，文章详情使用同源 `GlassScrollEdgeEffect`；内容滚入透明 header 后通过分段采样的 alpha 渐隐。阅读进度条也曾移到面板最顶端。

最终决策：用户长时间使用后认为渐隐灰色不够自然，撤销整套 header 渐隐设计。主时间线、垃圾拦截、最近阅读、订阅源详情现在通过轻量 `MacHeaderPane` 使用固定 `surface` header，列表从 header 下方开始；文章详情同样恢复固定 `surface` header，但不恢复整块 `BackdropFilter`。玻璃只保留在交互控件。中间栏 header 仍不显示底部分隔线；文章 header 底部始终显示 `1px`、`outlineVariant`、alpha `0.30` 的细线，橙色阅读进度覆盖在该细线上。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要恢复文章 header 的整块 `BackdropFilter`，否则可能重新采样相邻分栏控件的高光。
- 不要未经重新讨论恢复 `MacHeaderScrollEdge`、透明 header 或内容滚入 header 的渐隐方案。
- 不要把文章进度条重新移到面板最顶端；当前位于文章 header 下边缘，并与常驻细分隔线叠层。
</details>

## macOS 固定 header 让 scrollbar 自然从正文区域开始

背景：透明 header 允许卡片滚入其下方，但 scrollbar 应从 header 下缘开始。早期用实色色块盖住顶部 thumb，会同时切掉卡片右上角；改为 `MediaQuery.padding` 的间接方案又没有稳定约束自动 scrollbar。主时间线和最近阅读内部遗留的局部 `ScrollConfiguration` 还会覆盖共享行为，重新生成从窗口顶端开始的 scrollbar。

最终决策：撤销透明 header 后，不再需要 `MacHeaderScrollbar` 的顶部轨道 inset。`MacHeaderPane` 用固定高度 header 与 `Expanded` body 分栏，列表及 scrollbar 都自然从 header 下缘开始。右侧正文使用普通显式 `Scrollbar`，继续放在正文圆角安全 clip 外部。

后果：thumb 从 header 下缘开始且一开始可见，内容不会进入 header。中间栏和右侧正文保留各自的 `crossAxisMargin`。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要用矩形色块遮住从窗口顶端绘制的 scrollbar。
- 不要把 scrollbar 放回正文右下角安全 clip 内部。
</details>

## macOS 正文图片按文章预取并随已读状态回收

背景：正文图片此前只在打开文章后由 `CachedNetworkImage` 开始下载。用户希望刷新后提前下载全部未读文章图片，并接受较激进的 macOS 参数，但要求通过已读后及时清理控制缓存增长。Android 等 macOS 验证后再用更保守参数移植。

决策：macOS 使用一套共享 cache manager 和文章级缓存命名空间，而不是每篇文章独立创建 manager。全部本地未读文章按时间线顺序进入图片任务队列，每篇最多 8 张，总并发 16；当前文章前 4 张拥有弹性优先级，空闲槽位可由后台借用。不使用 hover 预测，不批量预解码到内存。`readHistory` 作为最近阅读/标记时间：保持已读 5 分钟且文章不再显示后，串行删除该文章登记的原图与尺寸变体；运行中 timer 及时处理，刷新补扫遗漏。

后果：同一 URL 跨文章允许重复缓存，换取整篇可靠清理。旧 `v2_` 历史缓存不在本轮迁移或清理；验证稳定后再单独设计明确的旧缓存清理入口。未来封面必须使用独立缓存角色，不能复用正文清理键。

## macOS 红黄绿使用自绘控件并转发系统 action

背景：为了让红色按钮圆心与窗口、侧边栏左上圆角圆心重合，系统 `standardWindowButton` 曾被手工移动到圆心 `(24, 24)`。实际按钮点击 frame 会跟着移动，但 AppKit 在 `NSTitlebarView` 和 `NSThemeFrame` 中维护的私有整组 hover tracking 仍停在默认位置，相差约 `8px`，表现为从不同方向进入时符号提前出现或消失。

排查结论：不能通过公共 API 稳定同步这套私有状态。手工重建同尺寸 `NSTrackingArea` 后，坐标虽然正确，首次启动却没有 hover，只有全屏往返触发 AppKit 重建后才恢复；移动共同的 `NSTitlebarView` 会发生坐标累积并让按钮脱离正常 hit-test 层级，最终点击失效。

决策：隐藏系统标准按钮，使用一个 AppKit `TrafficLightContainer` 和三个 `TrafficLightButton: NSControl` 绘制可见按钮。每颗按钮独立维护精确 `14 x 14px` tracking/click 区域，容器只同步三颗符号状态，因此按钮间空隙不会触发 hover。窗口 key 状态负责彩色/灰色切换，按压拖出后松开不执行。点击时不自行复制窗口语义，而是通过 `NSApp.sendAction` 转发给对应隐藏系统按钮现有的 target/action。

后果：位置、hover 和点击范围不再受 AppKit 私有 tracking area 影响；绿色按钮仍沿用当前系统按钮配置的行为。全屏视频只隐藏自绘容器。除非整体回到系统默认标题栏布局，否则不要再次直接移动系统标准按钮，也不要恢复本轮仅用于排查的 `TrafficLightProbe`。

## macOS 26 侧边栏使用局部原生 Liquid Glass

背景：侧边栏原先依赖铺满整个透明窗口的 `NSVisualEffectView(.sidebar, .behindWindow)`，Flutter 面板再叠加模糊、冷白 tint、边缘高光和阴影。深色模式尚可，但浅色模式即使窗口位于白色背景上仍偏灰、偏深；继续提高白色覆盖只是在系统材质上模拟另一层材质，也让原生与 Flutter 明暗状态更容易分叉。

决策：macOS 26 改用只覆盖侧边栏面板的 `NSGlassEffectView(style: .regular)`，不设置 `tintColor`，不叠白色和二次模糊。macOS 10.15～15 使用相同局部几何的旧 `NSVisualEffectView` 回退。应用强制浅色/深色时同步 AppKit appearance 和玻璃 renderer 的 platform brightness。侧边栏宽度、margin、圆角以 Flutter 的 `MacOSLayoutMetrics` 为唯一真值，通过 channel 同步给 Runner；Swift 只保留启动兜底值。CI 固定使用带 Xcode 26 SDK 的 `macos-26` ARM64 runner。

边界：原生 API 不提供模糊半径和 border 参数。用户明确选择保持系统模糊；边界由 Flutter 最终连续曲率轮廓补 `0.5px` 环境描边，浅色黑 `12%`、深色白 `12%`，浅色另有轻微外侧阴影。为堵住 AppKit 圆角与 Flutter 连续曲率抗锯齿之间的漏底，原生 backdrop 在遮罩后外扩 `1px`。

后果：侧边栏真实材质由系统负责并自动适配深浅模式，Flutter 只负责内容、最终轮廓和可读性补偿。用户已确认纯原生版本整体观感很好；不要重新引入大面积白色覆盖，也不要用 `.clear` 替换 `.regular`，除非未来明确改成媒体背景并重新处理可读性。

补充决策：局部原生玻璃不能直接依赖 Flutter 最外层 `ClipPath`。`NSGlassEffectView`/`NSVisualEffectView` 是 Flutter 视图下方的 AppKit 兄弟节点，窗口聚焦时增强的原生玻璃效果曾越过透明窗口外框，在左上、左下最外侧圆角造成透明穿透和不规则锯齿。Runner 现在增加覆盖内容区的透明 `sidebarBackdropHost`，只在该宿主上使用 `24px` AppKit 连续圆角并裁剪其内部玻璃；侧边栏自身 `1px` backdrop bleed 保留，用于覆盖 AppKit 与 Flutter 内侧轮廓的抗锯齿接缝。不能把该修复改成裁剪整个 `contentView`，也不能简单删除 bleed。用户已分别观察聚焦状态下的最外侧圆角，确认原问题消失且既有视觉效果未受影响。

## macOS 订阅源侧边栏分离选择、展开与临时可见性

背景：普通订阅源分类此前只要包含 `TimelineController.selectedFeedId` 就永久强制展开，没有判断当前页面是否仍为时间线。用户从具体订阅源切到最近阅读后，旧筛选上下文仍保留，导致分类箭头看似可点击却始终无法折叠；强制展开期间的点击还会暗中覆盖用户原来的展开偏好。

决策：导航选择、手动展开和临时可见性分别计算。仅当当前页面是时间线且正在查看分类内的具体订阅源时，父分类临时锁定展开；离开时间线后解除锁定，并恢复原来的手动状态。临时锁定期间不允许折叠，也不得写入隐藏的折叠意图。分类主体、展开箭头和订阅源行各自只负责筛选、展开和选择。静默订阅源继续遵循已确认的特殊规则，不因子项选中自动展开。

后果：后台可以保留订阅源筛选上下文，但它不会再影响最近阅读、垃圾拦截和设置页面上的侧边栏 disclosure。将来增加侧边栏搜索时，应把搜索展开视为另一种临时可见性，不能复用或覆盖手动展开状态。

## macOS 正文链接 hover 不再触发 HTML 重解析

背景：正文链接原本在 hover 时增加下划线，并同时在底部显示目标 URL。实现使用文章级共享 `_hoveredUrl`，每个 `HtmlChunkCard` 都通过 `ValueListenableBuilder` 监听该值，并把当前 URL 纳入 widget 缓存键。历史记录曾认为这只重建链接所在 chunk，但实际任意 URL 变化会通知所有 chunk，导致全篇 `flutter_html` 重新解析和文本布局；用户观察到滚动时鼠标碰到链接会瞬时卡顿。

决策：取消 hover 动态下划线，移除 `HtmlChunkCard` 对共享 URL 的监听及 hover URL 缓存键。链接仍保留主题色、手型光标、点击打开和底部 URL 预览；底部覆盖层继续局部监听 `_hoveredUrl`，不改变正文高度。

后果：用户验证滚动经过链接时卡顿消失。不要为了恢复下划线重新让全局 hover 状态失效 HTML 缓存；未来若要增加 hover 样式，必须先证明它只更新目标链接绘制且不触发复杂 chunk 重解析。

## macOS tooltip 使用共享窗口碰撞布局

背景：文章详情最右侧“标为已读”文案较长，旧 `AppGlassTooltip` 始终以目标中心向下展开，没有窗口边界判断，因此气泡会伸出应用并被裁切；其他靠右、靠下控件同样存在潜在风险。逐个按钮改 offset 会继续产生分叉。

决策：tooltip overlay 改为读取目标和气泡真实尺寸，由共享 `SingleChildLayoutDelegate` 定位。气泡始终保留四周 `8px` 安全边距；默认位置空间不足时，下方翻到上方、右侧翻到左侧，其余水平偏移直接向窗口内 clamp。缩放动画的锚点必须跟随最终方向翻转，始终从靠近触发控件的一侧展开。视觉材质、等待时间和业务调用位置不变。

后果：所有 `AppGlassTooltip` 自动获得一致的防截断行为。新增测试覆盖右上角长文案、右下角右侧 tooltip 及底部 tooltip 向上翻转的动画锚点；不要为单个按钮重新引入硬编码位置。

## 圆形工具按钮只用前景色表达橙色状态

说明：本节关于普通圆形按钮保持中性背景的原则仍有效；其中 `未读/全部` switch、`0.86` tint 和“范围入口使用橙色前景”的具体结论已被后文“macOS 文章范围与排序共用圆形 morph 选择器”取代。

背景：圆形/header 玻璃按钮此前存在两套选中语言：排序和同步只把图标变橙，而“标为已读”和订阅源状态按钮还叠浅橙背景；`未读/全部` 也使用极弱橙色滑块 tint 和橙色文字。用户希望按钮更通透，并让相同形态的控件遵循同一中性背景规则。

决策：所有 `AppGlassIconButton/AppGlassRoundControlChrome` 的选中态背景与普通态一致，只通过橙色图标表达状态；浅色和深色同时执行。`未读/全部` 滑块去掉主色 tint，文字改为自适应 `onSurface`。仅深色模式降低圆形工具按钮和该 switch 滑块的玻璃 tint，使用普通 control alpha 的 `0.86`。该参数通过按钮专属 settings 注入，不修改全局 `AppGlassTone.control`。

边界：tooltip、菜单、面板、设置页 segmented、翻译/摘要等语义控件，以及红色危险和绿色保留操作均不在本轮修改范围。

后果：按钮状态依靠前景色而非底色区分，圆形工具栏在两种主题下更统一。旧 `selectedFillOpacity` 已无合法用途并删除；后续不要在单个 header 按钮上重新添加橙色填充。

## 自动翻译和摘要只在入队时检查已读状态

背景：曾实现过“文章变成已读时，从自动翻译和摘要等待队列移除”。长期使用表明该机制基本没有实际效果：Worker 每 `500ms` 按配置并发数整批取走任务，默认并发为 `16`，队列不长时几乎没有可取消窗口。继续保留会让已读写入、两个 Worker 和翻译 `pending` 都承担效果有限的额外分支。

决策：删除 `LocalArticleDbService.setReadState(..., true)` 的 AI 队列取消副作用、两个 Worker 的 `removeQueued()` 以及仅为该链路存在的翻译 `clearPending()`。保留 `AutoAiQueueCoordinator.onArticleContentAvailable()` 作为唯一自动入队门卫：正文持久化后读取最新本地文章，当时已读则不排自动翻译/摘要，当时未读则正常入队。入队后不因后续已读状态取消；手动操作不受限制；垃圾拦截判定不改变任务行为。

后果：以未读状态进入队列的文章，即使随后被标记为已读，仍会完成自动翻译/摘要；这是明确接受的语义。已读状态写入恢复为纯数据职责，自动 AI 的资格判断集中在正文可用入口，不增加轮询、中断请求或持久化队列。

## Debug 网络请求保持系统证书校验

背景：`Request` 从初始提交起就在 Debug 模式无条件接受无效 HTTPS 证书，但工程没有依赖自签名服务或未配置证书的抓包代理。用户经常用 `flutter run` 携带真实 Folo 凭据，无条件放行会让不可信网络中的中间人有机会冒充 API 服务器。

决策：删除 `badCertificateCallback`，Debug 和 Release 统一使用系统证书信任链；保留自定义 `HttpClient` 的 `15s` idle timeout。需要抓包时，应把代理证书正确加入系统信任，而不是在应用内关闭校验。

后果：证书正常的 Folo、DeepSeek 和普通文章站点不受影响；证书过期、自签名但未受信任的网站及未正确配置证书的抓包代理会被拒绝，这属于预期安全行为。

## macOS 正文标题滚动后进入固定 header

背景：分屏正文刚打开时，固定 header 中的“文章详情”和始终存在的分隔线会与正文顶部的大标题形成重复层级。用户希望顶部保持安静，滚动后再用文章标题、分隔线和阅读进度补充当前位置；同时正文当前依赖稳定的 scrollbar 几何、目录锚点和全文选择，不能为视觉效果轻易改成 `SliverAppBar`。

决策：只在 macOS 分屏正文保留现有固定 `surface` header。根据正文标题的真实渲染高度和滚动 offset 计算折叠进度：标题约 `82%` 离开正文后，单行 header 标题才开始淡入并轻微上移；分隔线和阅读进度共用该显隐进度。顶部不显示“文章详情”。Android 和独立文章分页器保持原行为。

后果：视觉上获得折叠大标题的核心体验，但正文 sliver、scrollbar 起点、目录定位和 HTML 渲染结构不变。后续调整出现时机应继续基于真实标题高度，不要退回容易让长短标题重复显示的固定滚动阈值。

## 格式清洗只处理确定无效内容

背景：对本机 4497 篇文章的只读审计发现，清洗器把 `opacity: 0.8` 误判为完全透明，并在重新序列化顶层文本时把已转义尖括号还原成真实 HTML；同一 `entryId` 的正文变化也可能命中旧的翻译/摘要规范化缓存。无地址媒体则被渲染成类似可播放内容的空框，既没有解释问题，也容易让用户误以为仍在加载。

决策：inline style 按 CSS 声明解析，只删除数值确实为零的 opacity；顶层文本重新输出时始终 HTML 转义；规范化缓存同时核对文章 ID 和原始正文。无有效地址的媒体节点继续保留，但显示明确的不可用原因，并在可能时提供原文入口，不能静默跳过。

边界：本轮不调整数据表/布局表分类阈值，不回退到曾退化真实表格的 `flutter_html_table` 块渲染，也不顺带扩展 SVG、MathML 或任意 iframe 支持。复杂表格的 rowspan、colspan 和富媒体单元格另行设计。

后果：清洗行为更忠实且可解释，源内容异常仍对用户可见；翻译和摘要不会因正文更新继续使用旧规范化结果。新增规则必须用最小 HTML 结构回归测试，不要用订阅源或文章标题硬编码。

## 设置页按输入语义决定保存方式

背景：设置页已经让外观、角标和重试次数选择后立即保存，但 LLM 卡片仍要求用户调整多个离散选项后再点击一次整卡保存。这个按钮既重复确认，又把模型选择与尚未完成的 Temperature/并发数文本草稿捆绑；删除整卡按钮后，macOS 和移动端还可能分别写出不同的输入行对齐参数。

说明：本节关于“Folo 三项凭据必须完整”的认证字段结论已经被下一节“Folo 认证收敛为 Session Token”取代；输入控件保存语义和测试连接设计仍然有效。

决策：dropdown、segmented、switch 等离散选择立即持久化且正常成功时保持安静；LLM 的模型、思考模式、思考强度和 `max_tokens` 纳入该规则。单值数字输入在按 Enter 或失去焦点时校验并静默保存，无效值恢复为上一次有效值；凭据、API Key 和 Prompt 继续保留明确保存操作。Folo 三项凭据与 DeepSeek API Key 收拢到同一个服务认证区域和保存动作，Folo 三项必须完整，DeepSeek 留空表示清除。LLM 离散写入串行并以最后一次选择为准，不能读取或保存未确认的文本草稿；重置默认立即落盘。两端分别复用共享的自动提交数字输入和认证操作组件。

后果：设置页不再存在含义模糊的 LLM 整卡“保存此参数”，普通数字项也不再排列大量难以对齐的保存按钮。macOS 外观 segmented 独占一行，避免和结构不同的下拉框强行等高；服务认证底部使用紧凑的“测试连接 + 保存认证”按钮行，Prompt 操作继续在容器底部右对齐。测试连接使用当前输入且不落盘：Folo 调只读订阅接口，DeepSeek 调需认证的只读模型列表，不产生推理费用；DeepSeek Key 留空时明确显示未配置并跳过，不应让可选项导致 Folo 测试被判为整体失败。离散参数持久化后从下一次相关请求生效，外观等有运行时监听的设置仍即时反映。格式无效或写入失败时恢复上一次成功持久化的配置并提示用户。

## Folo 认证收敛为 Session Token

背景：应用长期要求 Session Token、Client ID 和 Session ID 三项完整，但没有确认后两项是否仍参与上游认证。2026-07-16 使用同一账号对订阅源、文章列表、收件箱列表和空的标已读写请求做只读/无副作用对照：完整三项、仅 Token、任意单项 ID 和伪造两项 ID 的结果一致；无 Token 或伪造 Token 返回 `401`。文章接口各组响应内容哈希也完全一致。

决策：Folo 登录状态、请求拦截器、连接测试和设置保存只依赖 `__Secure-better-auth.session_token`，不再发送 `X-Client-Id`、`X-Session-Id`，两端设置界面删除对应输入。旧备份中的 `client_id`、`session_id` 仍被识别为兼容字段，但导入时忽略并清理；新备份不再导出它们。旧键常量暂时保留，只用于迁移清理，不能重新进入业务认证逻辑。

后果：首次配置和跨设备迁移只需一个 Folo Token，减少无用敏感字段和配置失败点。如果上游未来改变认证要求，应先用隔离的 API 对照实验确认，再调整认证模型；不要仅因网页 Cookie 中重新出现某个字段就恢复为必填。

## macOS 单篇已读退场只在可见列表中增量更新

背景：前一轮已经稳定列表实例、延后详情切换并把数据库持久化与可视更新跨帧隔离，但用户长时间运行后仍观察到 `M` 和双击偶发瞬移。第一轮新增日志证明状态机确实按 180ms 启动，但动画首段会被 160–175ms UI 工作吞掉；延后 `ArticleStateNotifier` 后情况改善，仍残留约 90ms 卡顿。继续测量确认，单篇已读仍会对约 `4799` 篇 `allArticles` 执行完整 `_applyFilter()`、刷新应用角标和计数，并同步通知最近阅读全库读取/排序、订阅源计数、详情和审核页面。

决策：未读模式下会删除卡片时，本地数据库和网络同步语义保持立即执行，但动画首帧只从当前可见 `articles` 增量删除对应项，不更新离场中的选中文章。完整内存模型、角标/计数与跨页面 `ArticleStateNotifier` 广播推迟到真实 `onRemoveEnd` 后再跨一个 `endOfFrame` 执行；控制器保留 1 秒 fallback，避免异常生命周期丢失通知。`Command-Z` 会取消尚未执行的可视更新和通知 token。移除冗余的全局状态订阅、`allArticles.refresh()` 和单篇 `loadingState` 重写，外部浏览器继续等待真实移除结束。

后果：最终日志中，约 `4799` 篇本地文章环境下的增量更新降到 164–671 微秒，两次 `M` 和四次双击均完整经过 bucket `4→3→2→1→0`，移除期间没有列表 reset；用户视觉确认正常。不要为了追求同步一致性把全量过滤、应用角标或跨页面广播重新放回退场动画首帧。默认参数仍保留其他平台和非移除调用方原行为。

## macOS 订阅源分类行使用单一交互反馈面

背景：订阅源分类原本把展开箭头做成独立 `IconButton`，其余区域使用外层 `InkWell`。鼠标经过和按压箭头时会出现一套圆形反馈，经过分类主体时则是整行反馈，视觉上像两个互不相关的控件；但业务上仍需要箭头只负责展开、主体只负责选择。

决策：保留两种点击语义，但由覆盖整行的外层 `InkWell` 统一绘制 hover/press。内层箭头保留 tooltip 和点击处理，overlay 设为透明；临时锁定时箭头以 no-op 消费点击，避免穿透为分类选择。

后果：整行视觉反馈一致，箭头和主体的业务边界不变。以后调整分类 hover/press 只改外层行，不要重新给 disclosure 按钮增加独立 overlay。

## HTML 清洗删除格式包装空段但不合并正常段落

背景：新智元文章《奥特曼回斯坦福认错：思考外包给AI，一代人大脑正在萎缩》出现每句话之间跨度异常大的换行。对本地原始正文做只读检查后确认，上游把几乎每句话放进独立 `<p>`，并在相邻段落间插入 `<p><span><br></span></p>`。原始 152 个段落中有 83 个无文本段；旧 `_removeEmptyBlocks()` 只接受直接 `<br>` 子节点，把无意义的 `span` 当成有效结构，清洗后仍残留 82 个。`HtmlChunkParser` 随后又用 `<br><br>` 保留段落边界，造成“2 个合并换行 + 空段自身 1 个换行 + 2 个合并换行”的五重间隔。

决策：扩展既有空块判定，只删除无可见文本、无媒体、后代仅为格式包装和 `<br>` 的块；块或后代带 `id/name` 时视为锚点并保留。图片、视频、表格、代码、引用和列表继续由现有媒体保护逻辑保留。正常非空 `<p>` 完全不合并，不针对新智元或文章标题硬编码规则。

后果：目标文章的格式包装空段被清除，相邻非空段只保留既有标准 `<br><br>`；上游“一句话一段”的结构仍忠实保留。用户视觉验证通过。测试覆盖嵌套格式空段删除、文字保留、媒体保护和空锚点保护；未来不要为了压缩一句一段的来源排版加入难以证明安全的句子合并启发式。

## macOS 文章范围与排序共用圆形 morph 选择器

背景：主时间线和订阅源详情此前使用 `58px` 紧凑二态 switch 表达“未读/全部”，排序则维护一套时间线私有的圆形按钮到面板 morph。switch 虽已多轮调整，但仍和相邻圆形按钮的设计语言不一致，也需要单独维护轨道、滑块、rim、文字和 overshoot；用户希望统一为与排序相同的展开按钮。同时，深色圆形按钮仍不够通透，浅色模式主要依赖淡边界而不易辨认。

决策：新增通用 `AppGlassMorphSelectionButton<T>`，集中处理 `34px` 圆形触发器、右上角锚定 morph、弹性曲线、选项状态、关闭按钮和点击外部收回。时间线排序、主时间线文章范围、macOS 订阅源详情文章范围全部复用该组件；删除旧 `AppGlassCompactSwitch` 和时间线私有排序 morph。文章范围只含“未读/全部”，触发图标分别为 `filter_alt_rounded` / `filter_alt_off_rounded`，两种状态都不使用橙色：深色固定白色，浅色使用主题 `onSurface`。Android 本轮不改，因其另有大规模界面重构。

材质：深色圆形按钮只在按钮专属 settings 中把 control tint alpha 乘数从旧 `0.86` 降至 `0.52`，有效白色 tint 约 `12%`。浅色圆形按钮采用参考工程的冷白 `12%`、厚度 `12`、blur `5`、`135°` 左上光、light intensity `0.85`、ambient `0.15`、折射/饱和度 `1.2` 和轻微色散；为适配本应用可见性，外部双层阴影略强于参考默认，但继续使用反向路径裁切，不能绘制到半透明按钮内部。没有新增实时背景亮度采样等高成本机制。

后果：header 的范围、排序、同步和文章工具按钮共享圆形材质语言；范围和排序的交互实现也不再分叉。旧 switch 的 `58/42px`、`1px` rim、`5%` 空余轨道等参数只保留在历史证据中，不得恢复为当前规则。以后修改 morph 动画应同时验证排序、主时间线范围和订阅源详情范围；修改圆形按钮材质应同时检查深浅主题、文章目录/复制/已读及同步按钮，并确认浅色阴影没有渗入内部。

## macOS 订阅源侧边栏优先稳定真实滚动范围

背景：用户展开订阅源分类并等待动画结束后，继续上下滚动时 scrollbar 仍会长短剧烈变化并发生位置回跳。原实现用 `ListView.builder`，但每个 item 不是固定的一行，而是一个 view 下全部分类及其展开订阅源组成的大组。不同大组高度差异很大；滑动到尚未构建的大组时，Flutter 会根据新测得高度修正 `maxScrollExtent`，于是拇指尺寸和位置持续变化。分类自身的 `180ms AnimatedSize` 只能解释展开期间的平滑变化，不能解释动画结束后的滚动跳跃。

决策：macOS 侧边栏订阅源区域改用持久的独立 `ScrollController`、单一显式 `Scrollbar`，并在局部关闭框架自动 scrollbar。内容改为 `SingleChildScrollView + Column`，让当前展开状态下的真实总高度在布局时一次确定；分类展开动画、选择、未读计数、自动全文/翻译/静默状态和末尾静默订阅源分组保持原语义。折叠分类继续不构建其订阅源行。

后果：展开/折叠的 180ms 内，拇指随真实内容高度平滑改变是预期行为；动画结束后单纯滚动不应再改变拇指长度或让其逆向跳跃。该结构会一次构建所有分类标题和所有已展开分类的订阅源行，但不会无条件构建折叠内容。若未来确认大量同时展开分类产生性能问题，应先测量并考虑按单行扁平化的稳定 sliver，不能回退为高度差异巨大的粗粒度懒加载 item。

## 浮动玻璃面板使用中性遮罩保证文字对比

背景：macOS 文章目录使用自定义 Liquid Glass 从圆形按钮形变为浮动面板。目录文字按主题使用 `onSurface/onSurfaceVariant`，但玻璃高度依赖下方正文；深色模式下若面板恰好覆盖纯白图片、表格或其他高亮内容，浅色目录文字会完全融入背景。单纯换成更强的 `control` 白色 tint 不能解决该问题，反而会进一步抬高背景亮度。

决策：新增可复用的 `appGlassFloatingPanelScrim()` 语义遮罩，深色模式叠黑色 `32%`，浅色模式叠白色 `18%`。目录 morph 从进度 `0.48` 起以 `easeInOutCubic` 渐入遮罩，目录内容从 `0.82` 后才开始出现，因此文字显示时已经有稳定底色。遮罩位于玻璃和内容之间，只在 morph 面板存在时绘制；关闭静止态继续使用普通 `AppGlassIconButton`，不改变圆形目录按钮的材质。

取舍：不持续采样背景亮度或逐行切换前景色，因为正文背景可能同时包含多种明暗，动态采样会增加渲染成本并可能闪烁；不使用明显文字描边，因为容易形成字幕式观感；不全局加深 `AppGlassTone.control`，避免误伤已验证的按钮、tooltip、菜单和其他面板。

后果：目录保留模糊、折射、边缘与完整形变动画，同时在白色正文内容上保持可读。用户已视觉确认效果良好。以后覆盖任意内容的较大浮动玻璃可以复用该 helper，但需要按组件单独验证遮罩强度和渐入时机，不能把该参数机械应用到所有玻璃控件。

## 来源专属正文兼容集中管理，Hugging Face 作者区使用紧凑语义块

背景：Hugging Face Blog 正文包含作者头像和站点头像堆叠。原网页依靠 Tailwind 类把头像显示为约 `20–48px`，Folo 返回 HTML 时保留类名但不包含对应 CSS；图片标签又没有 `width/height`。通用图片渲染无法从头像文件的固有像素推断网页显示尺寸，因此把头像按正文最大宽度渲染。最初删除头像、只保留姓名虽然解决空间占用，但用户明确希望继续看到作者头像。历史译文还存在直接进入 chunk parser、绕过规范化的分叉。

决策：新增 `ArticleContentCompatibility` 作为窄范围来源兼容层，不在通用图片 widget 中堆来源判断。利用官方稳定的 `data-target="BlogAuthorsByline"` 边界提取作者头像、姓名、账号和主页，转换为项目内部语义标签；parser 将整组生成单个 `authorList` chunk，renderer 用 `36px` 圆形头像和两行文字横向换行展示。作者区之外的 Hugging Face 装饰头像继续删除。原文、旧译文和新译文在展示前统一规范化，不迁移已保存数据。

后果：历史文章重新构建后也会得到紧凑作者区，多作者内容不再被拆成多张全宽图片；普通正文图片、其他来源圆形图片和作者姓名保持不变。作者区外的头像清理必须同时满足 Hugging Face 头像域名/路径和明确的 avatar/rounded-full 语义，不能仅凭 CDN 域名删除图片。后续来源兼容继续集中在该层，以稳定来源标记、域名或明确语义为触发条件并提供反向测试；不要加载整套上游 CSS、解析任意 Tailwind 类、按文章标题硬编码，或退回“所有圆形/小图都是头像”的宽泛启发式。

## 详情页补抓正文必须进入统一自动 AI 调度

背景：用户观察到需要拉取全文的文章点开后经常没有翻译和摘要。只读审计确认后台 `AutoReadabilityWorker` 会在正文处理后调度 AI，但 `ArticleController.fetchReadabilityContent()` 和 Inbox 详情补正文只更新页面并写入本地数据库，没有进入翻译/摘要队列。此外，文章已经打开时后台译文即使完成，详情控制器仍使用初始化时的 `isTranslated/translatedChunks`，视觉上会继续表现为没有译文。审计同时确认自动翻译仍是每个订阅源独立开关，不能把未开启翻译误判为 Worker 故障。

决策：扩展现有 `AutoAiQueueCoordinator`，用 `onArticleContentAvailable()` 统一承接所有“有效正文已持久化”事件。后台 Readability 和详情页两种补抓路径共用该入口；入口读取文章库最新已读状态，只给未读文章排摘要，并按订阅源开关排翻译。Worker 自身继续负责 entryId 去重，后台与详情页并发补抓不会产生重复请求。`TranslationService` 提供轻量记录版本，打开的 `ArticleController` 只在当前文章译文记录变化时异步解析并更新译文块。

边界：自动 AI 只在正文可用并准备入队时检查最新已读状态；入队后不再因已读追踪取消，手动翻译/摘要不受影响。打开文章本身不是绕过已读规则的特权，也不会自动替用户开启订阅源翻译。

后果：正文最初为空或详情页才成功提取长文的未读文章不会再漏过自动 AI；后台译文在页面打开期间完成后可立即显示，无需切换文章。即时刷新路径同样必须先规范化译文，并以原始译文作为去重键，避免来源兼容分叉或被其他文章的记录变化触发重复解析。以后新增正文来源时，应先持久化完整 `ArticleModel`、清理正文规范化缓存，再调用统一协调器，不要直接引用两个 Worker 复制判断。

## macOS 阅读快捷键与空选择焦点归属

背景：用户需要 `B` 打开原文、组合键“确保已读并打开”、`Cmd+0/1/2` 页面导航，以及无文章选中时左右键选择首末篇。最初在各列表页面增加 `HardwareKeyboard` 监听虽然能完成文章选择，但 Flutter 默认焦点系统可能已先把焦点移到侧边栏；此外，`Esc` 销毁文章详情焦点后还会恢复到此前的“全部文章”条目，留下灰色高亮。

决策：使用 `Shift+B`，不占用 macOS 通用的 `Cmd+B` 文本加粗语义。普通时间线的 `Shift+B` 复用双击退场链；垃圾拦截按该页 `M` 语义执行“移除并打开”；已读文章只确保已读，不能反向恢复未读。无选择左右键由应用级 `Shortcuts/Actions` 和页面注册器在默认方向焦点移动前处理，`Right` 取第一篇、`Left` 取最后一篇，输入框和非文章页面不接管。`Esc` 后将焦点明确交给当前页面的不可见空详情节点。

后果：不要把空选择方向键重新下放为页面级全局监听，也不要删除空详情焦点节点。新增常驻 `IndexedStack` 页面时，必须注册/注销激活状态并验证隐藏页面不会抢键；组合动作必须继续复用页面现有的动画、撤销和同步路径。

## macOS 分屏正文暂以阅读进度条替代 scrollbar

背景：右侧正文 header 下方的阅读进度条已经持续显示全文阅读比例，用户长期阅读主要依赖触控板、方向键和文章目录；右侧 scrollbar 提供的信息与进度条大幅重叠，并增加视觉干扰。Scrollbar 的可拖动快速跳转和视口比例仍是独有能力，因此这不是全局 scrollbar 规则。

决策：只移除 macOS 分屏正文 clip 外层的显式 `Scrollbar`，并继续通过局部 `ScrollConfiguration` 关闭 Flutter 自动 scrollbar。保留 `_scrollController`、滚动通知、阅读进度、标题折叠、目录定位、方向键滚动和右下角圆角安全裁剪。时间线、垃圾拦截、设置页、侧边栏和 Android 不改。

后果：正文右侧更安静，布局宽度和滚动手感不应变化，但不再支持拖动 thumb 快速跳转，也不再直接显示当前视口占全文的比例。用户将持续使用观察；若长文导航明显退化，优先恢复这一层显式 scrollbar，或另行讨论进度条的点击/拖动能力，不要为此改写正文 sliver 或目录锚点结构。

## macOS 业务撤销使用有界双栈并接入标准菜单

背景：旧 `UndoService` 只保存一个 `_lastAction`，只能撤销一次，也没有 redo。macOS XIB 仍是 Flutter 模板菜单，包含大量应用不支持的文本命令；改用 `PlatformMenuBar` 后，如果遗漏模板中的 `performClose:`，`Cmd+W` 也会失效。最初把完整动作句子整体截断后，长文章标题还会挤掉真正重要的“标为已读/移除/保留”语义。

决策：使用容量 50 的 `BoundedHistory` 维护 undo/redo 双栈，新业务动作清空 redo。业务历史属于整个应用进程，不因时间线 scope、订阅源、分类或页面导航变化而清空；彻底退出应用后自然消失，不跨启动持久化。`UndoService` 串行处理请求，页面只在 redo 前登记动画，标为已读和垃圾拦截保留/移除继续复用统一数据入口。文本输入焦点优先使用 Flutter 的 `UndoTextIntent/RedoTextIntent`。macOS 菜单使用原生 `PlatformMenuBar`，只保留应用真实支持的六组菜单；系统项使用 `PlatformProvidedMenuItem`，显示/排序状态通过轻量 AppKit channel 设置原生勾选。单篇下一项采用 `撤销“动作” · 《截断标题…》`，动作名不截断；批量动作显示动作名与篇数。`Cmd+W` 在“窗口”菜单显式调用 `windowManager.close()`，保持红色按钮的隐藏窗口语义。

后果：用户能跨页面连续撤销/重做并在操作前看清下一项，但不会看到完整历史栈。不要把页面 State 闭包存进历史项，也不要让 redo 直接绕过列表协调器修改数据库，否则会重新破坏离场动画。新增可撤销业务类型时，应先提供稳定的 `actionName`、集中前向操作和必要的页面动画 preparation；不要仅在菜单中拼一条句子。当前历史范围不自动扩展到所有设置、导航或文本操作。

## 静默订阅源批量导出以导出成功为读状态提交边界

背景：静默订阅源汇总中需要批量挑选文章，并复制或保存 Markdown；组合动作还要把同一批文章标为已读。用户要求勾选不能妨碍点开卡片确认内容，也不希望再加入一套与当前文章选中态冲突的卡片外框。导出失败、取消文件选择或远端只完成半批时，绝不能留下难以理解的部分已读状态。

决策：批量模式只存在于 macOS 静默订阅源汇总 scope，默认空选；卡片右上角叠加独立标识，卡片主体继续阅读。单篇复制与批量导出统一复用 `ArticleMarkdownExportService`，按当前列表顺序用 `---` 分隔，不加批次总标题，不联网补正文。四个动作固定为复制、保存及各自的“并标为已读”版本。组合动作先完成导出，再通过 `UndoService.markBatchAsRead()` 提交整批读状态；本地只做一次批量列表更新和一次全局通知。`BatchReadSyncService` 按文章记录前向成功、补偿成功和最终改变集合：分块失败后补偿已确认成功的请求，补偿全部成功则本地与历史不变；补偿仍有失败则仅同步最终改变的子集，并为该子集建立批量历史。完整成功的整批在 50 项历史中只占一项；部分 Undo/Redo 会把已完成与未完成子集拆到 redo/undo 两侧。

后果：纯导出保留选择，组合动作完整成功后退出并清空详情；完整补偿后的失败不改变本地状态，补偿不完整时 UI 明确提示部分成功并保留未读项供重试。批量撤销菜单显示篇数而不是随意挑一篇标题。这里的“最终远端状态”指 API 成功响应能够确认的结果；网络中断后服务端是否处理了无响应请求无法绝对证明，但后续刷新仍会按既有本地覆盖规则收敛。若未来增加别的批量动作，必须沿用“外部副作用成功后再提交业务状态”的边界，并明确一批是否应当是一个原子撤销项；不要逐篇调用单篇时间线更新造成 N 次过滤和动画。
## Android 复用文章级图片预取并限制批量范围

背景：macOS 文章级图片预取已经稳定运行，Android 仍使用旧 `v2_<url>` 显示键，只在用户打开文章后下载图片。用户希望 Android 同样提前缓存，但移动设备不适合照搬 macOS 的并发和无限未读范围；用户明确无需区分 Wi-Fi 与移动网络，流量紧张时会自行连接 Wi-Fi 后使用。

决策：Android 直接复用 `ArticleImageCacheService` 的队列、文章级缓存登记、当前文章提升和已读后清理，不复制第二套服务。平台参数集中在 profile：Android 并发 `4`、当前文章优先 `2` 张、每篇 `4` 张，刷新批量范围限制为时间线前 `50` 篇本地未读文章；恢复未读的单篇文章可以直接重新入队。macOS 参数与范围保持不变。两端都跳过明显动图，旧 `v2_` 缓存不自动迁移或清理。

后果：Android 刚刷新后打开前部未读文章时可直接命中文件缓存，同时后台任务总量有明确上限；正常打开文章仍能加载超出预取上限的其余图片。不要在页面层复制 Android 队列，也不要把并发降低误当成流量上限；若未来需要网络类型策略，应在共享服务入口集中增加。

## Android 按能力边界类比 macOS 设计语言

背景：macOS 已经形成玻璃控制色、紧凑 switch、文章工具按钮和轻量密集列表等设计规则，但 Android 长期保留旧移动布局。用户希望两端视觉和交互能够类比，同时不复制苹果第一方专属效果，也不把 macOS 曾出现过的列表玻璃性能问题带到手机端。

决策：纯 Flutter 组件和状态规则跨平台复用，包括 `AppGlassSurface`、移动端文章范围按钮、移动底部面板以及翻译/摘要语义；`NSGlassEffectView`、窗口后方取样和红黄绿等 AppKit 能力继续隔离。固定、低数量浮动控件可使用 Flutter 模糊玻璃，文章卡片等密集元素继续使用轻量 `ArticleCardChrome`。Android 主导航改成图标式悬浮胶囊，最近阅读移入订阅源二级入口；目录、文章范围与订阅源设置共用 `AppMobileGlassSheet`。物理屏幕圆角的同心参数等整体几何稳定后再从目标设备反推。

后果：两端共享设计语言和业务语义，但允许不同密度参数与平台能力。Android 设置页、任务中心和次级页面后续已按该边界完成迁移，没有复制 macOS 原生 renderer 或在密集列表上增加重型玻璃。

## Android 次级页面与目标设备圆角收敛

背景：Android 主流程迁移后，设置页仍保留旧 Material dropdown，任务中心和空态继续混用旧样式；底部导航最初为 `48px` 高、`24px` 半径并由 `SafeArea` 动态抬高，无法和已经视觉确认的 `8px` 边距、`32px` 圆角底部面板形成稳定的同心关系。普通移动 header 继续使用默认 `56px` 工具栏，也显得偏高。

决策：设置与任务中心使用 `12px` 页面边距和轻量静态面板，离散选择统一由 `MobileSettingsSelectField<T>` 打开 `AppMobileGlassSheet` 并选择即保存；普通次级页面复用 `48px` 的 `MobileBlurAppBar`。底部面板的 `8 + 32 = 40px` 等效外圆角作为目标设备视觉基线，底部导航改成四周 `12px` 边距、`56px` 高和 `28px` 连续半径，使圆角中心同样落在约 `40px`；外阴影必须同步使用 `28px` 路径。底栏外壳固定在 edge-to-edge 内容边界，不让 `SafeArea` 动态移动整块几何。

边界：订阅源详情包含头像和双行标题，保留专用 `68px SliverAppBar`；文章阅读和全屏媒体保留专用 header。Android 无可靠 API 返回物理屏幕圆角，当前导航参数只代表目标设备上的视觉确认，不建立按机型硬编码。设置选择字段的浮动标签会越过边框上缘，外层只能约束点击形状，不能裁剪整个 `InputDecorator`。

后果：Android 五阶段设计迁移完成，底栏、底部面板和目标设备外框获得近似同心关系，普通 header 更紧凑。换用明显不同圆角或三键导航设备时只需重新验证外壳位置和系统手势，不应因此回退到全局 `SafeArea` 或复制另一套设置控件。

## Android 文章范围使用圆形按钮并统一卡片字级

背景：Android 设计迁移分支仍用 `AppGlassCompactSwitch` 表达“未读/全部”，主时间线和订阅源详情还各自维护一份延迟清除的临时视觉状态。该组件已在 macOS 淘汰，继续保留会让两端分别维护轨道、滑块和选择同步。Android 卡片标题仍为 `16px`、辅助正文 `13px`，也没有跟进此前已经稳定的桌面卡片字级。

决策：删除 Android 对旧 switch 的依赖，主时间线和订阅源详情复用 `MobileArticleRangeButton`。触发器是 `36px` 圆形按钮，点击后由 `AppMobileGlassSheet` 明确选择“未读/全部”；组件只接收真实状态和回调，不保存延迟视觉副本。触发图标两种状态都使用主题 `onSurface`，不用橙色重复表达选中；面板内选项仍使用橙色强调当前值。主 shell 的右侧搜索入口同样改用 `36px` `AppGlassIconButton`，与左侧范围按钮分别保持 `12px` 边距。普通时间线和垃圾拦截卡片统一使用 `ArticleCardChrome` 的 `14px` 标题和 `12px` 辅助正文，先与 macOS 对齐后再根据真机视觉反馈调整。

后果：文章范围的业务语义和入口外观集中维护，不再因“未读”状态单独变成橙色；已读文章仍通过最近阅读等独立页面访问。左右 header 工具保持同尺寸和对称边距，而不为搜索复制新外壳。Android 字体变得更紧凑，需要重点验证手机可读性；后续若调整字号，只改共享 token，不在普通卡片和垃圾拦截分别覆写。

## Markdown 导出从文章页面提取为共享服务

背景：复制原文的 HTML/chunk 到 Markdown 转换最初完整定义在 `article_page.dart` 内。静默订阅源批量复制和保存开始开发后，继续从时间线依赖文章页面内部 exporter，或再复制一份转换代码，都会让标题去重、元数据、表格、列表、代码块和转义规则发生分叉。

决策：将转换集中到 `ArticleMarkdownExportService`。单篇入口接收页面已经解析的 `ArticleModel + HtmlChunk`；批量入口接收文章快照，在 isolate 中规范化并解析各篇正文，按当前顺序用 `---` 分隔。正文尚未缓存时仍输出标题、来源和原文链接，并增加明确提示。文章页面只保留剪贴板交互和用户反馈；时间线批量功能只能调用 service，不能反向 import 页面或新增另一套 exporter。

后果：单篇与批量导出的 Markdown 规则只有一个维护点。批量功能合入时应把测试直接指向 service，并覆盖正文缺失、顺序、标题去重、表格、列表、代码块和链接转义；不要为了测试 exporter 而 import 整个文章页面。

## 发布只允许从 main 创建并迁移到 Node 24 Actions

背景：旧 `release.sh` 会在当前任意分支创建版本提交和 annotated tag，但推送时固定执行 `git push origin main` 后再单独推 tag。在功能分支误运行时，tag 可能包含尚未合入主线的代码。发布脚本还会继续向已经解体完成的根 `AGENT_HANDOFF.md` 追加足迹。与此同时，工作流使用的 `actions/*@v4` 已进入 Node 20 淘汰期。

决策：脚本在修改文件前强制确认当前分支精确为 `main`，非 main 和 detached HEAD 均立即失败；版本号、干净工作区、annotated tag 和 release notes 规则保持不变。发布可复现命令追加到 `docs/agent_handoff/history/releases.html` 的内嵌 Markdown（Wiki 页面体系迁移前为 `releases.md`，脚本落点随迁移同步更新，行为不变）。GitHub-hosted workflow 更新到 Node 24 对应的 `checkout@v7`、`setup-java@v5`、`upload-artifact@v7` 和 `download-artifact@v8`；当时保留 Flutter `3.41.6`、Java 17、Android 签名、`macos-26` 和 arm64 校验，Flutter pin 后续由独立工具链迁移决策更新。`setup-java@v5` 自身使用 Node 24；不存在的 `@v6` 曾导致 `v1.2.0` 首次触发时 Android 在 job 初始化阶段失败，因此不要根据其他 actions 的主版本机械推导该 action 的版本号。

后果：功能分支不能直接触发正式发布，根交接入口不会再次随 release 增长。Actions 升级已通过本地 YAML、脚本、analyze 和测试检查，但只有下一次用户明确允许的 tag 构建才能验证远程 action 运行时；届时必须同时确认 Android、macOS arm64 和 GitHub Release 三个阶段。

## Android 审核横滑背景绕开 Dismissible 的矩形裁剪

背景：Android 垃圾拦截需要让保留/移除颜色精确填充圆角卡片横移后真实让出的区域。最初把圆角路径差集作为 `Dismissible.background/secondaryBackground`，随后又给整个组件补了同半径 `ClipRRect`；两次修改都无法消除彩色背景与移动卡片交界处的直角。Debug 检查点确认组件宽高、`16px` 半径、设备像素比、滑动进度和计算位移始终同步，问题不是配置、漏合并或状态更新滞后。

决策：保留 `Dismissible` 的手势、阈值、确认回调和卡片位移，但不使用它的背景槽位。Flutter 内部会用矩形 `_DismissibleClipper` 把背景限制在已让出的矩形条带，该矩形会截掉移动卡片圆角伸向彩色区域的弧线。当前改为固定圆角 `ClipRRect > Stack`：下层根据位移方向绘制 `_ReviewSwipeRevealClipper` 的圆角路径差集，上层无背景的 `Dismissible` 只移动卡片。外层、固定路径和移动路径统一复用 `ArticleCardChrome.radius`。

后果：Android 真机已确认外侧圆角与移动交界圆角同时正确，滑动阈值和保留/移除业务行为不变。以后调整审核横滑时，不要把动作背景放回 `Dismissible.background/secondaryBackground`，也不要误以为单独增加 `ClipRRect` 能修复内部交界；若升级 Flutter，应先检查 `Dismissible` 是否仍使用矩形内部 clip，再决定是否可以简化该结构。

## Flutter 3.44.6 与 macOS 纯 SwiftPM 工具链

背景：本机升级到 Flutter `3.44.6` 后，Flutter 自动为 macOS 工程加入 `FlutterGeneratedPluginSwiftPackage` 和 scheme prepare pre-action，同时给 Android 增加 `android.builtInKotlin=false`、`android.newDsl=false` 兼容开关。仓库 CI 仍固定 `3.41.6`，且传递依赖 `screen_retriever_macos 0.2.0` 不支持 SwiftPM，导致本机落入 SwiftPM + CocoaPods 混合模式并持续输出未来将升级为错误的兼容警告。全部插件升级兼容后，Flutter 又明确提示旧 Podfile 会继续触发无意义的 `pod install`。

决策：正式采用 Flutter `3.44.6`，在 `pubspec.yaml` 声明 Flutter `>=3.44.0`、Dart `^3.12.2`，并同步更新 Android/macOS 两个 GitHub Actions job。只定向升级 `screen_retriever` 家族到 `0.2.2`；随 Flutter SDK 解析变化接受 `meta 1.18.0` 和 `test_api 0.7.11`，不扩展到其余可升级依赖。macOS 使用 `pod deintegrate` 移除 Pods frameworks、build phases、xcconfig 与 workspace 引用，删除 Podfile/lock；原 Podfile 唯一自定义的 `10.15` deployment target 已由 Xcode 工程三个配置和 Swift package manifest明确覆盖。旧 `COCOAPODS_PARALLEL_CODE_SIGN=false` 同步删除，debug library validation 与 `ENABLE_DEBUG_DYLIB=NO` 保持原样。

后果：macOS 插件现在全部由 SwiftPM 生成包管理，构建不再运行 CocoaPods；本地 Android Debug、macOS Debug 和 macOS Release 均通过，Release 主程序为 arm64。以后升级 Flutter 时必须同时维护 pubspec 最低约束、lockfile 和 CI pin；若日志重新出现 `Running pod install`，应视为 CocoaPods 集成被误恢复。下一次 tag 仍需在 GitHub `macos-26` runner 上验证 SwiftPM、arm64 和 Release 上传全链路。

## Android 垃圾拦截进入主导航并保留重叠计数

背景：Android 垃圾拦截长期通过主时间线顶部“AI 智能过滤”卡片或后台任务二级入口打开，和 macOS 的一级导航地位不一致。用户认为手机端把审核作为底部导航入口更符合直觉，并希望时间线和垃圾拦截图标分别显示数字角标。

决策：Android 主导航扩展为时间线、垃圾拦截、订阅源、设置四项，继续使用同一个悬浮玻璃胶囊和淡入淡出常驻页面。垃圾拦截增加嵌入模式，复用主 shell 的 `MobileBlurAppBar`，列表顶部显式避让 AppBar 且底部避让导航；独立路由继续保留。删除时间线顶部重复审核卡片，后台任务“去审核”返回主 shell 后切换到索引 `1`。时间线角标使用非静默订阅源未读总数，垃圾拦截角标使用 `isRejectedByAi && !isRead`，零值隐藏且超过 `99` 显示 `99+`。

边界：用户明确要求保留既有文章流转。被 AI 拒绝、尚未人工处理的未读文章仍留在普通时间线，同时出现在垃圾拦截，因此同一文章可以同时计入两个角标。这不是统计错误，也不要擅自改成互斥队列。Android 索引 `2` 现在是订阅源，而 macOS 索引 `2` 仍是最近阅读；跨平台导航代码不得假定两端页面数组完全相同。

## Android 文章悬浮工具使用局部可变字重图标

背景：Android 文章页右下角 `48px` 玻璃按钮中的目录、标为已读和恢复未读图标原为 `22px` 固定字重 Material Icons。图标颜色已经完全不透明，可见性不足来自笔画偏细；只放大图标不能真正解决字重问题，而为少数按钮更换实心图标又会破坏三种状态的一致性。

决策：加入 `material_symbols_icons 4.2951.0`，这三个状态统一使用 Rounded Material Symbols、`24px` 和最大标准字重 `700`。`AppGlassIconButton` 只新增默认空值的 `iconWeight` 参数，文章页 Android 悬浮按钮显式传入，其他按钮和 macOS 不变。定向 widget 测试验证可变字重透传。

后果：右下角图标在保持 `48px` 外壳、原位置、颜色和点击范围的前提下更清晰。不要把 `700` 设为 `AppGlassIconButton` 全局默认值，也不要用重复叠画或阴影模拟粗体；后续若替换图标依赖，应继续保证目录、已读和恢复未读属于同一 Rounded 字体体系。

## 来源上下文进入正文规范化，窄兼容与通用渲染分层

背景：AddyOsmani.com 的文章正文包含相对 SVG 地址，旧规范化没有原文 URL，因此解析器把图片视为无效地址；MarkTechPost 大量文章残留依赖网页 JavaScript 的 `Copy Code` 控件，少量交互式 explainer 还会因 Folo 丢失 `srcdoc` 边界而把整份内嵌文档展开成正文。与此同时，阿里技术超长文章中的畸形列表能让 Markdown 转换把同一列表 HTML 反复递归，最终阻塞 UI 并栈溢出。

决策：`ArticleContentUtils.normalizeHtml()` 显式接收文章原文 URL，先按 URL 解析相对图片，再交给原有安全校验和代理规则；正文、翻译/摘要输入、过滤、后台预取和批量导出都传递同一上下文。SVG 使用 `ArticleSvgImage` 从文章级磁盘缓存加载并由 `flutter_svg` 渲染。来源兼容继续集中在 `ArticleContentCompatibility`：Hugging Face 规则保持原行为；MarkTechPost 只按明确 host 移除稳定 ID 的失效复制控件，并且只有在 `Interactive Explainer` 后检测到残留 `<title>` 时才替换泄漏尾部。代码块由通用 renderer 提供轻量复制按钮。Markdown 单篇转换移入 isolate，畸形列表无直属项时退化为文本而不递归。

后果：相对图片和 SVG 的修复不需要站点专属 URL 拼接，MarkTechPost 的兼容不会污染其他来源，普通代码块在所有来源都得到一致复制能力。OpenAI News 无资源地址的动态音频仍无法从当前数据恢复，继续作为已接受源内容边界；不得把本决策扩展为执行任意 srcdoc/脚本、按标题硬编码或引入 JSON/YAML 动态 DOM 规则语言。

## 共享权威订阅目录与单层来源返回

背景：运行期间在 Folo 官方客户端新增订阅后，Auto Folo 刷新能拉到新文章，却无法在侧边栏看到新订阅。时间线只在首次加载时建立 feed mapping，侧边栏则独立请求并把新结果与旧缓存永久合并，因此刷新链路不统一，取消订阅也会残留。另一方面，macOS 从文章来源进入具体订阅源会直接清空当前文章，`Esc` 无法回到跳转前的阅读位置。

决策：引入 `SubscriptionCatalogService`，由时间线和侧边栏消费同一份目录及同一个并发合并的同步任务。普通订阅与 Inbox 各自把成功响应视为分区权威快照，失败分区保留缓存；目录变化不删除历史文章和 feed 级设置。来源跳转由时间线页面保存一层临时导航上下文，包括原 scope、文章、两栏滚动位置和正文显隐状态；`Esc` 按既有交互优先级恢复，手动切换其他 scope 时作废。

后果：跨客户端增删订阅在下一次启动或手动刷新后同步到侧边栏和文章 feed mapping，不再依赖重启，也不会因单个接口失败误删另一类来源。来源返回不是通用导航栈，也不进入业务 Undo/Redo；当前只服务 macOS 分栏中的文章来源跳转，避免把一次轻量返回扩展成难以维护的任意历史导航。

## 公开仓库使用中性的默认过滤 Prompt

背景：过滤 Prompt 最初从个人配置裁剪而来，包含特定 AI 子领域取舍、来源白名单、媒体特例和“宁可错杀”等个人阅读偏好。它不属于隐私，但作为公开仓库的新安装默认行为会让使用者误以为这些偏好是产品通用规则。摘要和翻译 Prompt 本身没有同类问题。

决策：只替换代码内的默认过滤 Prompt，改为保守的通用内容质量审核：仅过滤明确的空正文、网页模板、抓取损坏、纯广告或标题正文严重不符；主题、领域、立场和来源不作为默认过滤条件，不确定时保留。个性化能力继续通过设置页保存和配置备份导入实现。

后果：`filter_prompt`、`summary_prompt`、`translation_prompt` 的持久值继续优先于代码默认值，因此已有安装和已导入配置不会被本次调整覆盖；只有从未保存该项或用户主动点击“重置此 Prompt”时才使用新默认。Android 与 macOS 共用 service 和存储，不需要平台迁移。卸载应用并清除数据后仍需重新导入备份，这是本地存储生命周期，不应通过把个人 Prompt 写回代码解决。

## 公开仓库采用 AGPL-3.0-only 并集中保留必要声明

背景：仓库长期公开但根目录没有许可证，法律意义上不能清晰地允许他人使用、修改和分发。工程实际包含来自 Folo、PiliPlus、Flutter、interactiveviewer_gallery、liquid_glass_widgets 和 liquid_glass_renderer 的代码；本地参考目录本身不进入 Git，单纯调研过但未采用代码的项目不应被列成贡献者或参考来源。

决策：Auto Folo 项目整体采用 `AGPL-3.0-only`，根目录保留标准 `LICENSE`；`THIRD_PARTY_NOTICES.md` 只列实际进入仓库且需要保留授权声明的第三方项目，完整许可证文本集中在 `third_party/licenses/`。许可证文件作为 Flutter asset 注册，Android 和 macOS 设置页的“关于”区域提供统一的“开源许可证”入口。README 只保留主许可证和第三方声明链接，不强调个人原创代码或个人版权，不公开 AI 辅助开发过程，也不维护泛化的参考工程致谢清单。

后果：发布的 APK 和 macOS 应用可直接查看主许可证、第三方声明及 Flutter 依赖许可证；源码仓库和二进制分发使用同一套声明。后续复制或移植新的第三方源码时必须同步补充许可证；仅参考交互思路而没有采用源码时不要随意增加声明，避免错误归因。

## 版本号从连续 Patch 调整为阶段化语义

背景：`v1.1.1` 到 `v1.1.28` 几乎每次发布都只增加 Patch，但其中已经包含 Liquid Glass、Android 设计迁移、包名迁移、Undo/Redo、批量导出和媒体能力等明显的新功能或阶段性重构。旧编号能够区分安装包，却不能继续准确表达改动规模。Flutter 当前通过 `pubspec.yaml` 的 `X.Y.Z+N` 同时驱动应用显示版本、Android `versionName/versionCode`、macOS bundle 版本和 release tag，其中构建号已经保持单调递增。

决策：保留 `pubspec.yaml` 为唯一版本来源和 `vX.Y.Z` annotated tag，不改写历史版本。以后 Major 只用于无法平滑迁移的产品、数据或核心工作流不兼容；Minor 用于新功能、新工作流或兼容的阶段性重构；Patch 只用于修复、性能与小范围体验完善；构建号每次发布加一且永不因 Major/Minor/Patch 变化而重置。当前先保持 `1.1.28+30` 观察稳定性，若没有插入其他发布，下一次进入 `1.2.0+31`。

后果：版本号不再等同于单纯的发布次数，功能阶段可以从 Minor 直接识别。当前 release 脚本和 CI 仍只支持纯 `X.Y.Z`，因此暂不使用 `-beta.N`；未来若启用预发布版本，必须先完整更新脚本、pubspec/tag 校验、Actions 和 GitHub Release 标记，不能临时手写一个带后缀的 tag。

## Android 导航选中态与未读角标分离

背景：Android 底部导航原本用大面积橙色胶囊背景和白色图标表达选中，未读角标又紧邻该区域。先后试过错误色容器、主题色容器和随选中状态变化的中性角标，都让角标与橙色背景混色或显得语义不清。用户希望保留明确的红色通知角标，同时降低选中背景与角标竞争。

决策：导航外壳、页面切换、点击范围和缩放动画不变；选中项只从灰色线框图标切换为主题橙色实心图标，不再绘制持久橙色底板。未读角标固定使用集中语义色 `AppSemanticColors.unreadBadge = #DB4A3E` 与白字，取消外圈边框，也不随选中状态变化。该颜色不能替换全局 `ColorScheme.error`，避免影响失败提示等真正的错误语义。

后果：选中状态、未读状态和玻璃导航外壳各自只占一层视觉职责，红色角标不会再和大面积橙色背景重叠。以后调整角标颜色只改语义 token，不在导航组件中散落固定色；不要重新增加选中胶囊或为角标套玻璃效果。

## 卡片与排序共用跨平台渲染高度估算

背景：用户希望在 Android 与 macOS 文章卡片上直接比较篇幅，并要求两端数值相同或接近。字数会忽略图片、表格和视频，页数或阅读分钟又需要额外先验；现有长文/短文排序已经有基于解析后 chunk 的预计渲染高度，但过去只用于排序。

决策：排序和卡片显示继续共用 `ArticleLengthEstimator`。估算固定使用 `340 logical px` 阅读宽度，计入标题、正文、图片和其他既有渲染块，不读取设备、窗口或像素比；内容签名缓存保证重复构建不重复解析，正文变化时自动失效。小于 `1000` 显示整数 `px`，更长显示一位小数 `k px`。共享 `ArticleLengthLabel` 放在订阅源行右侧；普通 `ArticleCard` 同时覆盖 Android/macOS 的时间线、订阅源、最近阅读、静默、搜索和 Android 审核，macOS `_MacReviewRow` 单独接入同一组件，后台任务卡片不显示。

后果：相同文章数据在两端得到相同可比较数值，窗口缩放不会改变标签或排序；某端完成 Readability 全文补抓而另一端尚未完成时，数值不同是实际正文不同的合理结果。不要改为真实布局测量，也不要在平台页面复制估算、格式化或缓存逻辑。

## YouTube 与 Bilibili 共用自定义播放壳并保留官方回退

背景：官方 YouTube/Bilibili iframe 可以降低取流实现成本，但控制栏、空格快捷键、触控板文章滚动、全屏和视觉风格无法与 Auto Folo 的普通视频稳定对齐；YouTube 还出现过 embed 错误和全屏命中分叉。用户引入自定义播放器的目标不是单纯“能播放”，而是让 macOS 与 Android 的基础播放体验尽可能一致，同时保留分辨率、字幕和 Bilibili 弹幕等来源能力。直接为两个来源各复制一套 WebView 控制器会让快捷键、loading、滚动桥和回退语义再次分叉。

决策：两个来源首选仓库内可复现构建的 Shaka 网页运行时，并共用 Flutter `ShakaEmbedPlayer` 负责懒加载 WebView、35 秒超时、播放快捷键归属、macOS 触控板文章滚动桥、系统元素全屏、loading 和失败回退。YouTube 继续使用 YouTube.js + googlevideo SABR，并在 SABR 失败后先尝试普通自适应 DASH；Bilibili 只在用户点击后调用匿名详情/播放/字幕/弹幕接口，生成本地 DASH/VTT，每种实际可用画质选择 AVC 轨和一条普通音轨，弹幕在同一页面 Canvas 中按视频时间绘制。两个平台分别使用严格的 loopback 能力路径、目标域名/session 白名单和流式媒体代理，不能合并成任意 URL 代理。任一首选链失败时自动重建为对应官方 iframe，不把内部接口视为稳定公开 SDK。

后果：播放、暂停、进度、音量、设置、全屏、空格/媒体键和文章滚动只维护一套基础交互；平台 wrapper 仅准备 URI、缩略图/占位和官方回退。应用运行不依赖 Node.js，生产资产固定在 `assets/embed_video_player/`，可复现源码和锁文件在 `tool/embed_video_player_runtime/`。YouTube macOS 基础体验已由用户验证；Bilibili 以及 Android 两个平台仍需真实视频、画质、字幕、弹幕、滚动和全屏检查。以后调整共同控制体验应优先修改共享运行时/`ShakaEmbedPlayer`，但 API、解析器、代理白名单和官方回退必须继续按来源隔离；不要删除懒加载或在文章初始渲染时预取媒体。

## Folo 登录采用官方浏览器交接与单一活动账号重建

背景：Auto Folo 过去只允许用户手工填写长期 Session Token，缺少普通登录入口。Folo 最新官方 CLI 已提供稳定的系统浏览器登录协议：本机启动随机 loopback callback，官方网页完成账号、验证码、2FA 或社交登录后返回一次性 token，再换取长期会话。与此同时，Auto Folo 的文章、订阅目录、AI 结果、阅读历史、图片缓存和后台队列都使用全局本地存储，并未按账号隔离；直接替换 Token 会把两个账号的数据混在一起。

决策：macOS 使用对标官方 CLI 的系统浏览器 + localhost callback。Folo 官网在异步生成 CLI 回调期间仍会显示会唤起官方客户端的通用“打开 Folo”按钮；Auto Folo 不接管官方 deep link，而是在等待框中说明无需点击，并在 localhost 回调验证成功后立即后台完成登录，不等待应用重新获得焦点。Android 的移动 `/login` 页面会跳官网，桌面 UA WebView 又会被 Google 以“不安全的浏览器或应用”拒绝，Chrome 的“桌面版网站”设置也不会从重定向后的 `folo.is` 作用到原始 `app.folo.is`，三者均不再使用。Android 改为动态读取 Folo providers：Google、GitHub 等社交方式复用官方移动端的 Better Auth Expo 浏览器协议，Email 使用账号密码 API 并支持 TOTP；Apple 与官方 Android 一致排除。社交流程经 expo authorization proxy 在真实浏览器中保持 OAuth state，并用只匹配 `folo://autofolo-auth` 的 intent filter 接收 Session Cookie；Flutter 默认 deep-link navigation 必须关闭，以免与 MethodChannel 双重消费。它不宽泛接管整个 `folo://`，但自定义 scheme 仍不具备 HTTPS App Link 的所有权保证。继续保留手动长期 Session Token 与 version 1 配置备份；所有候选 Token 在覆盖前必须经 `/better-auth/get-session` 验证。产品只维护一个活动账号，不建立本地多账号档案；只要 Token 实际变化，就统一清理账号内容并从服务器重建。退出是本地断开，不请求远端 sign-out，也不让已导出的长期 Token 失效。

后果：普通设置、DeepSeek Key、Prompt、模型参数、外观和 feed 偏好始终保留；文章、订阅缓存、已读覆盖、阅读时间、摘要、翻译、审核结果、正文/图片缓存、待同步队列和 Undo/Redo 清理。旧异步任务通过会话 revision 和图片 generation 防止迟到写回。用户已明确不要求恢复本机阅读时间、已读旧文章、AI 结果、审核结果和缓存，并假定切换前的业务操作已同步到 Folo。以后若要保留多账号离线内容，必须另行设计账号命名空间和数据迁移，不能在当前全局 box 上堆条件分支。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要在收到浏览器一次性 token 后直接存储；必须先交换成长期会话并验证。
- 不要在配置导入后才验证 Token；无效备份不能先清理当前账号。
- 不要把“本地退出”改成远端 sign-out，除非同时重新讨论旧配置备份恢复语义。
- 不要只清 Hive box 而忽略运行中的网络、AI 和图片任务；迟到写回会重新造成账号污染。
</details>

## 带浮动标签的设置输入控件上方必须为裁切容器预留缓冲

背景：Android 设置页 `MobileSettingsSelectField<T>` 用 `InputDecorator` + `OutlineInputBorder` + `labelText`（如 LLM 卡片里的“模型”）。`OutlineInputBorder` 的浮动 label 中心对齐顶部边框线，上半部分会向上越出输入框自身布局框约 `labelHeight/2 × 0.75`（默认 16sp titleMedium 下约 `8.6px`）。之前已经修过一轮字段自身的裁切：`MobileSettingsSelectField` 本身不再用 `clipBehavior` 包裹 `InputDecorator`，外层只约束点击形状（见“Android 次级页面与目标设备圆角收敛”的边界说明）。那一轮没有覆盖字段被放进 `ExpansionTile` 后由上层容器引入的新裁切点。

用户反馈“翻译 LLM 参数”展开后第一个下拉框左上角“模型”两字的上半部分被切掉。根因不在字段本身，而在 `_LlmConfigCard` 的展开容器：`ExpansionTile` 内部（`widgets/expansible.dart`）对 body 用 `ClipRect` 包裹，外层 `MobileSettingsPanel` 又是 `clipBehavior: Clip.antiAlias`，而原 `children` 的 `Padding` 是 `fromLTRB(16, 0, 16, 16)`，顶部为 `0`，浮动 label 向上越出的约 `8.6px` 直接被这两层裁切。

决策：`_LlmConfigCard` 的 `ExpansionTile` children padding 顶部从 `0` 改为 `10`，给浮动 label 预留显示空间。这是卡片布局层的调整，不触碰已经稳定的字段层实现。

排查结论（供后续判断同类风险）：同类裁切必须同时满足三个条件——控件用 `OutlineInputBorder` + `labelText`；外层是会裁切的容器（`ExpansionTile` 内部 `ClipRect`、`MobileSettingsPanel` 的 `Clip.antiAlias` 等）；控件上方紧贴容器顶部且缓冲 `< ~9px`。全工程排查后，满足这三个条件的只有 `_LlmConfigCard`（翻译/摘要/过滤三卡复用同一组件，一并修复）。`AppGlassTextField` 用独立 `Text(label)` 作为固定标题且输入框为 `InputBorder.none`，没有浮动 label 机制，macOS 端从根本上免疫。`_PromptConfigCard` 虽有同样的 `top=0` padding，但其 `TextField` 只有 `hintText` 无 `labelText`，不产生浮动 label。其他安卓 `MobileSettingsPanel` 调用点 padding 均为 `EdgeInsets.all(16)`，顶部有 `16px` 足够容纳 `8.6px` 上溢。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要把 `_LlmConfigCard` 的 children padding 顶部改回 `0` 或任何 `< 9` 的值。
- 不要为了“统一”给 `MobileSettingsSelectField` 或 `InputDecorator` 本身加 `clipBehavior`，那会重新引入已修复的字段层裁切。
- 以后在安卓端新增带 `labelText` + `OutlineInputBorder` 的控件时，若它会被放进 `ExpansionTile` 或其他 `Clip.antiAlias` 容器，必须确保控件上方有 `≥ 9px` 的非裁切缓冲；放进普通滚动列表或 padding `≥ 16` 的面板则不受影响。
</details>

## 图片加载失败的重试统一收敛到 ArticleImageCacheService

背景：正文独立块级图片失败时，旧实现只有 `_ArticleInlineImage` 里 `_retryCount++` 加 `?retry=N` 的手动点击重试，没有上限、没有退避、没有自动重试；后台预取 `_download` 失败则直接 `catch (_) {}` 静默吞掉。用户反馈"点一下重试就能加载出来"，说明失败多为偶发临时错误，但用户必须手动点。同时全局刷新只重新解析未读文章抽图，完全不重扫之前失败的图片。

前期调查曾误判"独立图片块没走 `toProxiedUrl` 代理"，经验证 `HtmlChunk.normalizedImageUrl`（`html_chunk_parser.dart:63-66`）已经调用了 `toProxiedUrl`，`_ArticleInlineImage` 用的正是该值，代理 URL 问题不存在，无需修复。

决策：把下载和重试的唯一所有权收敛到 `ArticleImageCacheService`。正文独立块级图片和后台预取的失败都经 `recordFailure` 登记；`ArticleImageRetryScheduler` 只负责按 cache key 管理 `1s/2s/4s` 三次一次性退避计时器、次数上限和取消操作，真实下载仍由 service 队列执行。下载失败后必须先从 `_runningKeys` 释放，再安排下一次退避，否则幂等保护会把合法的后续重试误判为重复任务。重试任务使用 `forceNetwork` 清除失败缓存后重新请求；若同一图片已在普通预取队列中，重试任务会升级已有任务而不是再插入一份。

前台与后台的交互设计（关键）：正文通过每张图片自己的 `ValueListenable<ArticleImageRetryState>` 观察 `retrying` 和 `successRevision`。错误 builder 只在当前 frame 结束后向 service 报告一次失败，不在 build 期间修改通知器。service 退避等待、排队或下载时占位显示「重新加载中…」且不可点击；三次耗尽后显示「图片加载失败，点击重试」。成功后 service 清除失败记录并只递增该图片的 `successRevision`，用新的 widget key 精确重建这一张图片并读取已经填充的缓存，不调用会刷新时间线等无关消费者的 `ArticleStateNotifier`。手动重试也只调用 service，不再同时给 URL 加 `?retry=N` 让 `CachedNetworkImage` 发起第二条请求，从而避免双下载及两条结果互相矛盾。独立块级 SVG 通过 `ArticleSvgImage.onError` 进入同一状态闭环。

持久化与清理：失败 URL 集合落盘到 `localCache`（`articleImageFailedKeys:<id>`），退避次数只在内存存活。`TimelineController` 必须先 `await ArticleImageCacheService.refresh` 完成已读缓存核对与清理，再调用 `retryFailedPrefetches` 重扫落盘失败，不能并行 `unawaited` 两条链。全局重扫会取消旧计时器、清零本轮次数并去重入队。文章缓存正式删除前，必须同步移除其排队任务并取消所有退避状态，防止清理期间计时器再次把同一图片放回队列。

边界：不依赖错误类型区分永久/临时失败，因为 `flutter_cache_manager` 抛出的异常类型不稳定；统一用退避次数控制，三次后停止并保留失败记录等待刷新或手动重试。本次覆盖独立块级普通图片和 SVG；HTML 行内图片扩展（`_imageExtension`）与图片画廊仍无自动重试。进程重启后退避次数回到 0，但失败记录仍在，下次刷新会重扫。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要让正文渲染层自己维护退避/计数或直接下载；失败登记和重试调度都走 service 的 `scheduleRetryFromUi` / `retryManually`。
- 不要恢复 `_retryCount++` + `appendRetryStamp` 与 service 并行下载的旧路径；一张图片一次只能有一条下载链。
- 不要用全局文章状态通知刷新正文图片；只通过图片级 `ArticleImageRetryState.successRevision` 精确重建失败图片。
- 不要在 errorWidget build 路径里同步修改通知器；失败上报必须延后到当前 frame 结束。
- 不要把自动重试计数落盘；它只是当前会话的瞬时退避进度，落盘会让重启后立即跑满 3 次重试，反而绕过"刷新时重扫一轮"的节奏。
- 不要把缓存清理和失败重扫并行启动；清理完成后才能重新入队失败图片。
- 不要在行内图片和画廊上复用本次重试，除非单独验证其 `errorWidget` 改造；本次范围明确不含。
</details>

## 误分类（N）用 userAction 标记记录统计信号

背景：用户希望事后统计 AI 是否错误分类文章。被 AI 拒绝的文章进入垃圾拦截页，用户用 `K`（保留）、`M`（确认拒绝）和新增的 `N`（误分类）处理；普通时间线用 `N` 把文章标记为误分类。设计讨论确认：`N` 是"分类翻转 + 强制已读"的对称操作，拦截页 `N` = 保留+已读（等价先 `K` 再在常规列表 `M`），时间线 `N` = 拒绝+已读；两者都是原子 UndoAction。`M` 语义模糊（可能同意 AI 也可能懒得分辨），用户明确不拆分成两个动作。统计核心是 FP（`k`+`n_keep`）和 FN（`n_spam`），`m` 是弱信号单独归类，null 无信号；时间趋势分析不需要，用户明确不添加动作时间戳。

决策：

- `ArticleModel.userAction` 落库，取值 `'k'/'m'/'n_keep'/'n_spam'/null`，同一文章多次动作 latest wins。`upsertMany` 合并用 `item.userAction ?? existing?.userAction`，网络同步数据（恒为 null）不覆盖本地标记。
- 统计范围是当前 `articleDb` 仍保留的近期文章，允许随 5000 篇缓存淘汰和账号内容清理而消失；不建立独立长期记录库，也不进入设置备份。
- 统计口径：FP = `'k'` + `'n_keep'`，FN = `'n_spam'`，`'m'` 弱信号，null 无信号。`K`/`N` 不再清空 `filterReason`/`filteredAt`，供事后按 AI 原判理由聚合 FP。
- 时间线上的 `N` 对已读或已在拦截中的文章禁用（按钮置灰、菜单禁用），保护 FN 语义纯净：`n_spam` 只会写在从未被 AI 拒绝的文章上。拦截页 `N` 恒可用。
- 按钮为 macOS 文章详情右上角浮动白色旗帜图标（`Icons.outlined_flag`），位于目录按钮左侧；无目录时占据目录位置（复制/已读按钮簇左侧）。快捷键 `N`，`Cmd+N` 必须放行给系统新建窗口。Android 暂不加按钮。
- 兼容性立场：旧版本二进制不认识 `userAction`，任何旧版重写（同步、标已读、undo）都会把该字段静默剥掉，这是二进制层面不可修复的行为。讨论过独立 Hive box 方案（旧版本从不打开新 box 可完全免疫），用户评估后选择字段方案，接受"统计只有真的没有假的"语义（系统性低估但不会脏）。

后果：标记写入、四种动作方向和撤销回滚都经受控测试与真机验证；`tool/inspect_user_actions.dart` 可随时检查标记落库情况。旧版本混用时期产生的标记缺失属于已接受的数据语义。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要给 `userAction` 添加时间戳字段，用户已明确决定不做时间趋势分析。
- 不要在时间线上对已读或已在拦截中的文章启用 `N`。
- 不要把 `M` 拆成"同意/懒得分辨"两个动作。
- 不要让网络同步数据覆盖本地动作标记。
</details>

## 过滤动作撤销必须整条替换快照，setReadState 必须保留全部过滤字段

背景：调试中发现两类数据库写入陷阱。第一，`upsertMany` 的合并策略是 `isRejectedByAi` 用 OR、`userAction` 用 `item ?? existing`，因此"把已拒绝恢复为未拒绝"和"把动作标记回滚为 null"都无法通过普通 merge 完成；K 的捞回路径本来就必须用 raw map 写入（`clearFilterState`），M/N 的撤销也踩中同一陷阱，表现为撤销后状态恢复但 `userAction` 标记残留。第二，`LocalArticleDbService.setReadState` 重建文章模型时曾遗漏 `userAction`，而 `applyMisclassify`/`applyFilterReject` 的写入顺序是先 upsert 带标记的文章、再经 `applyReadLocally → setReadState` 标已读，导致标记刚写入就被覆盖成 null——这是"N/M 标记写不进去"的主因，K 路径不走 `setReadState` 所以只有 K 的标记幸存。

决策：四个过滤动作（`filterKeep`/`filterReject`/`misclassifyKeep`/`misclassifySpam`）的撤销路径全部使用 `LocalArticleDbService.upsertOne(article, forceReplace: true)` 整条还原动作前快照；`forceReplace` 跳过全部合并逻辑，直接写入 `toJson()`。`setReadState` 及所有从现有文章重建实例的路径完整保留 `isRejectedByAi`/`filterReason`/`filterReviewed`/`filteredAt`/`userAction`。若恢复未读的远端请求最终失败，必须用 `appliedFilterSnapshot` 重新落下操作后的分类、已读、审核和 `userAction` 状态，再把 UndoAction 放回撤销栈；正文控制器挂载与否不能形成两套结果。

后果：受控测试与真机验证确认：`n_spam` 写入后 `Cmd+Z` 一次性回滚分类、已读、审核标记和 `userAction`（`拒绝=false 已读=false 已审=false act=null`）；`K` 撤销精确还原快照（含快照中已有的标记值）。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要让任何过滤动作撤销回到普通 merge 路径。
- 不要在 `setReadState` 或其他"从旧记录重建"的写入路径中遗漏 `userAction` 或任何过滤字段。
- 不要在 `applyMisclassify`/`applyFilterReject` 中依赖"先 upsert 后标已读"的顺序而不验证标记是否保留。
</details>

## 拦截页 K/M/N 由页面级键盘处理器执行，HardwareKeyboard 不短路

背景：macOS 拦截页 `MacSplitArticleListCoordinator.reconcileSelection()` 对 null 选择直接返回，不会自动选中第一篇；详情面板未挂载时 `M`/`N` 没有任何处理器（`K` 是页面级处理器所以能用），用户按 `M` 完全无响应。同时确认 Flutter `HardwareKeyboard` 会调用全部注册处理器并做 `handled = handled || thisResult`，不因第一个返回 true 而短路——页面级处理器与详情 `ArticlePageView` 处理器会双触发。

决策：拦截页的 `K/M/N` 统一由页面级 `_handleHardwareKeyEvent` 执行（`K` 保留、`M` 确认拒绝、`N` 误分类保留+已读），不依赖详情面板是否挂载；`ArticlePageView` 在 `isReviewContext` 下对 `M/N` 只消费按键不执行回调，避免双触发。时间线 `M/N` 仍由 `ArticlePageView` 处理器执行（`onMKeyPressed`/`onMisclassifyKeyPressed`）。页面级处理器通过 `MacArticleShortcutService.hasNonShiftModifier` 放行 Alt/Control/Command 组合键，避免抢占 `Cmd+M`、`Cmd+N` 等系统命令。

后果：拦截页在无选中时不再静默吞掉 `M/N`；双重触发被明确消除，不再依赖 `beginRemoval` 的 pending 守卫兜底。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要依赖 `HardwareKeyboard` 处理器的返回 true 来短路其他处理器。
- 不要只依赖详情面板挂载来响应拦截页快捷键。
- 新增页面级与组件级共存的键盘处理器时，必须显式处理双触发。
</details>

## Obx 内所有提前 return 之前必须先读取 observable

背景：误分类旗帜按钮的 `Obx` 在 `onMisclassifyKeyPressed == null`（最近阅读/订阅源详情页）时提前 `return SizedBox.shrink()`，且提前返回发生在读取任何 observable 之前，触发 GetX 的"improper use"异常（`RxInterface.notifyChildren` 在 `canUpdate == false` 时 throw）。Debug 构建表现为 GetX 红色错误组件覆盖右侧面板；Release 构建表现为正文区域一片半透明空白（构建失败，子树不渲染）——用户最初把后者描述为"50% 白色覆盖"。这与 Android Inbox 曾出现的"Obx 未读取 Rx"是同一类陷阱。

决策：`Obx`/`GetX` 的 builder 中，所有条件提前返回之前必须先读取至少一个 observable（如 `controller.isRead.value`），保证每次构建都有依赖登记。

<details class="dg-callout" open>
<summary>不要回退</summary>

- 不要在 `Obx` 内把 observable 读取放在提前 return 之后。
- 排查"Release 版一片空白/半透明覆盖"时，先检查是否有 Obx 提前返回未读取 observable；GetX 误用异常在 Release 会被吞掉，只剩空白渲染。
</details>

## 知识库采用“编辑=阅读”的单文件 HTML 页面体系

背景：用户要求文档的编辑与阅读是同一个东西、克隆后零依赖零执行即可阅读，并明确不使用需要构建、开发服务器或 `fetch` 本地 Markdown 的静态站点生成器；浏览器对 `file://` 协议禁止运行时 `fetch` 本地文件，因此任何“HTML 运行时加载 md”的方案在双击场景下都不可行。

决策：每个专题页是自包含的 `.html` 文件，正文以 Markdown 内嵌于 `<script type="text/markdown" id="wiki-content">`；阅读时由仓库内置的 markdown-it（UMD 经典脚本）渲染；导航清单与搜索索引是仓库内经典 JS 数据文件；全部资源相对路径、无网络依赖。编辑和阅读是同一个文件，不维护独立的 Markdown 源与生成后的 HTML 副本。旧 `.md` 页面全部迁移为同名 `.html` 并建立逐文件映射（见 `meta/migration-map.html`）。

后果：克隆后双击根 `index.html` 即可离线浏览全部专题；GitHub 网页不再渲染 wiki 页面（`.html` 显示源码，但 Markdown 正文以明文存在于 script 标签中，agent 与文本工具可直接读取）；根 `README.md`、`AGENT_HANDOFF.md` 保留为 .md 短入口。

不要回退：

- 不要重新引入需要构建、HTTP 服务或运行时网络资源的站点生成器（Docusaurus/VitePress/MDBook 等均依赖其一）。
- 不要为了“GitHub 渲染”恢复每页一份独立 `.md` 源文件——那会回到双份维护。
- 不要在页面中使用 `fetch()`、ES Module、动态 import 或远程 CDN 资源；页面脚本必须是经典 script 格式。
- 正文的 Markdown 中不得出现会提前结束脚本块的闭合序列（确有需要展示时以反斜杠转义书写，渲染时自动还原，写法见 `meta/site-guide.html`）；也不要空行后 4 空格缩进 HTML（markdown-it 会解析成代码块）。

## 首页兼具产品宣传页与 Wiki 入口

背景：旧营销 `index.html` 被替换后，入口需要同时承担产品介绍与知识库导航，而首页又是唯一的“门面”。

决策：根 `index.html` 做成全宽落地页（`wiki-full` 标记隐藏侧栏与目录，保留品牌栏、搜索与主题切换）：深色渐变 hero（品牌标识、标语、CTA、徽章与“非官方客户端”声明）、6 张行内 SVG 图标功能亮点卡片、Wiki 快速入口网格，之后接推荐阅读顺序与硬性规则。每个专题页由 `app.js` 自动生成分区配色的视觉横幅（图标 + 标题 + 首段摘要 + 专题标签）。宣传文案从旧营销页与产品文档综合改写，不使用截图。

后果：入口同时具备产品传达与技术手册导航；文案需要与产品现状保持同步更新。

不要回退：

- 落地页 HTML 必须以顶格书写；空行后 4 空格缩进的 HTML 会被 markdown-it 当作代码块（曾导致 6 张功能卡与 8 个入口卡整体渲染成代码文本）。
- 首页链接使用 `docs/agent_handoff/` 前缀（页面位于仓库根）；不要删除 hero 与功能卡结构只留链接。
- “非官方个人二次开发客户端”声明必须保留。

## 文档图形统一使用内联 SVG，不引入 Mermaid

背景：架构图、流程图需要可复用、明暗主题清晰、离线可用；Mermaid 依赖运行时绘图库且与“零依赖”约束冲突。

决策：图形是 `div.dg` 包裹的内联 `<svg>`（`div` 包装确保 markdown-it 按原始 HTML 块透传），样式统一由 `assets/theme.css` 的 `dg-*` 类与 CSS 变量提供（节点/边/箭头/标签，随明暗主题切换）；动画仅用于解释状态变化（箭头流动等 CSS keyframes），`prefers-reduced-motion: reduce` 时全部禁用；SVG 带 `viewBox`、`role="img"` 与 `<title>/<desc>`。当前共 12 张：总体架构、数据同步、文章流水线、撤销重做、媒体链路、构建发布、AI 队列、审核流转、存储与账号生命周期、订阅侧边栏、macOS 窗口分层、动画时序。

不要回退：

- 不要引入 Mermaid、ECharts 或其他运行时绘图依赖。
- 图形必须取材真实代码与文档结构，不得为美观虚构架构。
- 新增图形复用现有 `dg-*` 样式与两个共享箭头 marker（`dg-arrow` / `dg-arrow-flow`），不要在页面里散落手写样式。

## 发布足迹直接追加进 releases.html 的内嵌 Markdown

背景：旧 `scripts/release.sh` 把发布可复现命令追加到 `history/releases.md`；wiki 迁移为单文件 HTML 体系后，继续维护 `.md` 副本会破坏单一产物原则。

决策：`scripts/release.sh` 改为把足迹插入 `history/releases.html` 的 `wiki-content` 脚本块（在第一个 `<\/script>` 前，并转义内容中的 `<\/script>`）；脚本行为与版本号/分支/校验规则保持不变。`history/releases.html` 是唯一产物，未来改动页面模板时必须保持“第一个 `<\/script>` 前是 `id="wiki-content"` 块”的约束。

后果：发布记录与 wiki 页面同一文件，GitHub 上以 .md 形式查看的旧习惯不再适用；`docs-check` 会校验该结构完整性。

不要回退：

- 不要恢复向 `releases.md` 追加的逻辑（双份维护）。
- 修改 `releases.html` 或页面模板时，不要移除 `id="wiki-content"` 或在正文块前插入其他 `<\/script>`。
