# 测试

主要命令：

```bash
dart analyze lib test
flutter analyze lib test
flutter test
flutter build macos --debug
```

预期注意点：

- Flutter 命令可能需要权限更新 Flutter SDK cache。
- 完整 `dart analyze` 会很吵，因为 `reference/` 包含外部复制来的参考工程。
- Flutter `3.44.6` 的分析器会对现有 renderer 和少量 helper 报 `prefer_initializing_formals` info；工具链迁移时共观察到 59 条，没有 warning/error。CI 使用 `flutter analyze --no-fatal-infos lib test`。不要为了消除本次升级带来的 info 顺带机械重写液态玻璃 renderer；后续可作为独立无行为重构处理。

当前测试：

- `test/article_content_utils_test.dart`
- `test/html_chunk_parser_test.dart`
- `test/article_card_test.dart`
- `test/article_model_test.dart`
- `test/feed_model_test.dart`
- `test/html_entity_utils_test.dart`
- `test/implicitly_animated_list_test.dart`
- `test/widget_test.dart`

正文来源兼容回归至少应覆盖：目标来源作者区被转换、作者姓名/账号/主页和头像地址保留、装饰头像空壳被清理、其他来源的圆形/头像式图片不被误删，以及内部作者标记只生成一个 `authorList` chunk。

修改单个功能时，先运行相关窄测试；推送前再运行完整项目测试套件。

macOS 列表动画诊断埋点默认关闭。普通 Debug/Release 不打印，也不会挂载动画监听器。复现 `M/K`、审核横滑或主时间线双击偶发瞬移时，运行：

```bash
flutter run -d macos --no-pub \
  --dart-define=FOURIER_ANIMATION_PROBE=true \
  2>&1 | tee /tmp/fourier-animation.log
```

按页面过滤：

```bash
grep ReviewAnimProbe /tmp/fourier-animation.log
grep TimelineAnimationProbe /tmp/fourier-animation.log
grep TimelineTapProbe /tmp/fourier-animation.log
grep TimelineListResetProbe /tmp/fourier-animation.log
grep TimelineReadStateProbe /tmp/fourier-animation.log
```

`TimelineAnimationProbe` 同时覆盖主时间线的 `M`、双击、退场动画进度和滚动 offset；`TimelineTapProbe` 记录原始点击与双击识别，用于区分手势未识别和动画未绘制；`TimelineListResetProbe` 记录零时长批量同步的明确原因，用于确认单篇读状态是否被错误归入批量路径；`TimelineReadStateProbe` 区分已读状态被未读快照降级与列表组件的纯视觉残影。正常单篇移除应依次出现动画 bucket `4→3→2→1→0`，增量可见列表更新不应触发 list reset，外部浏览器只能在 `remove.end` 后打开。埋点只输出文章 id 的末 8 位、动作来源、列表数量、动画阶段和慢帧耗时，不输出标题、正文、凭据或完整文章 id。不要为了普通运行长期打开该开关；同步 `debugPrintSynchronously` 本身可能轻微干扰 Debug 性能测量。
