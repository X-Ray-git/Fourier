# 设计规范

本文档是 Auto Folo Wiki 的视觉与交互设计规范，供后续所有页面美化、新增组件与视觉调整遵循。设计方向参考了开源 agent 设计技能与转场参考工程（见文末来源），并结合本项目的"离线、单文件、agent 可读"约束做了取舍。

## 设计判读（五维）

当前站点在设计上的定位：

- **产品形态**：产品宣传页（首页）+ 工程手册（57 个专题页）的混合站点。
- **视觉语言**：现代工具 / Builder SaaS 家族（Linear / Vercel 风格）：细线边框、单一强调色、克制渐变、无衬线中文排版。
- **信息密度**：高（8/10）——手册为主，允许紧凑列表与代码块。
- **动效强度**：中（4/10）——只解释状态变化与引导注意，不干扰阅读。
- **资产依赖**：低（2/10）——不使用截图与位图，图形全部为内联 SVG。
- **品牌保真**：中（6/10）——品牌橙为唯一强调色，其余色相不做点缀。

## 设计令牌

### 色彩

- 强调色（唯一）：品牌橙 `#f59e0b` / `oklch(0.769 0.165 70.1)`，深一档 `#f97316`。
- 语义色：链接蓝 `--link`、代码棕 `--code-text`、危险/保留仅用于语义场景（按钮与横幅）。
- 中性色阶：浅色主题 9 级（`--bg` 至 `--text`），深色主题对应反转；全部用 CSS 变量，hex 在前作 fallback、oklch 在后覆盖。
- 分区横幅色：状态蓝 / 产品橙 / 架构靛 / 功能橙红 / 平台绿 / 设计紫 / 操作黄绿 / 历史棕 / 许可绿 / 关于灰——只用于横幅图标与底色，不用于正文。
- 反俗套：不使用紫→粉→蓝渐变；首页 hero 光晕收敛为品牌橙 + 中性深色。

### 字体

- 正文：系统字体栈（PingFang SC / Microsoft YaHei / Noto Sans CJK 等），16px，行高 1.75（可被阅读设置覆盖）。
- 等宽：SF Mono / Menlo / Consolas，用于代码与 kbd。
- 标题：`clamp()` 流式；正文标题对比 ≥ 2.5×。
- `text-wrap: pretty`（正文）与 `balance`（标题）提升中文断行。

### 间距与圆角

- 8pt 网格；正文段距 10px、章节间距 34px。
- 圆角分层：横幅 20 / 卡片 14-16 / 控件 999（胶囊与圆形按钮）/ 图形 14；不做全局搜索替换。

### 阴影

- 两档：`--shadow-soft`（悬浮反馈）与 `--shadow`（浮层）；浮层（面板/灯箱/命令面板）用更大的投影。

### 动效

- 时长：150–350ms；缓动 `ease`（入场）与 `ease-out`（退场）。
- 触发：hover（卡片上浮、图形描边）、点击（主题切换、复制成功）、滚动（章节渐显、进度条）、焦点（focus-visible 可见性）。
- **所有动画必须受 `prefers-reduced-motion` 保护**；阅读设置中"动效关"等价于全局 `no-anim`。
- View Transitions 只作渐进增强，不支持时静默降级。

## 组件协议

- **横幅**：运行时由 app.js 生成（图标 + 标题 + 首段摘要 + 专题标签 + 阅读时长徽章），分区配色，含光泽扫过与入场动画。
- **图形**：`div.dg` 包裹的内联 SVG，复用 `dg-*` 类与共享箭头 marker；点击打开灯箱（`<dialog>`）。
- **键帽 kbd**：快捷键一律用 kbd 呈现，样式由 theme.css 统一。
- **调用框**：语义警示用 `details.dg-callout`（"不要回退"），默认展开。
- **交互反馈**：复制按钮成功态对勾描画；搜索/命令面板 origin-aware 展开；导航当前页高亮 + `aria-current`。

## 反俗套检查清单

新增视觉元素前逐项自查：

- [ ] 没有紫→粉→蓝渐变（品牌橙是唯一渐变色相）
- [ ] 不用 emoji 当图标；缺图标用占位或线条 SVG
- [ ] 不用系统字体当展示字做"假品牌"；字体保持系统栈
- [ ] 卡片不加彩色左色条（语义警示框除外）
- [ ] 不堆砌阴影/玻璃；密集重复元素保持轻量
- [ ] 不虚构数据、不添加占位截图
- [ ] 色相数量 ≤ 4 族（品牌橙 + 中性 + 语义色）
- [ ] 动效有 reduced-motion 降级

## 可访问性自查结论（2026-08）

按 ai-friendly-web-design 要点检查：

- 语义结构：header/nav/main/article/footer 齐全；对话框（命令面板、阅读设置、灯箱）均带 `aria-label`；导航当前项带 `aria-current`。
- 键盘可达：复制按钮 hover 显隐但有 `:focus-visible` 兜底；对话框原生支持 Esc；命令面板支持方向键与 Enter；`/ ? n p t` 全局快捷键在输入焦点与 IME 组合时跳过。
- 焦点管理：dialog 使用原生 showModal（焦点自动进入，关闭后归还）；灯箱关闭按钮可聚焦。
- 对比度：浅色/深色两套中性色阶满足正文对比；横幅渐变文字用于大标题（对比充足）不用于正文。
- 动效降级：全部动画有 `prefers-reduced-motion` 分支；阅读设置提供全局关闭。
- 触摸目标：移动端主题按钮/阅读设置按钮 ≥ 36px，正文链接行高足够。

## 来源与参考

- [garden-skills / web-design-engineer](https://github.com/ConardLi/garden-skills)：设计五维判读、风格配方、反 AI 俗套清单、oklch 配色与 Tweaks 面板概念。
- [transitions.dev](https://github.com/Jakubantalik/transitions.dev)：origin-aware 菜单、modal 缩放、成功对勾描画等转场参考。
- [ai-friendly-web-design](https://github.com/ianho7/ai-friendly-web-design-skill)：语义 HTML、键盘可达与 agent 可读性检查。
