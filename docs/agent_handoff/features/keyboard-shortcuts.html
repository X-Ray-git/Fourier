# 快捷键与焦点

快捷键支持主要是 macOS 功能。

## 重要行为

- <kbd>M</kbd> 根据当前页面改变语义：普通时间线切换当前文章的已读/未读状态，其中标为已读后继续选中下一篇；垃圾拦截页则表示移除当前文章。
- <kbd>K</kbd> 仅用于垃圾拦截页，表示保留当前文章。垃圾拦截中的 <kbd>M/K</kbd> 都会在操作完成后继续选中下一篇。
- <kbd>N</kbd> 表示误分类（右上角旗帜按钮）：垃圾拦截页中保留当前文章并标为已读（等效于先 <kbd>K</kbd> 再在常规列表 <kbd>M</kbd>）；常规时间线中标为已读并移入垃圾拦截。这是一条原子业务动作，<kbd>Cmd+Z</kbd> 一次撤销同时恢复分类与已读状态。常规时间线中已读或已在拦截中的文章不响应 <kbd>N</kbd>（按钮置灰）。<kbd>Cmd+N</kbd> 是 macOS 系统新建窗口，必须继续放行，不能被应用快捷键抢走。
- 无修饰键 <kbd>C</kbd> 在当前 macOS 文章详情中复制已加载原文的 Markdown；`Command-C` 必须继续交给系统复制正文选区。
- 无修饰键 <kbd>B</kbd> 在默认浏览器打开当前原文；<kbd>Shift+B</kbd> 是确保已读后打开原文，已经已读时不能反向恢复未读。垃圾拦截页中 <kbd>Shift+B</kbd> 复用该页的 <kbd>M</kbd> 语义，即移除当前文章并在退场动画结束后打开原文。`Command-B` 保留给 macOS 的常规文本语义，不作为应用快捷键。
- <kbd>Cmd+1</kbd> 回到无订阅源/分类/静默筛选的“全部文章”，<kbd>Cmd+2</kbd> 打开垃圾拦截，<kbd>Cmd+0</kbd> 打开静默订阅源。键盘页面切换不能复用侧边栏双击计时，否则连续按键可能意外触发时间线回顶。
- 垃圾拦截/审核页快捷键不能被主时间线抢走。
- <kbd>Cmd+Z</kbd> 使用最多 50 项的业务历史连续撤销“标为已读、垃圾拦截保留、垃圾拦截移除、静默文章整批标为已读”；<kbd>Shift+Cmd+Z</kbd> 按相反顺序连续重做。新的业务动作会清空 redo 栈；导航、切换时间线范围、订阅源、分类或静默 scope 不清空历史。业务栈在应用本次运行期间保持一致，只有进程彻底退出才自然消失，不持久化到下次启动。
- 文本输入框继续使用 Flutter 自身的文本 Undo/Redo。原生“编辑”菜单与全局快捷键必须先检查当前焦点，不能让文章业务历史抢走输入框里的 <kbd>Cmd+Z</kbd> / <kbd>Shift+Cmd+Z</kbd>。
- <kbd>Cmd+R</kbd> 触发全局刷新。
- <kbd>Cmd+W</kbd> 关闭当前主窗口，行为与点击红色按钮相同：隐藏窗口但不退出应用。
- 当前 inline 视频由 `activePlayer` 归属空格和媒体键；全屏视频独占这些按键。
- 全屏视频中 <kbd>Left</kbd>/<kbd>Right</kbd> 分别后退/前进 5 秒，<kbd>Esc</kbd> 退出；这些行为只在全屏视频路由存在时接管，不应影响文章列表的左右导航。
- Escape 关闭全屏图片预览。
- 静默订阅源批量选择模式中，<kbd>Esc</kbd> 等效于右上角“退出批量选择”，并清空本次勾选；该模式的处理优先于底层文章详情的关闭行为。批量导出正在提交时，关闭入口和 <kbd>Esc</kbd> 都不应中断操作。
- macOS 从文章来源进入具体订阅源后，<kbd>Esc</kbd> 可以回到跳转前的文章与阅读位置。优先级为：批量选择先退出；目标订阅源中已打开文章时先关闭该文章；详情为空时再消费临时来源返回点。该返回点属于导航上下文，不进入 <kbd>Cmd+Z</kbd>/Redo 业务历史，并在用户手动切换其他时间线 scope 后失效。

## 焦点规则

- 在垃圾拦截/审核页执行移除/标记操作后，焦点必须仍可用于键盘导航。
- 避免焦点落入非命令区域，导致 Flutter 文本选择光标出现。
- <kbd>Esc</kbd> 关闭分栏文章后，焦点必须落到当前页面不可见的空详情焦点节点，不能让 Flutter 自动恢复到此前点击过的侧边栏条目，否则“全部文章”等入口会残留灰色键盘焦点高亮。
- 卡片右键菜单操作后，详情页控件应立即更新，不需要先点别的文章再回来。

## 导航规则

- macOS 分栏应保持中间列表和右侧文章详情同步。
- 当前列表没有选中文章时，<kbd>Right</kbd> 选择当前可见列表第一篇，<kbd>Left</kbd> 选择最后一篇；页面必须在文章详情尚未挂载时消费该事件，不能让方向键落到侧边栏并留下错误的焦点高亮。该规则覆盖主时间线及其订阅源/静默 scope、垃圾拦截和最近阅读；设置等没有文章列表的页面不接管裸方向键。
- 键盘移动列表时，应自动滚动选中卡片到可见区域。
- 双击和快捷键触发的切换应保留卡片进出场动画，除非出于性能原因明确绕过。

## 实现结构

- macOS 菜单栏由 `MacOSAppMenu` 的 `PlatformMenuBar` 管理，结构为 `Fourier / 编辑 / 显示 / 文章 / 窗口 / 帮助`。系统 About、Services、隐藏、退出、全屏、最小化和缩放继续使用 `PlatformProvidedMenuItem`；XIB 只为这些系统项提供本地化标题和 AppKit selector，不要恢复 Flutter 模板中未使用的拼写、替换、语音等菜单。
- “编辑”菜单的业务动作名必须始终放在长标题之前，单篇格式为 `撤销“动作” · 《截断标题…》` / `重做“动作” · 《截断标题…》`。整批静默文章使用 `撤销“批量标为已读” · N 篇`，不显示任意一篇文章标题。完整 50 项栈不暴露成菜单列表，只展示下一项。`UndoAction.actionName` 是菜单动作名，`description` 用于反馈正文，不要再把完整句子整体截断。
- `UndoService` 使用 `BoundedHistory` 保存 undo/redo 双栈，并串行执行撤销/重做，避免快速连续按键造成网络回滚乱序。`UndoAction` 可以承载单篇或不可拆分的一批文章；页面只通过 redo preparation 在数据变化前登记列表离场；数据变更集中复用单篇或批量本地状态入口，不能在重做路径复制数据库规则。业务栈是进程级内存状态，不得在 scope 切换时调用 `UndoService.clear()`。
- 当前分栏文章通过 `MacOSAppMenuService` 注册原文、复制 Markdown、已读/审核动作、前后导航、翻译和摘要能力。注册者必须同时验证 route、当前 macOS 页面和当前选中文章，并在销毁时注销，避免 `IndexedStack` 中隐藏文章污染“文章”菜单。
- 应用级组合键和无选中文章时的裸方向键定义在 `main.dart` 的 `Shortcuts/Actions`。主时间线、垃圾拦截和最近阅读通过 `MacArticleShortcutService` 注册当前页面是否激活、是否已有选择以及首末选择动作。裸方向键必须在 Flutter 默认方向焦点移动之前被消费；不要退回到每个页面各挂一套 `HardwareKeyboard` 方向键监听，否则侧边栏可能已经先获得灰色焦点高亮。
- 注册器只在当前 macOS 页面、当前 route、没有文章选中且焦点不在 `EditableText` 时启用。选择前会释放侧边栏旧焦点；有文章选中时，左右键继续由当前 `ArticlePageView` 处理。页面销毁时必须注销注册，避免 `IndexedStack` 中失活页面抢按键。
- <kbd>Shift+B</kbd> 在普通时间线复用双击的 `_openOriginalAndMarkRead` 路径，保持帧边界持久化、列表退场、后继选择和退场结束后打开浏览器的既有顺序。垃圾拦截复用 `_reject`，并同样等真实 `remove.end` 后再打开；最近阅读复用其双击行为。不要另写一条直接修改数据库的快捷路径。
- <kbd>Cmd+0/1/2</kbd> 使用 `MainController.selectIndex`，刻意避开侧边栏 `changeIndex` 的重复点击回顶计时；<kbd>Cmd+1</kbd> 还必须清空 timeline scope，<kbd>Cmd+0</kbd> 必须设置 silent scope。
- 主时间线、垃圾拦截和最近阅读各自持有空详情 `FocusNode`。<kbd>Esc</kbd> 清空选择后在下一帧请求该中立节点，防止文章详情焦点销毁时 Flutter 恢复到此前点击过的侧边栏条目。

## 回归风险

- 全局 listener 和页面级 listener 同时处理同一个按键时可能双重触发。
- `IndexedStack` 会让隐藏页面继续存活；所有页面级全局按键都必须校验当前 `MainController.currentIndex`。最近阅读文章详情也必须传入 `isActive`，垃圾拦截的 <kbd>K</kbd> 监听不能只检查 `ModalRoute.isCurrent`。
- 设置页的新旧 macOS 布局必须共用 `_buildMacShortcutItems`，新增快捷键时不要再复制两份说明列表。
- 设置页快捷键说明必须保留 <kbd>M</kbd> 的页面相关语义，并单独列出垃圾拦截页的 <kbd>K</kbd>，不能重新简化成只有“切换已读”。
- 移除卡片可能在下一篇文章被选中前使当前选中文章失效。
- 如果 fallback 值过期，GetX/全局文章状态更新可能和本地 controller 状态产生竞态。
