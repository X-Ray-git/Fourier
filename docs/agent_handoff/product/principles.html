# 产品原则

Fourier 是一个个人使用的高密度 RSS/Folo 阅读工具。

优先级：

- 快速、可重复的阅读工作流。
- 低摩擦的 macOS 分栏阅读体验。
- 稳定的 Android 行为。
- 同步、翻译、摘要、过滤任务要有清晰反馈。
- 避免 UI 看起来像 Folo 官方品牌，或暗示官方所有权。

设计偏好：

- 构建真实可用的界面，不做营销页。
- 操作型 UI 应安静、紧凑、可读。
- macOS 上选择性使用 Liquid Glass；不要把所有表面都变成重型玻璃。
- 当性能或可读性有风险时，优先使用轻量控件。
