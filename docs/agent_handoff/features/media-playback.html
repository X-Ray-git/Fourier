# 媒体播放

媒体播放分为两类：**普通视频**（`video_player` 本地播放器）与**网页平台视频**（YouTube / Bilibili，首选仓库内可复现构建的 Shaka 网页运行时，失败时回退官方 iframe）。两类播放器共用同一套播放快捷键归属与全屏语义。

## 播放器快捷键归属

- inline player 和全屏 player 都支持空格播放/暂停，但同一时刻只能由当前可见播放器处理全局按键。
- 普通 inline video 与 YouTube 自定义播放器共用 `ArticleVideoPlaybackShortcut`：开始播放或点击播放器会把它设为当前播放器，裸 `Space`/媒体播放键在文章其他区域仍控制当前播放器；切到另一播放器时转移归属，widget dispose 时释放。YouTube 的 WKWebView 焦点内外会走同一通道并做短时间去重，不得再分别维护两套全局快捷键。
- 进入全屏前，inline player 如果是 `activePlayer`，应暂时释放该身份；全屏页在首帧后请求焦点并接管空格。退出全屏后，inline player 再恢复 `activePlayer` 和焦点。
- 普通视频全屏页与图片画廊必须通过 root navigator 打开，避免 macOS 分栏详情区的嵌套路由把全屏内容限制在右栏。YouTube/Bilibili 的 WebView 元素全屏继续由系统原生全屏能力接管，不走 Flutter 嵌套路由。
- 不要让 inline 与全屏页面同时响应同一次空格事件，否则可能发生连续切换两次、视觉上像“空格无效”。也不要在全屏 widget 尚未挂载完成前同步请求焦点。

## 普通视频

- 视频不自动循环：controller 初始化后显式 `setLooping(false)`；播放自然结束时停在最后一帧，只有用户再次主动播放才 seek 到开头后继续。这一规则同时适用于 inline 和全屏，因为二者复用同一个 controller。
- 文章内普通视频视口固定为 `16:9`，不再用 feed HTML 的 width/height 改变正文布局。poster 和真实视频都在黑色视口内按自身比例 `contain`，允许黑边但禁止裁切、拉伸和加载后重排正文。全屏仍按视频真实比例显示。
- 普通视频和 YouTube 播放前共用 `MediaPlayButton`：macOS hover 使用手指光标；点击后按钮保持 `64x64`，只把图标替换为转圈。初始化状态必须立即 `setState`，避免网络较慢时用户误以为没有点击成功。
- `AnimatedOpacity` 不会自动停止命中测试。inline 与全屏视频控制栏隐藏时必须同时 `IgnorePointer`，否则不可见的全屏/退出按钮仍会拦截角落点击。
- inline 与全屏普通视频的 `VideoProgressIndicator` 均已启用 `allowScrubbing: true`。`video_player` 内部支持点击定位和水平拖拽：拖动开始时暂时暂停，拖动中连续 seek，结束后按拖动前状态恢复。两处进度条都用 `MouseRegion(SystemMouseCursors.click)` 提示可交互；YouTube 进度条由 WebView/YouTube 自己管理。

## macOS 全屏视频

- macOS 全屏视频不显示顶部返回、旋转按钮和顶部渐变条：返回按钮与红黄绿位置冲突，旋转对桌面没有意义，底部已有退出全屏入口。Android 仍保留移动端顶部返回和横竖屏控制，不要误删为全平台统一行为。
- macOS 进入全屏视频时通过 `MacOSWindowControls`/`window_controls` 原生通道临时隐藏 AppKit 红黄绿按钮，退出页面时必须恢复。`MainFlutterWindow` 保存显隐状态，窗口重新布局时不得强制把按钮提前显示出来。
- 全屏视频键盘：`Space`/媒体键播放暂停，`Left` 后退 5 秒，`Right` 前进 5 秒，`Esc` 退出。seek 必须 clamp 到 `0..duration`；只处理首次 `KeyDownEvent`，不把系统按键重复当作连续快进。

## YouTube

- Folo/Newtype 等源会返回 `youtube.com` 或 `youtube-nocookie.com/embed/...` iframe。它不是媒体文件，不能直接交给 `video_player`；严格 URL 解析得到 video ID 后，macOS/Android 首选 `YouTubeSabrPlayer`，失败时回退到官方 iframe。
- `YouTubeEmbedInfo` 只识别明确的 YouTube embed/watch/shorts/live/youtu.be URL，并统一生成隐私增强 `youtube-nocookie.com` 地址。
- `YouTubeSabrPlayer` 只在用户点击后启动进程内 loopback 服务并创建 WebView。本地页面打包 YouTube.js 17.2.0、googlevideo 4.0.4、bgutils-js 3.2.0 和 Shaka Player 4.16.2；依赖锁定、构建说明和完整许可见 `tool/embed_video_player_runtime/` 与 `THIRD_PARTY_NOTICES.md`。不要在 Dart 中 Base64 搬运媒体数据；GoogleVideo 响应必须从 loopback 代理流式送入 WebView。
- SABR 播放器的控制语义要尽量对齐 `InlineVideoPlayer`：单击画面只显隐控制栏，不直接切换播放；控制栏播放时 3 秒后淡出、暂停时保持可见；进度条使用应用橙色，左侧为播放和时间，右侧只保留音量、设置和全屏。设置菜单保留字幕、清晰度、语言和倍速，不重新引入网页播放器的章节、循环、画中画或保存帧等入口。WebView 内双击全屏已关闭，避免和应用现有点击语义分叉。
- VOD 的 SABR UMP 可能正常结束却没有返回媒体段、重定向或上下文更新。此时先卸载失败请求、关闭 SABR 请求改写但保留同源 GoogleVideo 代理，再由同一个 Shaka 控件加载 YouTube.js 普通自适应 DASH。SABR 与普通 DASH 都失败、直播失败、35 秒内未进入 playing，或收到主 frame 错误时，才重建为 `WebEmbedVideoPlayer(startOnMount: true)`。官方回退不是临时调试代码：YouTube 内部接口和 BotGuard 会变化，必须长期保留。
- YouTube 官方 iframe 错误 `153` 表示 embed 请求缺少 HTTP Referer/客户端身份。回退链路通过受控本地 HTML iframe、`YouTubeEmbedInfo.clientBaseUrl`（公开仓库地址）、`strict-origin-when-cross-origin` 和 `allowfullscreen` 提供合法身份与全屏权限。导航代理需精确放行该 client document URL，否则会误把初始化 base URL 打开到默认浏览器并留下白屏转圈。

## Bilibili

- 少数派“本周看什么”、少数派其他文章与小众软件会稳定返回 `player.bilibili.com/player.html` iframe。2026-07-18 本地文章库检查到最近 5 篇“本周看什么”共 23 个标准 Bilibili embed，因此它属于应正式支持的常见视频媒介，不再作为普通“外部网页”处理。
- `BilibiliEmbedInfo` 只识别精确的官方 player host/path，并要求有效 `bvid` 或 `aid`；支持少数派返回的 HTML entity 查询分隔符和小众软件使用的 protocol-relative URL。
- 只有用户点击后才调用匿名 `x/web-interface/view`（缺少 `cid` 时）、`x/player/playurl` 和 `x/player/v2`。不复用 Folo 登录信息，不接入 Bilibili 登录态，不在未播放态预取封面或媒体。
- 播放地址响应转换成静态 DASH MPD；为保证 macOS WKWebView 和 Android WebView 的共同兼容性，每个画质只选 AVC 轨，并搭配一条最高码率普通音轨。匿名接口实际返回哪些画质就展示哪些，不伪造会员画质。可用字幕会从 Bilibili JSON 转成 WebVTT 后加入同一个 Shaka 设置菜单；字幕准备最多等待 4 秒，超时只舍弃字幕，不能阻塞视频播放。
- 弹幕使用匿名 `x/v2/dm/web/seg.so` Protobuf 接口，以 `cid` 为对象、每 6 分钟一段。loopback 只允许当前播放 session 的正整数分段号，并按视频时长限制最大段；共享网页运行时通过 Protobuf-ES 结构化解析。当前段按需获取并预取下一段，弹幕失败只舍弃该段，不能阻塞视频、触发播放器回退或改变字幕状态。当前只读，不接登录态和发送弹幕。
- Bilibili 弹幕画在 Shaka 页面内部的 Canvas，而不是用 Flutter widget 覆盖 WKWebView。这样系统元素全屏仍保留弹幕，也避免 AppKit platform view 与 Flutter overlay 的层级、命中和性能问题。画布直接使用 `<video>.currentTime`，因此暂停、seek、倍速、内嵌和元素全屏共享时间基准；最多保留 80 条活动弹幕并限制 DPR，避免高密度弹幕拖慢文章滚动。特殊高级弹幕（mode 7）和发送弹幕不在当前范围。控制栏“弹”按钮只切换本次播放的显示状态。
- 详情、播放地址、字幕、MPD、媒体或 Shaka 播放任一环节失败时，自动回退 `player.bilibili.com` 官方 iframe。匿名接口属于兼容性能力而非稳定公开 SDK，因此官方 iframe 必须长期保留；单段弹幕失败不得触发回退。

## 共享播放壳与回退

- YouTube 与 Bilibili 的首选链路共用 `ShakaEmbedPlayer`：创建 WebView、35 秒超时、系统全屏、当前播放器快捷键归属、macOS 触控板文章滚动桥、loading 和错误回退都只维护一份。平台 wrapper 只负责生成各自 loopback URI、缩略图/占位和切回官方播放器；不要再复制一份平台 WebView 控制器。
- YouTube/Bilibili 官方回退仍共用 `WebEmbedVideoPlayer` 的创建、导航、全屏、加载与错误处理。各平台提供独立解析器、API 和媒体白名单，不要下沉成宽泛的“网页播放器”判断。
- WebView 必须懒加载：用户点击后才创建原生 WebView，避免长文章一次创建多个 platform view。YouTube 初始显示固定 `16:9` 缩略图；Bilibili 未播放态使用轻量来源占位，不额外请求 API 获取封面。
- readability 仅保留能被 `YouTubeEmbedInfo` 或 `BilibiliEmbedInfo` 识别的 iframe，仍删除其他 iframe。这个白名单是安全与复杂度边界；新增平台必须使用同样严格的 provider parser，不能直接取消 iframe 清理。
- 网页元素系统全屏需要 `WKPreferences.isElementFullscreenEnabled`（macOS 12.3+）。两个 Shaka 首选播放器及 YouTube/Bilibili 官方回退都通过 `WebKitWebViewController.webViewIdentifier` 与 `MacOSWebViewControls` 通道启用；不要修改 pub cache 或 fork 插件。

## macOS 触控板滚动桥

- macOS 的 WKWebView 会吞掉指针滚轮事件，因此 SABR 本地页面会把菜单外的纵向 wheel delta 按动画帧合并，经 `FourierVideoPlayer` 通道交回文章 `_scrollController.position.pointerScroll()`。该路径不做滤波或补间，确保触控板仍然跟手；分辨率/字幕菜单内部滚动不外传。官方跨域 iframe 回退无法可靠桥接其内部滚轮，这是兼容兜底的已知边界。

## 网络与安全边界

- 运行时页面由进程内 `127.0.0.1` 随机端口提供。路径包含每次进程随机生成的 256-bit 能力令牌；代理只接受 YouTube/GoogleVideo 明确白名单内的 HTTPS 目标，拒绝用户信息、非 443 端口和相似域名，POST 请求体限制为 2 MiB，媒体响应保持流式转发。不要把它改成局域网监听或通用开放代理。
- Bilibili 使用独立的 `127.0.0.1` 随机能力路径服务。媒体代理只接受当前播放 session 中由官方 API 实际返回的完整 HTTPS URL；重定向还必须落在 `bilivideo.com` 或明确的 Akamai 镜像。请求补充 Bilibili Referer/Origin，Range 响应保持流式转发。不要放宽为通用 URL 代理。
- loopback 服务只在用户点击播放后启动。macOS Release 需要 `com.apple.security.network.server` 与 `NSAllowsLocalNetworking`；Android 的 network security config 只对 `localhost/127.0.0.1` 允许明文 HTTP，外部目标继续强制 HTTPS。服务不得监听 `0.0.0.0` 或局域网地址。
- 两条首选链路都必须懒加载。文章初始渲染只显示缩略图，不得静默创建 WebView 或请求 API。
- 上游连接必须有有限连接超时和响应头等待超时；媒体 body 继续流式转发，不设置会截断正常长视频的整流超时。loopback `HttpServer` 的监听错误只记录安全诊断，不能通过根 Zone 升级为应用级未处理异常。

## 已确认但暂不修复的源内容边界

- OpenAI News 的 `Improving health intelligence in ChatGPT`：Folo 条目只有短摘要，没有 media、attachments、video 或 iframe。全文 readability 会从 OpenAI 动态页面留下一个无 `src`/`source` 的 `<audio preload="none">`；它原本属于依赖网页 JavaScript 后续注入资源的“朗读文章”控件，不是视频。不要尝试猜测 OpenAI 的动态音频地址，也不要静默删除该节点；当前把它显示为明确的“音频不可用”状态。
- MarkTechPost 的 `Mira Murati’s Thinking Machines Lab Makes The Technical Case For Human-Centered AI Built On Customizable Model Weights`：对应内容不是视频，而是 `500x500` 的交互式 explainer。原网页用 `iframe srcdoc` 承载完整 HTML/CSS/JavaScript，但 Folo 返回内容已丢失 `srcdoc` 属性名和开头，剩余代码被实体转义后塞入无 `src` iframe，无法可靠还原。当前继续省略/降级比执行残缺任意脚本更安全；若未来支持完整 srcdoc，应从原网页重新抓取，并使用受限、懒加载 WebView 单独设计，不能放宽现有“受支持官方视频 iframe”白名单。
- 无有效 `src/source` 的 audio、video、iframe 不得静默删除，也不得继续伪装成可播放的空播放器。当前保留媒体 chunk，并明确显示“源内容未提供可用的媒体地址”；文章有原始链接时提供“打开原文”。这既暴露源内容/解析问题，又避免误导用户。

## YouTube 客户端回退链（MWEB / IOS）

已确认失败样本 `vO6SWG-jxvE`：WEB 客户端返回 34 个格式但全部只有 SABR 信息（无直接 URL），SABR 报 Shaka 1002 空响应；MWEB 返回 35 个可直接使用的格式，IOS 返回 24 个。

当前实现（`tool/embed_video_player_runtime/src/main.ts`）：

- SABR 仍是 VOD 首选路径。
- SABR 设置或加载失败后，通过 `innertube.getInfo(videoId, { client: 'MWEB' })` 重新获取信息，再生成 `is_sabr=false` 的普通 DASH 并加载。
- MWEB 失败后可继续尝试 `client: 'IOS'`；两者均失败才回退官方 YouTube 嵌入（Dart 侧收到 error 后切换 `WebEmbedVideoPlayer`）。
- 不允许继续用原 WEB/SABR-only response 构建 direct DASH。
- 直播 / PostLiveDVR 仍走官方 manifest 直连，不进入回退链。
- 修改 TypeScript 源码后必须运行 `npm run typecheck && npm run build` 并提交生成的 `assets/embed_video_player/` 产物，不直接手改压缩文件。

本地代理 debug 诊断（仅 debug 构建）：记录目标 host、方法、状态码、重定向次数与错误类型；**不记录**完整签名 URL、Token 或请求体。

## 普通视频过期（带时效签名 CDN）

- 部分微博、微信视频使用带时效签名的 CDN URL，过期后返回 401/403；这**不代表视频文件已删除**。
- `InlineVideoPlayer` 区分错误类型：明确的鉴权/签名失效（401/403/unauthorized/forbidden/signature/expired 等描述）显示“视频链接已过期”并提供“打开原文”；其他播放错误使用通用“视频无法播放”。
- 文章原始 URL 经校验后安全传入播放器错误界面；不自动重新抓取原网页，不猜测替换媒体地址。

## 文章图片缓存统一成功通知

- 正文图片与全屏图片使用同一缓存键（`article_body_v1:<articleId>:<url>`）。
- 新增统一成功路径 `ArticleImageCacheService.notifyImageLoadedSuccessfully`：正文内联加载器与全屏查看器（`ImageGalleryPage`）在图片成功就绪后都调用它；通过微任务延迟执行，可安全用于 build 阶段的 imageBuilder 回调。
- 成功会清除该图的失败登记并推进 success revision，只重建受影响的正文失败占位，不重建整篇文章。
